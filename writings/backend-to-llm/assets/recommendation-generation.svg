<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 784" role="img" aria-labelledby="title desc"><title id="title">推荐与生成共享概率学习</title><desc id="desc">业务任务、模型结构、训练目标是三个维度</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#1b365d"/></marker></defs><style>text{font-family:"Songti SC","STSong",serif;fill:#1b365d}.sub{font-family:"PingFang SC",sans-serif;fill:#77766e;font-size:19px}.name{font-size:27px}.detail{font-family:ui-monospace,"PingFang SC",monospace;font-size:20px;fill:#55584f}</style><rect width="640" height="784" fill="#f5f4ed"/><text x="40" y="55" font-size="32">推荐与生成共享概率学习</text><text x="40" y="90" class="sub">业务任务、模型结构、训练目标是三个维度</text><rect x="40" y="125" width="560" height="105" rx="8" fill="#faf9f5" stroke="#cccdbf"/><text x="65" y="164" class="name">典型点击模型</text><text x="65" y="201" class="detail">输入用户、物品、场景 → 点击概率</text><path d="M320 231 V262" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="271" width="560" height="105" rx="8" fill="#faf9f5" stroke="#cccdbf"/><text x="65" y="310" class="name">典型语言模型</text><text x="65" y="347" class="detail">输入前文 → 词表分布 → 序列</text><path d="M320 377 V408" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="417" width="560" height="105" rx="8" fill="#faf9f5" stroke="#cccdbf"/><text x="65" y="456" class="name">共同基础</text><text x="65" y="493" class="detail">向量、打分、损失、梯度、离线评估</text><path d="M320 523 V554" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="563" width="560" height="105" rx="8" fill="#faf9f5" stroke="#cccdbf"/><text x="65" y="602" class="name">交汇：生成式推荐</text><text x="65" y="639" class="detail">生成物品标识符 → 映射并校验有效物品</text><text x="40" y="759" class="sub">依据 Wide &amp; Deep 与 TIGER 的任务范式归纳。</text></svg>