<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 784" role="img" aria-labelledby="title desc"><title id="title">先做出可观察的小闭环</title><desc id="desc">工程直觉 → 数学解释 → 实验验证</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#1b365d"/></marker></defs><style>text{font-family:"Songti SC","STSong",serif;fill:#1b365d}.sub{font-family:"PingFang SC",sans-serif;fill:#77766e;font-size:19px}.name{font-size:27px}.detail{font-family:ui-monospace,"PingFang SC",monospace;font-size:20px;fill:#55584f}</style><rect width="640" height="784" fill="#f5f4ed"/><text x="40" y="55" font-size="32">先做出可观察的小闭环</text><text x="40" y="90" class="sub">工程直觉 → 数学解释 → 实验验证</text><rect x="40" y="125" width="560" height="105" rx="8" fill="#faf9f5" stroke="#cccdbf"/><text x="65" y="164" class="name">01 · 从分数到概率</text><text x="65" y="201" class="detail">logits → softmax → 下一项分布</text><path d="M320 231 V262" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="271" width="560" height="105" rx="8" fill="#faf9f5" stroke="#cccdbf"/><text x="65" y="310" class="name">02 · 从概率到学习</text><text x="65" y="347" class="detail">预测偏差 → loss → 梯度 → 更新</text><path d="M320 377 V408" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="417" width="560" height="105" rx="8" fill="#faf9f5" stroke="#cccdbf"/><text x="65" y="456" class="name">03 · 从字符到上下文</text><text x="65" y="493" class="detail">Embedding → 因果注意力 → 词表</text><path d="M320 523 V554" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="563" width="560" height="105" rx="8" fill="#faf9f5" stroke="#cccdbf"/><text x="65" y="602" class="name">04 · 从模型到系统</text><text x="65" y="639" class="detail">评估 → 推理服务 → 业务验收</text><text x="40" y="759" class="sub">路线是编写建议，学习进度以实际掌握为准。</text></svg>