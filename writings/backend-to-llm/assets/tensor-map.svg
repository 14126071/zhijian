<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 784" role="img" aria-labelledby="title desc"><title id="title">一个批次怎样穿过模型</title><desc id="desc">教学设定：B=2，T=8，C=12，H=3，V=32</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#1b365d"/></marker></defs><style>text{font-family:"Songti SC","STSong",serif;fill:#1b365d}.sub{font-family:"PingFang SC",sans-serif;fill:#77766e;font-size:19px}.name{font-size:27px}.detail{font-family:ui-monospace,"PingFang SC",monospace;font-size:20px;fill:#55584f}</style><rect width="640" height="784" fill="#f5f4ed"/><text x="40" y="55" font-size="32">一个批次怎样穿过模型</text><text x="40" y="90" class="sub">教学设定：B=2，T=8，C=12，H=3，V=32</text><rect x="40" y="125" width="560" height="105" rx="8" fill="#faf9f5" stroke="#cccdbf"/><text x="65" y="164" class="name">输入：token ID</text><text x="65" y="201" class="detail">[2, 8] → 整数索引，不能直接做语义计算</text><path d="M320 231 V262" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="271" width="560" height="105" rx="8" fill="#faf9f5" stroke="#cccdbf"/><text x="65" y="310" class="name">查表：词元向量 + 位置</text><text x="65" y="347" class="detail">[2, 8, 12] → 每个位置有12个特征</text><path d="M320 377 V408" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="417" width="560" height="105" rx="8" fill="#faf9f5" stroke="#cccdbf"/><text x="65" y="456" class="name">分头：注意力聚合</text><text x="65" y="493" class="detail">Q/K/V [2, 3, 8, 4]；权重 [2, 3, 8, 8]</text><path d="M320 523 V554" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="563" width="560" height="105" rx="8" fill="#faf9f5" stroke="#cccdbf"/><text x="65" y="602" class="name">回到词表：输出原始分数</text><text x="65" y="639" class="detail">logits [2, 8, 32] → 每个位置预测下一项</text><text x="40" y="759" class="sub">数字仅为形状练习；不对应某个商业模型。</text></svg>