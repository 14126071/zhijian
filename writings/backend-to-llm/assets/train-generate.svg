<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 784" role="img" aria-labelledby="title desc"><title id="title">同一模型，两种执行方式</title><desc id="desc">训练可并行处理已知位置；生成要等待新结果</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#1b365d"/></marker></defs><style>text{font-family:"Songti SC","STSong",serif;fill:#1b365d}.sub{font-family:"PingFang SC",sans-serif;fill:#77766e;font-size:19px}.name{font-size:27px}.detail{font-family:ui-monospace,"PingFang SC",monospace;font-size:20px;fill:#55584f}</style><rect width="640" height="784" fill="#f5f4ed"/><text x="40" y="55" font-size="32">同一模型，两种执行方式</text><text x="40" y="90" class="sub">训练可并行处理已知位置；生成要等待新结果</text><rect x="40" y="125" width="560" height="105" rx="8" fill="#faf9f5" stroke="#cccdbf"/><text x="65" y="164" class="name">训练输入：a b c</text><text x="65" y="201" class="detail">目标：b c d；答案来自真实文本的右移</text><path d="M320 231 V262" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="271" width="560" height="105" rx="8" fill="#faf9f5" stroke="#cccdbf"/><text x="65" y="310" class="name">因果约束：只看当前位置及以前</text><text x="65" y="347" class="detail">同时计算各位置的预测，不偷看后文</text><path d="M320 377 V408" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="417" width="560" height="105" rx="8" fill="#faf9f5" stroke="#cccdbf"/><text x="65" y="456" class="name">生成输入：a b c</text><text x="65" y="493" class="detail">只用末位置分布选出新字符 d</text><path d="M320 523 V554" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="563" width="560" height="105" rx="8" fill="#faf9f5" stroke="#cccdbf"/><text x="65" y="602" class="name">追加后继续：a b c d</text><text x="65" y="639" class="detail">KV Cache复用历史中间量；权重不更新</text><text x="40" y="759" class="sub">该图解释标准因果语言模型，不涵盖所有生成架构。</text></svg>