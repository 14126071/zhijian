<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1050"><title>入南京之后：胜负不包办所有判断</title><defs><style>text{font-family:"Songti SC","STSong",serif}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#1b365d" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="#f5f4ed"/><text x="50" y="65" text-anchor="start" font-size="34" fill="#1b365d">入南京之后：胜负不包办所有判断</text><text x="50" y="112" text-anchor="start" font-size="22" fill="#77766e">实际控制、继承名分、个人选择与生命代价，需要分别观察。</text><rect x="50" y="155" width="900" height="118" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="199" text-anchor="start" font-size="29" fill="#1b365d">军事结果：燕军入城，朱棣登上皇位</text><text x="75" y="244" text-anchor="start" font-size="24" fill="#24241f">开门者、援军与行动路线，同样参与塑造最后的结果。</text><path d="M500,281 L500,331" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="350" width="900" height="140" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="389" text-anchor="start" font-size="28" fill="#1b365d">名分与异议</text><text x="75" y="433" text-anchor="start" font-size="23" fill="#24241f">方孝孺拒绝为继位书写诏书；强制不能替代认可。</text><text x="75" y="470" text-anchor="start" font-size="22" fill="#77766e">作者把残暴与不安全感联系起来，这属于心理解释。</text><rect x="50" y="530" width="900" height="140" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="569" text-anchor="start" font-size="28" fill="#1b365d">失败者的行动与遭遇</text><text x="75" y="613" text-anchor="start" font-size="23" fill="#24241f">募兵、抵抗、投降、殉节与受害，不能只由胜败总评。</text><text x="75" y="650" text-anchor="start" font-size="22" fill="#77766e">方案是否奏效、承诺是否坚持、家属付出什么，应分开看。</text><rect x="50" y="710" width="900" height="140" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="749" text-anchor="start" font-size="28" fill="#1b365d">未解决的证据问题</text><text x="75" y="793" text-anchor="start" font-size="23" fill="#24241f">建文下落不明；出逃是作者提出的解释，尚非过程证明。</text><text x="75" y="830" text-anchor="start" font-size="22" fill="#77766e">“十族”、刑罚、人数与个别轶事，本轮未另作史料校勘。</text><text x="50" y="948" text-anchor="start" font-size="24" fill="#1b365d">第1册收尾：取得皇位的能力，不等于对所有手段的正当性证明。</text><text x="50" y="1010" text-anchor="start" font-size="20" fill="#77766e">来源：第31章，PDF第299—310页。助手归纳，非原书插图。</text></svg>