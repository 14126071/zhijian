<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1140"><title>决裂之后：几项任务仍须逐一完成</title><defs><style>text{font-family:"Songti SC","STSong",serif}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#1b365d" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="#f5f4ed"/><text x="50" y="65" text-anchor="start" font-size="34" fill="#1b365d">决裂之后：几项任务仍须逐一完成</text><text x="50" y="112" text-anchor="start" font-size="22" fill="#77766e">按本轮叙事归纳；并非逐日年表，不提前写入后续战果。</text><rect x="50" y="160" width="900" height="152" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="200" text-anchor="start" font-size="28" fill="#1b365d">立足 · 从王府到北平</text><text x="75" y="248" text-anchor="start" font-size="23" fill="#24241f">控制张昺、谢贵 → 夺取城门 → 建立可行动的据点。</text><text x="75" y="289" text-anchor="start" font-size="22" fill="#77766e">局部脱险，还须转为对城池与部队的实际控制。</text><path d="M500,317 L500,347" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="355" width="900" height="152" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="395" text-anchor="start" font-size="28" fill="#1b365d">名义 · “清君侧”与“靖难”</text><text x="75" y="443" text-anchor="start" font-size="23" fill="#24241f">援引祖制讨奸臣，却略去“天子密诏”的条件。</text><text x="75" y="484" text-anchor="start" font-size="22" fill="#77766e">政治声明不是独立证明；有理由的说法，不等于奉诏。</text><path d="M500,512 L500,542" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="550" width="900" height="152" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="590" text-anchor="start" font-size="28" fill="#1b365d">应战 · 怀来、雄县与朝廷主力</text><text x="75" y="638" text-anchor="start" font-size="23" fill="#24241f">利用消息影响军心；夜袭城池、伏击援军。</text><text x="75" y="679" text-anchor="start" font-size="22" fill="#77766e">局部胜利没有消除朝廷的资源与兵力优势。</text><path d="M500,707 L500,737" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="745" width="900" height="152" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="785" text-anchor="start" font-size="28" fill="#1b365d">扩充 · 守北平与争取宁王力量</text><text x="75" y="833" text-anchor="start" font-size="23" fill="#24241f">朱高炽承担守城；朱棣外出，以收买与胁迫获取部众。</text><text x="75" y="874" text-anchor="start" font-size="22" fill="#77766e">守城承诺尚待检验；本轮止于宁王被控制后的收尾。</text><rect x="50" y="965" width="900" height="85" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="1015" text-anchor="start" font-size="25" fill="#1b365d">名分、据点、军心与兵力，各自需要条件，不能互相代替。</text><text x="50" y="1100" text-anchor="start" font-size="20" fill="#77766e">来源：第26—27章，PDF第246—260页。助手归纳；箭头表示叙事推进。</text></svg>