<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1120"><title>废相之后：权力集中，任务仍然存在</title><defs><style>text{font-family:"Songti SC","STSong",serif}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#1b365d" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="#f5f4ed"/><text x="50" y="65" text-anchor="start" font-size="34" fill="#1b365d">废相之后：权力集中，任务仍然存在</text><text x="50" y="112" text-anchor="start" font-size="23" fill="#77766e">简化关系图：突出行政协调；并非完整明代官制。</text><text x="50" y="165" text-anchor="start" font-size="28" fill="#1b365d">废相前 · 经中书省协调</text><rect x="170" y="195" width="660" height="92" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="500" y="231" text-anchor="middle" font-size="28" fill="#1b365d">皇帝</text><text x="500" y="267" text-anchor="middle" font-size="23" fill="#77766e">最高决断</text><path d="M500,289 L500,330" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="170" y="335" width="660" height="92" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="500" y="371" text-anchor="middle" font-size="28" fill="#1b365d">中书省 · 丞相</text><text x="500" y="407" text-anchor="middle" font-size="23" fill="#77766e">统筹与协调政务</text><path d="M500,429 L500,470" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="170" y="475" width="660" height="92" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="500" y="511" text-anchor="middle" font-size="28" fill="#1b365d">六部</text><text x="500" y="547" text-anchor="middle" font-size="23" fill="#77766e">分掌具体事务</text><text x="50" y="628" text-anchor="start" font-size="28" fill="#1b365d">1380年 · 撤中书省、废丞相</text><rect x="100" y="660" width="800" height="86" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="500" y="695" text-anchor="middle" font-size="28" fill="#1b365d">皇帝</text><text x="500" y="730" text-anchor="middle" font-size="23" fill="#77766e">直接面对六部；更多协调与决断集中于此</text><path d="M500,750 L500,795" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="100" y="803" width="800" height="86" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="500" y="838" text-anchor="middle" font-size="28" fill="#1b365d">六部</text><text x="500" y="872" text-anchor="middle" font-size="23" fill="#77766e">部门事务仍在，跨部门协调需求也仍在</text><rect x="50" y="934" width="900" height="108" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="971" text-anchor="start" font-size="25" fill="#1b365d">同章另两项变化：军事机构分为五军都督府</text><text x="75" y="1010" text-anchor="start" font-size="23" fill="#24241f">侦察、抓捕与追究强化；不能据此视为权力已有稳定约束。</text><text x="50" y="1080" text-anchor="start" font-size="20" fill="#77766e">来源：第17章，PDF第138—145页。箭头仅示行政层级，不表示全部权限。</text></svg>