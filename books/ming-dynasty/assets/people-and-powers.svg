<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1600" role="img" aria-labelledby="title desc"><title id="title">前七章的人物与势力关系</title><desc id="desc">上半部为朱元璋起步时的关系，下半部为应天周边竞争；不按地理位置排列。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif;fill:#262820}.blue{fill:#1b365d}.muted{fill:#77766e}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#f5f4ed"/><text x="55" y="55" font-size="22" class="blue" text-anchor="start">明朝那些事儿 · 前七章人物索引</text><text x="55" y="110" font-size="34" class="" text-anchor="start">支持与牵制，常在同一段关系里</text><text x="55" y="155" font-size="24" class="muted" text-anchor="start">一 · 起步阶段的人际联系（第3—6章）</text><path d="M440 245H558" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><path d="M250 310V442H348" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><path d="M750 310V442H652" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><path d="M195 645V560H400V502" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><path d="M500 645V502" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><path d="M805 645V560H600V502" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="185" width="380" height="125" rx="7" fill="#faf9f5" stroke="#d9d9ce"/><rect x="560" y="185" width="380" height="125" rx="7" fill="#faf9f5" stroke="#d9d9ce"/><rect x="350" y="390" width="300" height="112" rx="7" fill="#faf9f5" stroke="#d9d9ce"/><rect x="60" y="645" width="270" height="135" rx="7" fill="#faf9f5" stroke="#d9d9ce"/><rect x="365" y="645" width="270" height="135" rx="7" fill="#faf9f5" stroke="#d9d9ce"/><rect x="670" y="645" width="270" height="135" rx="7" fill="#faf9f5" stroke="#d9d9ce"/><text x="250" y="225" font-size="29" class="blue" text-anchor="middle">郭子兴</text><text x="250" y="272" font-size="22" class="" text-anchor="middle">主帅，也是早期机会的提供者</text><text x="750" y="225" font-size="29" class="blue" text-anchor="middle">马姑娘</text><text x="750" y="272" font-size="22" class="" text-anchor="middle">婚姻与危难时的相助</text><text x="500" y="225" font-size="18" class="muted" text-anchor="middle">义父 / 义女</text><text x="65" y="342" font-size="22" class="muted" text-anchor="start">收留、提拔</text><text x="65" y="375" font-size="22" class="muted" text-anchor="start">也有猜疑</text><text x="790" y="353" font-size="22" class="muted" text-anchor="start">婚姻与支持</text><text x="500" y="438" font-size="34" class="blue" text-anchor="middle">朱元璋</text><text x="500" y="476" font-size="22" class="" text-anchor="middle">从亲兵到独立带兵者</text><text x="195" y="685" font-size="29" class="blue" text-anchor="middle">汤和</text><text x="195" y="724" font-size="23" class="" text-anchor="middle">旧友引荐投军</text><text x="195" y="757" font-size="21" class="muted" text-anchor="middle">早期支持</text><text x="500" y="685" font-size="29" class="blue" text-anchor="middle">徐达等人</text><text x="500" y="724" font-size="23" class="" text-anchor="middle">核心班底</text><text x="500" y="757" font-size="21" class="muted" text-anchor="middle">徐达代换人质</text><text x="805" y="685" font-size="29" class="blue" text-anchor="middle">李善长</text><text x="805" y="724" font-size="23" class="" text-anchor="middle">文书与谋划</text><text x="805" y="757" font-size="21" class="muted" text-anchor="middle">提供政治方向</text><text x="60" y="835" font-size="24" class="" text-anchor="start">另一个关键补充：俞通海带来渡江所需的水上力量。</text><path d="M55 880H945" stroke="#d9d9ce"/><text x="55" y="930" font-size="24" class="muted" text-anchor="start">二 · 应天立足后的外部处境（第6—7章）</text><path d="M558 1020H442" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="975" width="380" height="115" rx="7" fill="#faf9f5" stroke="#d9d9ce"/><rect x="560" y="975" width="380" height="115" rx="7" fill="#faf9f5" stroke="#d9d9ce"/><text x="250" y="1025" font-size="30" class="blue" text-anchor="middle">元军</text><text x="250" y="1063" font-size="21" class="" text-anchor="middle">想对付朱元璋，但受到牵制</text><text x="750" y="1025" font-size="30" class="blue" text-anchor="middle">刘福通部</text><text x="750" y="1063" font-size="22" class="" text-anchor="middle">在北面牵制元军</text><text x="500" y="1001" font-size="20" class="muted" text-anchor="middle">牵制</text><path d="M440 1218H558" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="1155" width="380" height="130" rx="7" fill="#faf9f5" stroke="#d9d9ce"/><rect x="560" y="1155" width="380" height="130" rx="7" fill="#faf9f5" stroke="#d9d9ce"/><text x="250" y="1200" font-size="29" class="blue" text-anchor="middle">朱元璋 · 应天</text><text x="250" y="1244" font-size="21" class="" text-anchor="middle">获得基地，仍需面对周围势力</text><text x="750" y="1200" font-size="27" class="blue" text-anchor="middle">张士诚 / 徐寿辉势力</text><text x="750" y="1244" font-size="22" class="" text-anchor="middle">同样反元，彼此仍有竞争</text><text x="500" y="1200" font-size="20" class="muted" text-anchor="middle">竞争</text><rect x="60" y="1330" width="880" height="115" rx="7" fill="#faf9f5" stroke="#d9d9ce"/><text x="85" y="1366" font-size="23" class="blue" text-anchor="start">第七章中的另一条内部关系</text><text x="85" y="1406" font-size="24" class="" text-anchor="start">徐寿辉 ← 倪文俊谋害未成；倪投奔陈友谅后被杀。</text><text x="60" y="1490" font-size="23" class="muted" text-anchor="start">陈友谅由此进入叙述中心；后续发展未纳入本轮。</text><text x="60" y="1535" font-size="21" class="muted" text-anchor="start">来源：PDF第14—30页。箭头表示所标关系，不代表统一的指挥链。</text><text x="60" y="1570" font-size="21" class="muted" text-anchor="start">示意图不按地理方位排列；非原书插图。</text></svg>