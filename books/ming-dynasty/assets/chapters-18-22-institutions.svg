<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1070"><title>制度怎样面对变化：身份不等于能力</title><defs><style>text{font-family:"Songti SC","STSong",serif}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#1b365d" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="#f5f4ed"/><text x="50" y="65" text-anchor="start" font-size="34" fill="#1b365d">制度怎样面对变化：身份不等于能力</text><text x="50" y="112" text-anchor="start" font-size="22" fill="#77766e">本书的“历史规则”，可以拆成更具体的需求与反馈。</text><rect x="50" y="150" width="900" height="133" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="187" text-anchor="start" font-size="28" fill="#1b365d">固定安排：让人、职责与位置可预期</text><text x="75" y="229" text-anchor="start" font-size="23" fill="#24241f">世袭户籍、服饰等级、路引与行政分工。</text><text x="75" y="265" text-anchor="start" font-size="22" fill="#77766e">朝廷据此征发、辨认身份，并安排事务。</text><path d="M500,288 L500,328" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="335" width="900" height="133" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="372" text-anchor="start" font-size="28" fill="#1b365d">条件变化：人口、技能、生产与交易</text><text x="75" y="414" text-anchor="start" font-size="23" fill="#24241f">后代未必具备原有技能，人们的需要也会改变。</text><text x="75" y="450" text-anchor="start" font-size="22" fill="#77766e">规则所依据的环境，不会永久停在建国时刻。</text><path d="M500,473 L500,513" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="520" width="900" height="133" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="557" text-anchor="start" font-size="28" fill="#1b365d">差距出现：名册、资源与实际需求脱节</text><text x="75" y="599" text-anchor="start" font-size="23" fill="#24241f">规定谁办事，不能替代经费、能力与真实信息。</text><text x="75" y="635" text-anchor="start" font-size="22" fill="#77766e">只加重违令处罚，未必能补上这些差距。</text><path d="M500,658 L500,698" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="705" width="900" height="133" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="742" text-anchor="start" font-size="28" fill="#1b365d">调整问题：怎样承认差异、修改规则</text><text x="75" y="784" text-anchor="start" font-size="23" fill="#24241f">观察执行后果，让困难可以反馈，并检验替代办法。</text><text x="75" y="820" text-anchor="start" font-size="22" fill="#77766e">这是助手提出的追问，不是本书已经给出的完整方案。</text><text x="50" y="940" text-anchor="start" font-size="25" fill="#1b365d">读后提示：后来发生变化，不等于最初的规则从未发挥作用。</text><text x="50" y="1025" text-anchor="start" font-size="20" fill="#77766e">来源：第22章，PDF第196—203页。助手归纳；非制度演变的必然公式。</text></svg>