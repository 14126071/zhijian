<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1120"><title>蓝玉北征：胜利依靠哪些条件</title><defs><style>text{font-family:"Songti SC","STSong",serif}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#1b365d" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="#f5f4ed"/><text x="50" y="65" text-anchor="start" font-size="34" fill="#1b365d">蓝玉北征：胜利依靠哪些条件</text><text x="50" y="112" text-anchor="start" font-size="22" fill="#77766e">按本书事件组织；流程示意，不是精确路线或比例地图。</text><text x="50" y="165" text-anchor="start" font-size="28" fill="#1b365d">1387 · 针对纳哈出的行动</text><rect x="50" y="193" width="430" height="140" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="231" text-anchor="start" font-size="27" fill="#1b365d">军事推进</text><text x="75" y="274" text-anchor="start" font-size="24" fill="#24241f">突袭庆州、主力进军</text><text x="75" y="311" text-anchor="start" font-size="22" fill="#77766e">形成直接军事压力</text><rect x="520" y="193" width="430" height="140" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="545" y="231" text-anchor="start" font-size="27" fill="#1b365d">劝降与安置</text><text x="545" y="274" text-anchor="start" font-size="24" fill="#24241f">传递归附条件与利益安排</text><text x="545" y="311" text-anchor="start" font-size="22" fill="#77766e">影响对方是否愿意归附</text><path d="M265,338 L370,388" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><path d="M735,338 L630,388" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="400" width="900" height="100" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="438" text-anchor="start" font-size="27" fill="#1b365d">受降仍需维护信任</text><text x="75" y="478" text-anchor="start" font-size="23" fill="#24241f">宴席冲突险些毁掉成果；安抚与解释使局势平息。</text><text x="50" y="560" text-anchor="start" font-size="28" fill="#1b365d">1388 · 捕鱼儿海作战</text><rect x="50" y="590" width="900" height="133" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="627" text-anchor="start" font-size="28" fill="#1b365d">寻找目标：粮水与时间限制</text><text x="75" y="669" text-anchor="start" font-size="23" fill="#24241f">继续还是撤退？本书突出蓝玉的经验、判断与冒险。</text><text x="75" y="705" text-anchor="start" font-size="22" fill="#77766e">不能由最后获胜，倒推“直觉一定正确”。</text><path d="M500,728 L500,761" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="767" width="900" height="133" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="804" text-anchor="start" font-size="28" fill="#1b365d">隐蔽接近：发现踪迹后发动突袭</text><text x="75" y="846" text-anchor="start" font-size="23" fill="#24241f">控制炊烟、先锋行动与风沙条件，一起进入战斗过程。</text><text x="75" y="882" text-anchor="start" font-size="22" fill="#77766e">能力、组织与偶发条件共同作用。</text><text x="50" y="970" text-anchor="start" font-size="25" fill="#1b365d">结果边界：重创统治集团 ≠ 草原政治与边境威胁永久终结。</text><text x="50" y="1070" text-anchor="start" font-size="20" fill="#77766e">来源：第20章，PDF第173—189页。助手归纳；不采用有疑点的地理括注。</text></svg>