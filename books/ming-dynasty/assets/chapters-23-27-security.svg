<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1120"><title>同一套分封安排，两种安全问题</title><defs><style>text{font-family:"Songti SC","STSong",serif}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#1b365d" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="#f5f4ed"/><text x="50" y="65" text-anchor="start" font-size="34" fill="#1b365d">同一套分封安排，两种安全问题</text><text x="50" y="112" text-anchor="start" font-size="22" fill="#77766e">亲属关系、继承名分与军事能力，没有自动指向同一目标。</text><rect x="50" y="155" width="900" height="115" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="198" text-anchor="start" font-size="29" fill="#1b365d">原来的目标：诸王守边，保护继承人</text><text x="75" y="243" text-anchor="start" font-size="24" fill="#24241f">边地指挥、部众与作战经验，使亲王具有实际军事能力。</text><path d="M310,275 L265,333" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><path d="M690,275 L735,333" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="350" width="430" height="164" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="392" text-anchor="start" font-size="27" fill="#1b365d">新皇帝看到的风险</text><text x="75" y="439" text-anchor="start" font-size="23" fill="#24241f">名分在朝廷，强将却在边地。</text><text x="75" y="484" text-anchor="start" font-size="23" fill="#77766e">如果诸王不服，怎样约束？</text><rect x="520" y="350" width="430" height="164" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="545" y="392" text-anchor="start" font-size="27" fill="#1b365d">燕王看到的风险</text><text x="545" y="439" text-anchor="start" font-size="23" fill="#24241f">削藩已经发生，地位会否丧失？</text><text x="545" y="484" text-anchor="start" font-size="23" fill="#77766e">即使服从，能否保证安全？</text><text x="50" y="583" text-anchor="start" font-size="28" fill="#1b365d">本轮呈现的升级链条</text><rect x="50" y="612" width="900" height="102" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="650" text-anchor="start" font-size="26" fill="#1b365d">朝廷削藩、调任官员并部署军队</text><text x="75" y="692" text-anchor="start" font-size="23" fill="#24241f">试图减少潜在威胁，也使燕王更警惕。</text><path d="M500,717 L500,737" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="742" width="900" height="102" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="780" text-anchor="start" font-size="26" fill="#1b365d">燕王秘密准备、招募部众并搜集消息</text><text x="75" y="822" text-anchor="start" font-size="23" fill="#24241f">试图争取行动能力，也加深朝廷的怀疑。</text><path d="M500,847 L500,867" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="872" width="900" height="102" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="910" text-anchor="start" font-size="26" fill="#1b365d">告发、逮捕命令与王府脱险</text><text x="75" y="952" text-anchor="start" font-size="23" fill="#24241f">信息传递与执行者选择，改变了行动先后。</text><text x="50" y="1043" text-anchor="start" font-size="23" fill="#1b365d">解释边界：压力有助于解释选择，不等于证明战争必然或动武正当。</text><text x="50" y="1090" text-anchor="start" font-size="20" fill="#77766e">来源：第23—26章，PDF第208—248页。助手归纳，非完整官制或兵力图。</text></svg>