<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1110"><title>从平江到岭北：统一战争并非直线</title><defs><style>text{font-family:"Songti SC","STSong",serif}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#1b365d" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="#f5f4ed"/><text x="50" y="65" text-anchor="start" font-size="34" fill="#1b365d">从平江到岭北：统一战争并非直线</text><text x="50" y="112" text-anchor="start" font-size="23" fill="#77766e">军事进展与建国同时发生；大都失守后，北元仍能组织反击。</text><rect x="50" y="150" width="900" height="143" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="187" text-anchor="start" font-size="28" fill="#1b365d">1367 · 平江失守</text><text x="75" y="230" text-anchor="start" font-size="23" fill="#24241f">清除外围、持续围困 → 张士诚势力被平定。</text><text x="75" y="269" text-anchor="start" font-size="22" fill="#77766e">城池的抵抗能力，也依靠周边的支援和退路。</text><path d="M500,296 L500,318" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="322" width="900" height="143" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="359" text-anchor="start" font-size="28" fill="#1b365d">1367—1368 · 北伐与建明</text><text x="75" y="402" text-anchor="start" font-size="23" fill="#24241f">山东、河南 → 大都；朱元璋在北伐期间称帝。</text><text x="75" y="441" text-anchor="start" font-size="22" fill="#77766e">攻入政治中心，并不等于消灭全部军事力量。</text><path d="M500,468 L500,490" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="494" width="900" height="143" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="531" text-anchor="start" font-size="28" fill="#1b365d">1369—1370 · 继续北进</text><text x="75" y="574" text-anchor="start" font-size="23" fill="#24241f">太原等战事之后，常遇春病逝；徐达、李文忠继续作战。</text><text x="75" y="613" text-anchor="start" font-size="22" fill="#77766e">王保保仍是强敌；定西、应昌的胜利也未终结对抗。</text><path d="M500,640 L500,662" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="666" width="900" height="143" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="703" text-anchor="start" font-size="28" fill="#1b365d">1372 · 三路远征的反折</text><text x="75" y="746" text-anchor="start" font-size="23" fill="#24241f">中路受挫，东路苦战撤回，西路取得较好战果。</text><text x="75" y="785" text-anchor="start" font-size="22" fill="#77766e">整体未能消灭北元；评价不能只选一路的结果。</text><rect x="50" y="838" width="900" height="143" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="875" text-anchor="start" font-size="28" fill="#1b365d">阅读提示 · 两种时间顺序</text><text x="75" y="918" text-anchor="start" font-size="23" fill="#24241f">第14—15章推进战事；第16章回叙恢复生产与选官。</text><text x="75" y="957" text-anchor="start" font-size="22" fill="#77766e">军事统一与制度建设，是交织的两条线。</text><text x="50" y="1072" text-anchor="start" font-size="20" fill="#77766e">来源：第13—16章，PDF第76—132页。助手归纳；时间不按比例。</text></svg>