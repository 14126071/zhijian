<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1015"><title>从龙湾到鄱阳湖：优势怎样改变</title><defs><style>text{font-family:"Songti SC","STSong",serif;fill:#24241f}</style></defs><rect width="100%" height="100%" fill="#f5f4ed"/><text x="50" y="65" font-size="34" style="fill:#1b365d">从龙湾到鄱阳湖：优势怎样改变</text><text x="50" y="112" font-size="22" style="fill:#77766e">按本轮叙事整理；顺序示意，不按年数比例。</text><rect x="50" y="150" width="900" height="130" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="185" font-size="27" style="fill:#1b365d">1360 · 龙湾解围｜第9章</text><text x="75" y="225" font-size="24" style="fill:#24241f">假消息、改桥与登陆安排，将水军优势引向陆上伏击。</text><text x="75" y="260" font-size="22" style="fill:#77766e">战胜并缴获船只，但陈友谅仍有恢复实力的条件。</text><text x="480" y="301" font-size="24" style="fill:#1b365d">↓</text><rect x="50" y="305" width="900" height="130" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="340" font-size="27" style="fill:#1b365d">1363 · 安丰与庐州｜第10章</text><text x="75" y="380" font-size="24" style="fill:#24241f">救援之后转攻坚城，朱元璋主力被牵住。</text><text x="75" y="415" font-size="22" style="fill:#77766e">过去成功带来的自信，不能代替对新局势的判断。</text><text x="480" y="456" font-size="24" style="fill:#1b365d">↓</text><rect x="50" y="460" width="900" height="130" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="495" font-size="27" style="fill:#1b365d">1363 · 洪都守城｜第11章</text><text x="75" y="535" font-size="24" style="fill:#24241f">分门防守、临时工事、火力与增援，反复阻止突破。</text><text x="75" y="570" font-size="22" style="fill:#77766e">守军以伤亡换来时间；求援促成主力重新集中。</text><text x="480" y="611" font-size="24" style="fill:#1b365d">↓</text><rect x="50" y="615" width="900" height="130" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="650" font-size="27" style="fill:#1b365d">1363 · 鄱阳湖｜第12章</text><text x="75" y="690" font-size="24" style="fill:#24241f">分队突击、火攻、掩护旗舰，继以封锁和消耗。</text><text x="75" y="725" font-size="22" style="fill:#77766e">胜负不在一次攻击结束；装备、组织与军心共同作用。</text><text x="480" y="766" font-size="24" style="fill:#1b365d">↓</text><rect x="50" y="770" width="900" height="130" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="805" font-size="27" style="fill:#1b365d">1364 · 武昌收尾｜第12章</text><text x="75" y="845" font-size="24" style="fill:#24241f">陈友谅死后，原书继续叙述陈理一方的归降。</text><text x="75" y="880" font-size="22" style="fill:#77766e">章末转入军队供养与土地关系，开始追问统治问题。</text><text x="50" y="985" font-size="19" style="fill:#77766e">来源：PDF第34—76页。阶段与因果连接为阅读归纳，非原书插图。</text></svg>