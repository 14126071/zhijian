<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1130"><title>肃贪中的反馈：惩罚之后，信息会怎样变</title><defs><style>text{font-family:"Songti SC","STSong",serif}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#1b365d" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="#f5f4ed"/><text x="50" y="65" text-anchor="start" font-size="34" fill="#1b365d">肃贪中的反馈：惩罚之后，信息会怎样变</text><text x="50" y="112" text-anchor="start" font-size="22" fill="#77766e">目标、信息、裁决与后果要分别观察；这是阅读分析框架。</text><rect x="50" y="150" width="900" height="133" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="187" text-anchor="start" font-size="28" fill="#1b365d">治理目标：减少官吏侵害</text><text x="75" y="229" text-anchor="start" font-size="23" fill="#24241f">朱元璋重视肃贪，采用检举、侦察与严刑。</text><text x="75" y="265" text-anchor="start" font-size="22" fill="#77766e">强烈意愿不自动保证每一次判断准确。</text><path d="M500,288 L500,322" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="328" width="900" height="133" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="365" text-anchor="start" font-size="28" fill="#1b365d">信息进入：速度、来源与可核对性</text><text x="75" y="407" text-anchor="start" font-size="23" fill="#24241f">道同案：奏报有先后，裁决可能快于核对。</text><text x="75" y="443" text-anchor="start" font-size="22" fill="#77766e">空印案：流程难题的解释，未能阻止处罚。</text><path d="M500,466 L500,500" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="506" width="900" height="133" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="543" text-anchor="start" font-size="28" fill="#1b365d">追究扩大：从个案到更多“同党”</text><text x="75" y="585" text-anchor="start" font-size="23" fill="#24241f">郭桓案：贪污指控、巨额数字与跨部门牵连。</text><text x="75" y="621" text-anchor="start" font-size="22" fill="#77766e">指控存在、数量可信、每人有罪，需要分别证明。</text><path d="M500,644 L500,678" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="684" width="900" height="133" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="721" text-anchor="start" font-size="28" fill="#1b365d">后续反馈：恐惧、沉默与行政缺人</text><text x="75" y="763" text-anchor="start" font-size="23" fill="#24241f">不敢解释、避祸与戴罪办事，出现在原书叙事中。</text><text x="75" y="799" text-anchor="start" font-size="22" fill="#77766e">如果解释也有风险，皇帝下一次得到的信息可能更差。</text><rect x="50" y="895" width="900" height="125" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="935" text-anchor="start" font-size="27" fill="#1b365d">需要追问的环节</text><text x="75" y="977" text-anchor="start" font-size="25" fill="#24241f">怎样核对材料、区分责任，并让真实困难能够上达？</text><text x="50" y="1085" text-anchor="start" font-size="20" fill="#77766e">来源：第18—19章，PDF第153—170页。反馈联系为助手归纳，非统计结论。</text></svg>