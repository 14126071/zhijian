<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1320" role="img" aria-labelledby="title desc"><title id="title">从求生到立足：前七章的处境变化</title><desc id="desc">五阶段阅读归纳，时间不按比例；末段止于应天立足及对手登场。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif;fill:#262820}.blue{fill:#1b365d}.muted{fill:#77766e}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#f5f4ed"/><text x="55" y="55" font-size="22" class="blue" text-anchor="start">明朝那些事儿 · 第1册第1—7章</text><text x="55" y="110" font-size="34" class="" text-anchor="start">改变的，先是处境，再是能做的事</text><text x="55" y="155" font-size="22" class="muted" text-anchor="start">时间线是阅读归纳，不表示称帝是早已注定的终点。</text><path d="M85 222V1125" stroke="#c8c7b9" stroke-width="3"/><circle cx="85" cy="237" r="25" fill="#1b365d"/><text x="85" y="245" font-size="22" text-anchor="middle" style="fill:#faf9f5">01</text><rect x="135" y="205" width="810" height="162" rx="7" fill="#faf9f5" stroke="#d9d9ce"/><text x="160" y="240" font-size="25" class="blue" text-anchor="start">1328年起</text><text x="920" y="240" font-size="20" class="muted" text-anchor="end">第1章 · PDF 5—7</text><text x="160" y="279" font-size="28" class="" text-anchor="start">贫困家庭中的普通期待</text><text x="160" y="316" font-size="23" class="" text-anchor="start">放牛、成家、养育儿女。</text><text x="160" y="349" font-size="21" class="muted" text-anchor="start">先看他想维持什么，而不是预设他注定成为谁。</text><circle cx="85" cy="421" r="25" fill="#1b365d"/><text x="85" y="429" font-size="22" text-anchor="middle" style="fill:#faf9f5">02</text><rect x="135" y="389" width="810" height="162" rx="7" fill="#faf9f5" stroke="#d9d9ce"/><text x="160" y="424" font-size="25" class="blue" text-anchor="start">1344年起</text><text x="920" y="424" font-size="20" class="muted" text-anchor="end">第2章 · PDF 7—11</text><text x="160" y="463" font-size="28" class="" text-anchor="start">原有庇护接连失效</text><text x="160" y="500" font-size="23" class="" text-anchor="start">失亲 → 入寺 → 外出游方。</text><text x="160" y="533" font-size="21" class="muted" text-anchor="start">家庭与寺院都无法提供稳定的生存依靠。</text><circle cx="85" cy="605" r="25" fill="#1b365d"/><text x="85" y="613" font-size="22" text-anchor="middle" style="fill:#faf9f5">03</text><rect x="135" y="573" width="810" height="162" rx="7" fill="#faf9f5" stroke="#d9d9ce"/><text x="160" y="608" font-size="25" class="blue" text-anchor="start">1351—1352年</text><text x="920" y="608" font-size="20" class="muted" text-anchor="end">第3—4章 · PDF 11—19</text><text x="160" y="647" font-size="28" class="" text-anchor="start">留下、逃跑、投军的风险改变</text><text x="160" y="684" font-size="23" class="" text-anchor="start">汤和来信与告发威胁，推动投军抉择。</text><text x="160" y="717" font-size="21" class="muted" text-anchor="start">进入郭子兴部后，以表现和关系逐渐获得信任。</text><circle cx="85" cy="789" r="25" fill="#1b365d"/><text x="85" y="797" font-size="22" text-anchor="middle" style="fill:#faf9f5">04</text><rect x="135" y="757" width="810" height="162" rx="7" fill="#faf9f5" stroke="#d9d9ce"/><text x="160" y="792" font-size="25" class="blue" text-anchor="start">独立带兵后</text><text x="920" y="792" font-size="20" class="muted" text-anchor="end">第4—5章 · PDF 18—23</text><text x="160" y="831" font-size="28" class="" text-anchor="start">把一群人变成能行动的力量</text><text x="160" y="868" font-size="23" class="" text-anchor="start">核心班底 + 纪律训练 + 谋划 + 据点。</text><text x="160" y="901" font-size="21" class="muted" text-anchor="start">人数增长之外，还要处理粮食与内部关系。</text><circle cx="85" cy="973" r="25" fill="#1b365d"/><text x="85" y="981" font-size="22" text-anchor="middle" style="fill:#faf9f5">05</text><rect x="135" y="941" width="810" height="162" rx="7" fill="#faf9f5" stroke="#d9d9ce"/><text x="160" y="976" font-size="25" class="blue" text-anchor="start">1355—1356年起</text><text x="920" y="976" font-size="20" class="muted" text-anchor="end">第6—7章 · PDF 23—30</text><text x="160" y="1015" font-size="28" class="" text-anchor="start">从渡江攻城，走到应天立足</text><text x="160" y="1052" font-size="23" class="" text-anchor="start">俞通海补上水军条件；两次失利后再夺集庆。</text><text x="160" y="1085" font-size="21" class="muted" text-anchor="start">周边势力相互牵制，张士诚与陈友谅进入视野。</text><text x="55" y="1195" font-size="27" class="blue" text-anchor="start">到第七章为止：有了立足点，还没有完成统一。</text><text x="55" y="1244" font-size="21" class="muted" text-anchor="start">来源：本文件PDF第5—30页；人物心理描写按作者解释理解。</text><text x="55" y="1280" font-size="21" class="muted" text-anchor="start">示意图由阅读笔记绘制；非原书插图、非等比例年表。</text></svg>