<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 705"><title>三段战事，改变三种条件</title><defs><style>text{font-family:"Songti SC","STSong",serif;fill:#24241f}</style></defs><rect width="100%" height="100%" fill="#f5f4ed"/><text x="50" y="65" font-size="34" style="fill:#1b365d">三段战事，改变三种条件</text><text x="50" y="112" font-size="22" style="fill:#77766e">这是解释结构，不是按比例的地理或兵力图。</text><rect x="50" y="150" width="900" height="130" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="185" font-size="27" style="fill:#1b365d">龙湾：改变交战地点</text><text x="75" y="225" font-size="24" style="fill:#24241f">水上巨舰占优 → 引导登陆 → 伏击与预备队投入。</text><text x="75" y="260" font-size="22" style="fill:#77766e">关键：让对方难以按原来的优势方式作战。</text><text x="480" y="301" font-size="24" style="fill:#1b365d">↓</text><rect x="50" y="305" width="900" height="130" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="340" font-size="27" style="fill:#1b365d">洪都：改变可用时间</text><text x="75" y="380" font-size="24" style="fill:#24241f">缺口出现 → 火力阻滞与机动增援 → 修墙、接续防守。</text><text x="75" y="415" font-size="22" style="fill:#77766e">关键：保存据点、消耗攻方，为援军集中争取时间。</text><text x="480" y="456" font-size="24" style="fill:#1b365d">↓</text><rect x="50" y="460" width="900" height="130" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="495" font-size="27" style="fill:#1b365d">鄱阳湖：调整作战方式</text><text x="75" y="535" font-size="24" style="fill:#24241f">分队近战反复 → 等风火攻 → 通道控制与持续消耗。</text><text x="75" y="570" font-size="22" style="fill:#77766e">关键：面对敌方反应不断调整，而不是照搬龙湾计策。</text><text x="50" y="675" font-size="19" style="fill:#77766e">来源：PDF第40—43、53—62、65—74页。助手归纳，非单一胜因公式。</text></svg>