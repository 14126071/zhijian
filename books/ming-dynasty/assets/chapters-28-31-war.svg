<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1150"><title>靖难后半程：胜利与挫折交替出现</title><defs><style>text{font-family:"Songti SC","STSong",serif}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#1b365d" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="#f5f4ed"/><text x="50" y="65" text-anchor="start" font-size="34" fill="#1b365d">靖难后半程：胜利与挫折交替出现</text><text x="50" y="112" text-anchor="start" font-size="22" fill="#77766e">按第28—31章叙事整理；时间不按比例，不是完整行军路线。</text><rect x="50" y="150" width="900" height="140" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="189" text-anchor="start" font-size="27" fill="#1b365d">北平、郑村坝 · 保存据点，迎回主力</text><text x="75" y="233" text-anchor="start" font-size="23" fill="#24241f">朱高炽组织防御；朱棣归来进攻，李景隆败退。</text><text x="75" y="270" text-anchor="start" font-size="22" fill="#77766e">守城、突击、指挥协同与严寒，共同影响结果。</text><path d="M500,296 L500,323" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="330" width="900" height="140" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="369" text-anchor="start" font-size="27" fill="#1b365d">白沟河 · 危局后的逆转</text><text x="75" y="413" text-anchor="start" font-size="23" fill="#24241f">平安、瞿能等使燕军陷入苦战；原书写大风改变局势。</text><text x="75" y="450" text-anchor="start" font-size="22" fill="#77766e">偶发条件不能直接算作统帅能力或天命。</text><path d="M500,476 L500,503" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="510" width="900" height="140" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="549" text-anchor="start" font-size="27" fill="#1b365d">济南、东昌 · 对手学习并反击</text><text x="75" y="593" text-anchor="start" font-size="23" fill="#24241f">铁铉与盛庸守住济南；东昌以火器、弓弩及部署迎击。</text><text x="75" y="630" text-anchor="start" font-size="22" fill="#77766e">朱棣突围，张玉阵亡；强敌没有因此前失败而消失。</text><path d="M500,656 L500,683" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="690" width="900" height="140" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="729" text-anchor="start" font-size="27" fill="#1b365d">夹河之后 · 赢得局部，仍难持久</text><text x="75" y="773" text-anchor="start" font-size="23" fill="#24241f">双方继续作战，燕军稳定地域与资源较少。</text><text x="75" y="810" text-anchor="start" font-size="22" fill="#77766e">道衍建议改变目标：绕过部分坚城，直接逼近南京。</text><path d="M500,836 L500,863" fill="none" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="870" width="900" height="140" rx="6" fill="#faf9f5" stroke="#d9d9ce"/><text x="75" y="909" text-anchor="start" font-size="27" fill="#1b365d">南下、灵璧、南京 · 把力量指向终点</text><text x="75" y="953" text-anchor="start" font-size="23" fill="#24241f">追兵、粮饷、援军与城门控制，仍能改变进程。</text><text x="75" y="990" text-anchor="start" font-size="22" fill="#77766e">入城实现军事目标；皇位来历与异议并未自动解决。</text><text x="50" y="1110" text-anchor="start" font-size="20" fill="#77766e">来源：PDF第260—310页。助手归纳；兵力与风向不作独立复原。</text></svg>