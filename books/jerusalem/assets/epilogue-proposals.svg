<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1190" role="img" aria-labelledby="title desc"><title id="title">想过、谈过、签署：分别记录</title><desc id="desc">同一个城市方案，在不同材料里可能只是设想、讨论内容或正式文件。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1190" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">后记 / 谈判材料的状态</text><text x="60" y="120" font-size="42" fill="#24241f">想过、谈过、签署：分别记录</text><text x="60" y="168" font-size="23" fill="#77766e">同一个城市方案，在不同材料里可能只是设想、讨论内容或正式文件。</text><rect x="60" y="225" width="1280" height="180" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="265" font-size="26" fill="#1b365d">1993年</text><text x="85" y="312" font-size="27" fill="#24241f">奥斯陆原则宣言</text><text x="85" y="369" font-size="17" fill="#77766e">PDF 1074—1075；文件第V条</text><text x="540" y="265" font-size="28" fill="#1b365d">已签署的临时安排</text><text x="540" y="317" font-size="24" fill="#77766e">开启临时自治的制度路径</text><text x="540" y="357" font-size="24" fill="#77766e">耶路撒冷列入永久地位谈判</text><rect x="60" y="435" width="1280" height="180" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="475" font-size="26" fill="#1b365d">1990年代</text><text x="85" y="522" font-size="27" fill="#24241f">贝林—阿巴斯构想</text><text x="85" y="579" font-size="17" fill="#77766e">PDF 1075—1076</text><text x="540" y="475" font-size="28" fill="#1b365d">非正式讨论</text><text x="540" y="527" font-size="24" fill="#77766e">讨论统一市政、分区与老城特殊地位</text><text x="540" y="567" font-size="24" fill="#77766e">书中明确说明：未成双方正式协议</text><rect x="60" y="645" width="1280" height="180" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="685" font-size="26" fill="#1b365d">2000年7月</text><text x="85" y="732" font-size="27" fill="#24241f">戴维营谈判</text><text x="85" y="789" font-size="17" fill="#77766e">PDF 1078—1079；三方声明</text><text x="540" y="685" font-size="28" fill="#1b365d">未达成永久地位协议</text><text x="540" y="737" font-size="24" fill="#77766e">涉及圣地、主权、住宅区与难民等问题</text><text x="540" y="777" font-size="24" fill="#77766e">三方声明确认仍有分歧，需要继续谈判</text><rect x="60" y="855" width="1280" height="180" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="895" font-size="26" fill="#1b365d">作者的“明天”</text><text x="85" y="942" font-size="27" fill="#24241f">共享首都与老城特殊安排</text><text x="85" y="999" font-size="17" fill="#77766e">PDF 1088—1090</text><text x="540" y="895" font-size="28" fill="#1b365d">作者支持的方向与设想</text><text x="540" y="947" font-size="24" fill="#77766e">讨论不同管理、治安及进入的可能机制</text><text x="540" y="987" font-size="24" fill="#77766e">未来时态不等于已经建立并运作的制度</text><text x="60" y="1112" font-size="23" fill="#1b365d">状态图不裁决谈判失败的全部原因；不将不同阶段的提案拼成一份生效协议。</text><text x="60" y="1158" font-size="20" fill="#77766e">来源：图中页段。1993年原则宣言及2000年白宫文件的链接见正文。</text></svg>