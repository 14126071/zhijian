<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1160" role="img" aria-labelledby="title desc"><title id="title">方案、停战线与实际控制</title><desc id="desc">不要把文件所设想的城市、战后分隔和军事胜利，画成同一种事实。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1160" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">第九部分 / 分开读三种城市安排</text><text x="60" y="120" font-size="42" fill="#24241f">方案、停战线与实际控制</text><text x="60" y="168" font-size="23" fill="#77766e">不要把文件所设想的城市、战后分隔和军事胜利，画成同一种事实。</text><rect x="60" y="228" width="1280" height="216" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="271" font-size="30" fill="#1b365d">1947年</text><text x="85" y="320" font-size="26" fill="#24241f">方案</text><text x="85" y="408" font-size="16" fill="#77766e">PDF 995—997；决议第三部分</text><text x="440" y="271" font-size="29" fill="#24241f">联合国第181（II）号决议</text><text x="440" y="328" font-size="24" fill="#77766e">巴勒斯坦分治；圣城及周边</text><text x="440" y="368" font-size="24" fill="#77766e">拟设特别国际制度，由联合国管理</text><text x="990" y="321" font-size="21" fill="#1b365d">计划没有按原设计落地</text><text x="990" y="361" font-size="21" fill="#1b365d">不能用后来战线代替原方案</text><path d="M960 253V415" stroke="#ddddd0"/><rect x="60" y="481" width="1280" height="216" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="524" font-size="30" fill="#1b365d">1949年</text><text x="85" y="573" font-size="26" fill="#24241f">军事分界</text><text x="85" y="661" font-size="16" fill="#77766e">PDF 1026—1035；停战协定第VI条</text><text x="440" y="524" font-size="29" fill="#24241f">以色列—约旦停战</text><text x="440" y="581" font-size="24" fill="#77766e">西部由以色列控制，东部及老城</text><text x="440" y="621" font-size="24" fill="#77766e">由约旦控制；保留特殊飞地安排</text><text x="990" y="574" font-size="21" fill="#1b365d">停战协定保留最终解决问题</text><text x="990" y="614" font-size="21" fill="#1b365d">不能等同于争议已全部解决</text><path d="M960 506V668" stroke="#ddddd0"/><rect x="60" y="734" width="1280" height="216" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="777" font-size="30" fill="#1b365d">1967年</text><text x="85" y="826" font-size="26" fill="#24241f">实际控制</text><text x="85" y="914" font-size="16" fill="#77766e">PDF 1057—1060</text><text x="440" y="777" font-size="29" fill="#24241f">六日战争后的变化</text><text x="440" y="834" font-size="24" fill="#77766e">以色列取得东部与老城控制权</text><text x="440" y="874" font-size="24" fill="#77766e">达扬另提出圣地管理与礼拜安排</text><text x="990" y="827" font-size="21" fill="#1b365d">军事、宗教管理与政治宣示</text><text x="990" y="867" font-size="21" fill="#1b365d">仍是需要分别判断的层面</text><path d="M960 759V921" stroke="#ddddd0"/><text x="60" y="1082" font-size="23" fill="#1b365d">本图止于本次阅读的1967年结尾，不用原书的“至今”描述当代执行情况。</text><text x="60" y="1128" font-size="20" fill="#77766e">来源：图中页段；两份联合国文献链接见正文，文件措辞单独核对。</text></svg>