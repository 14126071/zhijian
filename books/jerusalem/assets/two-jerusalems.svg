<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1230" role="img" aria-labelledby="title desc"><title id="title">同一座城：现实生活与神圣想象</title><desc id="desc">信仰、经典与记忆影响行动；实际的建筑、战争和制度又会改变期待与恐惧。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1230" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">全书概览 / 从前言视角到正文例证</text><text x="60" y="120" font-size="42" fill="#24241f">同一座城：现实生活与神圣想象</text><text x="60" y="168" font-size="23" fill="#77766e">信仰、经典与记忆影响行动；实际的建筑、战争和制度又会改变期待与恐惧。</text><rect x="60" y="225" width="590" height="200" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="88" y="274" font-size="31" fill="#1b365d">尘世之城</text><text x="88" y="330" font-size="25" fill="#77766e">居民、街道、住房与生计</text><text x="88" y="373" font-size="25" fill="#77766e">军队、资源、机构与日常管理</text><rect x="750" y="225" width="590" height="200" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="778" y="274" font-size="31" fill="#1b365d">想象中的圣城</text><text x="778" y="330" font-size="25" fill="#77766e">经典、祈祷、预言与故城记忆</text><text x="778" y="373" font-size="25" fill="#77766e">救赎期待、历史归属与理想</text><path d="M665 288H735" stroke="#1b365d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M735 367H665" stroke="#1b365d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="60" y="482" width="1280" height="176" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="86" y="524" font-size="28" fill="#1b365d">失去，仍可延续</text><text x="86" y="624" font-size="16" fill="#77766e">PDF 124—140、300—301、313—315</text><text x="470" y="524" font-size="29" fill="#24241f">流亡与没有圣殿的生活</text><text x="470" y="577" font-size="23" fill="#77766e">经典、律法、祈祷与家庭实践保存共同体联系。</text><text x="470" y="617" font-size="23" fill="#77766e">城市的实际控制，不等于对记忆的完全控制。</text><rect x="60" y="690" width="1280" height="176" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="86" y="732" font-size="28" fill="#1b365d">想象，进入空间</text><text x="86" y="832" font-size="16" fill="#77766e">PDF 329—340、401—411、599—605</text><text x="470" y="732" font-size="29" fill="#24241f">皇室赞助与圣地营建</text><text x="470" y="785" font-size="23" fill="#77766e">教堂、圆顶、路线、学校和仪式让记忆可以进入与行走。</text><text x="470" y="825" font-size="23" fill="#77766e">意义变成建筑，需要资金、工匠、组织与长期维护。</text><rect x="60" y="898" width="1280" height="176" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="86" y="940" font-size="28" fill="#1b365d">行动，改变期待</text><text x="86" y="1040" font-size="16" fill="#77766e">PDF 759—770、934—940、1057—1060</text><text x="470" y="940" font-size="29" fill="#24241f">近现代的迁徙、挖掘与战争</text><text x="470" y="993" font-size="23" fill="#77766e">土地、组织、边界及圣地安排改变不同居民的可能生活。</text><text x="470" y="1033" font-size="23" fill="#77766e">新的安全感、恐惧与记忆，又进入后续政治选择。</text><text x="60" y="1152" font-size="23" fill="#1b365d">关系可以相互强化，也可能被合作、政策转向和个人选择改变；不表示必然冲突。</text><text x="60" y="1198" font-size="20" fill="#77766e">来源：前言PDF第22—34页与图中正文页段；本图为跨笔记归纳。</text></svg>