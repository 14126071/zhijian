<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1020" role="img" aria-labelledby="title desc"><title id="title">两个耶路撒冷与神圣性的累积</title><desc id="desc">现实中的城市与信仰中的理想之城相互作用；神圣性、记忆、远方投射和争夺可能相互强化。共存和日常生活也始终存在。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif;fill:#141413} .muted{fill:#6b6a64} .blue{fill:#1b365d} .small{font-size:19px} .body{font-size:23px}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#f5f4ed"/><text x="60" y="62" font-size="20" class="blue" text-anchor="start">02 / 前言的核心视角</text><text x="60" y="118" font-size="38" class="" text-anchor="start">同一座城市，承载两种耶路撒冷</text><rect x="60" y="174" width="580" height="236" rx="6" fill="#faf9f5" stroke="#e8e6dc"/><text x="90" y="224" font-size="32" class="blue" text-anchor="start">尘世之城</text><text x="90" y="267" font-size="23" class="" text-anchor="start">真实的人、建筑与生活</text><text x="90" y="327" font-size="22" class="muted" text-anchor="start">居民与家族 · 统治与战争</text><text x="90" y="367" font-size="22" class="muted" text-anchor="start">建筑的沿用 · 多种身份与共存</text><rect x="760" y="174" width="580" height="236" rx="6" fill="#faf9f5" stroke="#e8e6dc"/><text x="790" y="224" font-size="32" class="blue" text-anchor="start">天国之城</text><text x="790" y="267" font-size="23" class="" text-anchor="start">信仰、记忆与理想中的城市</text><text x="790" y="327" font-size="22" class="muted" text-anchor="start">经典与预言 · 救赎与末世</text><text x="790" y="367" font-size="22" class="muted" text-anchor="start">神圣传统 · 对圣地的归属想象</text><path d="M660 255 H738" stroke="#1b365d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M738 335 H660" stroke="#1b365d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="700" y="298" font-size="18" class="blue" text-anchor="middle">相互塑造</text><text x="60" y="470" font-size="29" class="" text-anchor="start">神圣性为什么可能越积越厚？</text><rect x="60" y="510" width="290" height="120" rx="5" fill="#faf9f5" stroke="#e8e6dc"/><text x="205" y="555" font-size="24" class="blue" text-anchor="middle">已有的圣地</text><text x="205" y="599" font-size="20" class="muted" text-anchor="middle">传统提供合法性</text><path d="M359 570 H380" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="390" y="510" width="290" height="120" rx="5" fill="#faf9f5" stroke="#e8e6dc"/><text x="535" y="555" font-size="24" class="blue" text-anchor="middle">记忆与经典</text><text x="535" y="599" font-size="20" class="muted" text-anchor="middle">毁灭后仍可延续</text><path d="M689 570 H710" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="720" y="510" width="290" height="120" rx="5" fill="#faf9f5" stroke="#e8e6dc"/><text x="865" y="555" font-size="24" class="blue" text-anchor="middle">远方的信仰投射</text><text x="865" y="599" font-size="20" class="muted" text-anchor="middle">朝圣、赞助与介入</text><path d="M1019 570 H1040" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="1050" y="510" width="290" height="120" rx="5" fill="#faf9f5" stroke="#e8e6dc"/><text x="1195" y="555" font-size="24" class="blue" text-anchor="middle">争夺与重新解释</text><text x="1195" y="599" font-size="20" class="muted" text-anchor="middle">可能强化神圣性</text><path d="M1195 650 V690 H205 V650" fill="none" stroke="#1b365d" stroke-width="1.8" marker-end="url(#arrow)"/><text x="700" y="725" font-size="21" class="blue" text-anchor="middle">有时形成相互强化的循环，而非每个时代都如此</text><rect x="60" y="775" width="1280" height="140" rx="5" fill="#e8e6dc"/><text x="90" y="817" font-size="26" class="" text-anchor="start">同时保留另一条线索：共存与延续</text><text x="90" y="858" font-size="23" class="" text-anchor="start">人们也在共同生活，建筑被改建和沿用，家族与文化彼此交织。</text><text x="90" y="891" font-size="21" class="muted" text-anchor="start">不能把全书预先读成一条从宗教差异必然走向战争的直线。</text><text x="60" y="971" font-size="18" class="muted" text-anchor="start">阅读模型，由前言第22—32页归纳；箭头是辅助理解，不是原书图示或已验证的普遍因果律。</text></svg>