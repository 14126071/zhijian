<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1170" role="img" aria-labelledby="title desc"><title id="title">一座宗教建筑怎样连接信仰与家族</title><desc id="desc">根据第29章正文与注释整理的机制图：赞助者建设并设立瓦克夫，兼顾宗教机构维护与后代保障。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1170" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">第六部分 / 从建筑读到制度</text><text x="60" y="120" font-size="40" fill="#24241f">信仰、声望与家族，进入同一项建设</text><text x="60" y="167" font-size="23" fill="#77766e">依据本书所述用途关系归纳；不是所有瓦克夫的统一法律或财务规则。</text><path d="M700 365V425 M700 585V650H355V720 M700 650H1045V720" fill="none" stroke="#1b365d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M700 650H355V720" fill="none" stroke="#1b365d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="285" y="215" width="830" height="150" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="320" y="260" font-size="31" fill="#1b365d">苏丹、埃米尔与被流放的军官</text><text x="320" y="307" font-size="24" fill="#24241f">资助学校、宫邸、陵墓等建筑，接近圣地并留下身后声望。</text><text x="320" y="340" font-size="21" fill="#77766e">财富与地位可能在权力斗争中失去。  [PDF 600—601、605]</text><rect x="285" y="425" width="830" height="160" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="320" y="470" font-size="30" fill="#1b365d">建筑与瓦克夫（宗教慈善捐产安排）</text><text x="320" y="518" font-size="24" fill="#24241f">本书写到：捐资设立机构，将资源与长期用途连接。</text><text x="320" y="554" font-size="22" fill="#77766e">一项建设可以有多个目的，并不必然只有单一动机。</text><text x="180" y="693" font-size="22" fill="#1b365d">维持宗教用途</text><text x="1080" y="693" font-size="22" fill="#1b365d">保障家族</text><rect x="60" y="720" width="590" height="175" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="90" y="769" font-size="29" fill="#1b365d">学校与宗教纪念</text><text x="90" y="822" font-size="23" fill="#24241f">维持马德拉萨运转</text><text x="90" y="862" font-size="23" fill="#24241f">墓地的诵经窗口连接纪念与日常街道</text><rect x="750" y="720" width="590" height="175" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="780" y="769" font-size="29" fill="#1b365d">后代的住所与工作</text><text x="780" y="822" font-size="23" fill="#24241f">为子孙保留居住和谋生安排</text><text x="780" y="862" font-size="23" fill="#24241f">在政治失势的风险之外争取延续</text><rect x="60" y="960" width="1280" height="105" rx="5" fill="#e8e6dc"/><text x="85" y="1003" font-size="26" fill="#1b365d">不能只从一面解释：虔诚信仰、公共用途与家族受益，可以同时存在。</text><text x="85" y="1042" font-size="23" fill="#24241f">建筑的华丽，也不能单独证明全城居民都生活富足。</text><text x="60" y="1125" font-size="20" fill="#77766e">来源：第29章 PDF第600—601、605页。“多个目的”的并读为阅读归纳。</text></svg>