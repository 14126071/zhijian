<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1160" role="img" aria-labelledby="title desc"><title id="title">19世纪耶路撒冷怎样走出城墙</title><desc id="desc">城外空间扩展的三个阅读阶段，非精确地图；住房、宗教大院、交通和多个社群的建设相互作用。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1160" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">第八部分 / 计划、落地与长期运作</text><text x="60" y="120" font-size="42" fill="#24241f">从城门外的风险，到新城的形成</text><text x="60" y="168" font-size="24" fill="#77766e">非精确地图，非单一社群的建城史；城外新空间由多方逐步建设。</text><rect x="60" y="225" width="1280" height="200" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="271" font-size="25" fill="#1b365d">1850年代—1860年</text><text x="85" y="382" font-size="17" fill="#77766e">PDF 742—743、753—759</text><text x="465" y="271" font-size="30" fill="#24241f">慈善住房与机构大院</text><text x="465" y="329" font-size="22" fill="#77766e">蒙蒂菲奥里购地，建设住房与磨坊；俄国机构发展朝圣接待。</text><text x="465" y="373" font-size="22" fill="#77766e">最初居民担心治安而返回城内过夜，磨坊也有经营困难。</text><path d="M700 432V462" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="470" width="1280" height="200" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="516" font-size="25" fill="#1b365d">19世纪后半叶</text><text x="85" y="627" font-size="17" fill="#77766e">PDF 780—782、789</text><text x="465" y="516" font-size="30" fill="#24241f">多个社群与商业共同扩张</text><text x="465" y="574" font-size="22" fill="#77766e">犹太街区、阿拉伯家族住宅、欧洲宗教与住宿设施向城外发展。</text><text x="465" y="618" font-size="22" fill="#77766e">本地家族参与商业，奥斯曼官员也持续建设和管理。</text><path d="M700 677V707" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="715" width="1280" height="200" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="761" font-size="25" fill="#1b365d">1892年及其前后</text><text x="85" y="872" font-size="17" fill="#77766e">PDF 743、749、780—782</text><text x="465" y="761" font-size="30" fill="#24241f">交通、旅游与城市服务连接</text><text x="465" y="819" font-size="22" fill="#77766e">实际开通的雅法—耶路撒冷铁路，连接更成熟的旅游与接待业。</text><text x="465" y="863" font-size="22" fill="#77766e">早期提出却未落实的铁路计划，不能算作已经通车。</text><rect x="60" y="1000" width="1280" height="85" rx="5" fill="#e8e6dc"/><text x="85" y="1051" font-size="26" fill="#1b365d">筹款、购地、建成、持续经营是不同阶段；新建筑也不自动带来普遍富足。</text><text x="60" y="1120" font-size="20" fill="#77766e">来源：图中所列页段。箭头仅连接阅读阶段，不表示唯一或必然的因果。</text></svg>