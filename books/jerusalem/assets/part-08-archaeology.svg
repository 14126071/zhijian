<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1160" role="img" aria-labelledby="title desc"><title id="title">考古发现、历史解释与政治主张的层次</title><desc id="desc">文物与测绘可以支持历史判断，但需经论证；宗教和领土主张不能由一件遗物自动推出。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1160" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">第八部分 / 分清证据与它被赋予的意义</text><text x="60" y="120" font-size="42" fill="#24241f">从发现遗迹，到提出政治主张</text><text x="60" y="168" font-size="24" fill="#77766e">这是阅读作者叙述的框架，不是对具体遗址作新的考古鉴定。</text><rect x="60" y="225" width="1280" height="185" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="275" font-size="28" fill="#1b365d">01  观察与记录</text><text x="465" y="272" font-size="29" fill="#24241f">找到了什么？位置在哪里？</text><text x="465" y="328" font-size="22" fill="#77766e">门址、桥拱、竖井、储水设施、陶器，以及对城市的测绘。</text><text x="465" y="371" font-size="22" fill="#77766e">需要保留原物、空间关系和可复核的记录。</text><path d="M700 417V455" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><text x="735" y="447" font-size="20" fill="#77766e">需论证</text><rect x="60" y="465" width="1280" height="185" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="515" font-size="28" fill="#1b365d">02  历史解释</text><text x="465" y="512" font-size="29" fill="#24241f">年代、功能和文献能否相互印证？</text><text x="465" y="568" font-size="22" fill="#77766e">哪些判断有证据，哪些只是当时的猜想？</text><text x="465" y="611" font-size="22" fill="#77766e">作者也写到将较晚墓葬误认作大卫王陵的例子。</text><path d="M700 657V695" stroke="#1b365d" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="735" y="687" font-size="20" fill="#77766e">不是自动推导</text><rect x="60" y="705" width="1280" height="185" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="755" font-size="28" fill="#1b365d">03  社会与政治用途</text><text x="465" y="752" font-size="29" fill="#24241f">谁借这些判断确认自己的身份与权利？</text><text x="465" y="808" font-size="22" fill="#77766e">宗教验证、国家声望、军事测绘和帝国竞争可能进入研究。</text><text x="465" y="851" font-size="22" fill="#77766e">这些用途不取消发现的价值，却需要单独审视其推论。</text><rect x="60" y="990" width="1280" height="90" rx="5" fill="#e8e6dc"/><text x="85" y="1044" font-size="27" fill="#1b365d">“这里有某时代的遗迹”，不能独自证明“所以今天这里必然属于某一方”。</text><text x="60" y="1120" font-size="20" fill="#77766e">来源：第39章 PDF第759—763、769—770页。分层方式为阅读归纳。</text></svg>