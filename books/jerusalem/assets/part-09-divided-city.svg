<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1380" role="img" aria-labelledby="title desc"><title id="title">分隔之城：很近，却未必能够到达</title><desc id="desc">关系示意，非精确地图；线条表示通行阻隔，不表示最终政治边界。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1380" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">第九部分 / 1949—1967年</text><text x="60" y="120" font-size="42" fill="#24241f">分隔之城：很近，却未必能够到达</text><text x="60" y="168" font-size="23" fill="#77766e">关系示意，非精确地图；线条表示通行阻隔，不表示最终政治边界。</text><rect x="60" y="245" width="560" height="540" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><rect x="780" y="245" width="560" height="540" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="90" y="296" font-size="34" fill="#1b365d">西耶路撒冷</text><text x="90" y="342" font-size="26" fill="#24241f">以色列控制</text><text x="90" y="412" font-size="23" fill="#77766e">国家机构、学校、商店与新移民</text><text x="90" y="452" font-size="23" fill="#77766e">日常发展与宗教／世俗分歧并存</text><text x="810" y="296" font-size="34" fill="#1b365d">东耶路撒冷及老城</text><text x="810" y="342" font-size="26" fill="#24241f">约旦控制</text><rect x="810" y="385" width="500" height="206" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="837" y="434" font-size="29" fill="#1b365d">老城与圣地</text><text x="837" y="487" font-size="23" fill="#77766e">西墙、圣殿山、圣墓大教堂等</text><text x="837" y="527" font-size="23" fill="#77766e">犹太人前往西墙等处受阻</text><text x="810" y="651" font-size="24" fill="#24241f">地方家族、旅游与城市生活延续</text><text x="810" y="702" font-size="23" fill="#77766e">王国政治与巴勒斯坦诉求交叠</text><path d="M700 220V390M700 541V800" stroke="#8c9388" stroke-width="4" stroke-dasharray="12 9"/><text x="643" y="848" font-size="24" fill="#1b365d">分隔线</text><rect x="580" y="410" width="240" height="110" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="601" y="453" font-size="26" fill="#1b365d">曼德尔鲍姆</text><text x="601" y="494" font-size="23" fill="#24241f">受限的检查通道</text><rect x="60" y="870" width="1280" height="111" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="911" font-size="26" fill="#1b365d">特殊安排：斯科普斯山的以色列飞地</text><text x="85" y="953" font-size="23" fill="#24241f">位于东部一侧，另有特殊通行安排；本框不表示地理位置。</text><text x="60" y="1044" font-size="29" fill="#1b365d">失去的通路，不只有一条</text><text x="60" y="1095" font-size="24" fill="#77766e">犹太人难以抵达老城圣地；阿拉伯难民无法因停战自动恢复西部故居。</text><text x="60" y="1135" font-size="24" fill="#77766e">两种限制各有机制与规模，不能用一句“双方都受伤”替代具体历史。</text><text x="60" y="1302" font-size="23" fill="#1b365d">居住、礼拜、工作与亲友往来，被路障、雷区、检查点和射击危险重新切开。</text><text x="60" y="1348" font-size="20" fill="#77766e">来源：PDF 1008—1009、1026、1029—1041。飞地采用文字标示，不表示其地理位置。</text></svg>