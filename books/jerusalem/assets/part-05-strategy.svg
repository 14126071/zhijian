<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1140" role="img" aria-labelledby="title desc"><title id="title">王国生存的三组约束</title><desc id="desc">将资源、内部协调与战场选择分开看，不用单一英雄或单一失败解释全部结局。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1140" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">第五部分 / 理解战争与统治</text><text x="60" y="120" font-size="42" fill="#24241f">勇气之外，三组约束始终存在</text><text x="60" y="167" font-size="23" fill="#77766e">它们也作用于萨拉丁和理查；这是一张理解图，不是精确地图或胜负公式。</text><rect x="60" y="220" width="1280" height="180" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="268" font-size="31" fill="#1b365d">资源与地理</text><text x="85" y="357" font-size="17" fill="#77766e">PDF 472—475、517—518、526</text><text x="470" y="266" font-size="29" fill="#24241f">港口、补给与区域力量</text><text x="470" y="316" font-size="23" fill="#77766e">沿海港口连接外来兵力、资金与航路。</text><text x="470" y="359" font-size="23" fill="#77766e">叙利亚和埃及被同一力量联结时，王国压力加重。</text><path d="M700 406V433" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="445" width="1280" height="180" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="493" font-size="31" fill="#1b365d">权力与继承</text><text x="85" y="582" font-size="17" fill="#77766e">PDF 484、511—512、526—531</text><text x="470" y="491" font-size="29" fill="#24241f">能否形成持续的共同方案？</text><text x="470" y="541" font-size="23" fill="#77766e">国王、贵族、主教与军事骑士团，各有利益与权限。</text><text x="470" y="584" font-size="23" fill="#77766e">摄政、婚姻与继承争执，会影响军队是否服从指挥。</text><path d="M700 631V658" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="670" width="1280" height="180" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="718" font-size="31" fill="#1b365d">战场与选择</text><text x="85" y="807" font-size="17" fill="#77766e">PDF 532—539、560—566</text><text x="470" y="716" font-size="29" fill="#24241f">水、粮、天气与退路</text><text x="470" y="766" font-size="23" fill="#77766e">哈丁前离开水源，酷热和缺水放大战术风险。</text><text x="470" y="809" font-size="23" fill="#77766e">理查能赢沿海战斗，也要考虑拿下圣城后能否守住。</text><rect x="60" y="925" width="1280" height="100" rx="5" fill="#e8e6dc"/><text x="85" y="967" font-size="28" fill="#1b365d">圣战动员可以带来兵力与决心，持续治理还需要资源与协调。</text><text x="85" y="1007" font-size="23" fill="#24241f">这些条件相互影响，并不意味着历史只有一种结局。</text><text x="60" y="1090" font-size="20" fill="#77766e">依据图中所列页段归纳；箭头表示连起来思考，不表示每一步必然导致下一步。</text></svg>