<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1140" role="img" aria-labelledby="title desc"><title id="title">1947—1949：一场战争，三个阶段</title><desc id="desc">内战早于1948年5月；建国、周边国家参战和停战，是不同的过程。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1140" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">第九部分 / 第50—51章</text><text x="60" y="120" font-size="42" fill="#24241f">1947—1949：一场战争，三个阶段</text><text x="60" y="168" font-size="23" fill="#77766e">内战早于1948年5月；建国、周边国家参战和停战，是不同的过程。</text><rect x="60" y="230" width="400" height="660" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="282" font-size="30" fill="#1b365d">01</text><text x="85" y="336" font-size="23" fill="#1b365d">1947年末—1948年春</text><text x="85" y="391" font-size="27" fill="#24241f">托管末期的内战</text><text x="85" y="459" font-size="24" fill="#77766e">联合国分治表决后</text><text x="85" y="499" font-size="24" fill="#77766e">社区与武装已开始交战</text><text x="85" y="539" font-size="24" fill="#77766e">街区、道路和补给受争夺</text><text x="85" y="625" font-size="23" fill="#1b365d">居民的处境</text><text x="85" y="673" font-size="22" fill="#77766e">犹太区面对封锁与缺粮</text><text x="85" y="713" font-size="22" fill="#77766e">阿拉伯居民遭袭、出走</text><text x="85" y="850" font-size="20" fill="#77766e">PDF 997—1009</text><path d="M466 420H493" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="500" y="230" width="400" height="660" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="525" y="282" font-size="30" fill="#1b365d">02</text><text x="525" y="336" font-size="23" fill="#1b365d">1948年5月起</text><text x="525" y="391" font-size="27" fill="#24241f">建国与国家军队参战</text><text x="525" y="459" font-size="24" fill="#77766e">以色列宣布建国</text><text x="525" y="499" font-size="24" fill="#77766e">周边阿拉伯国家军队进入</text><text x="525" y="539" font-size="24" fill="#77766e">各国目标及指挥并不一致</text><text x="525" y="625" font-size="23" fill="#1b365d">居民的处境</text><text x="525" y="673" font-size="22" fill="#77766e">老城犹太区投降、居民离开</text><text x="525" y="713" font-size="22" fill="#77766e">阿拉伯难民处境继续恶化</text><text x="525" y="850" font-size="20" fill="#77766e">PDF 1013—1025</text><path d="M906 420H933" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="940" y="230" width="400" height="660" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="965" y="282" font-size="30" fill="#1b365d">03</text><text x="965" y="336" font-size="23" fill="#1b365d">1949年停战安排</text><text x="965" y="391" font-size="27" fill="#24241f">城市分隔固定下来</text><text x="965" y="459" font-size="24" fill="#77766e">西部由以色列控制</text><text x="965" y="499" font-size="24" fill="#77766e">东部及老城由约旦控制</text><text x="965" y="539" font-size="24" fill="#77766e">国际化方案未按计划实施</text><text x="965" y="625" font-size="23" fill="#1b365d">居民的处境</text><text x="965" y="673" font-size="22" fill="#77766e">故居和圣地的通路受阻</text><text x="965" y="713" font-size="22" fill="#77766e">难民与政治问题仍未解决</text><text x="965" y="850" font-size="20" fill="#77766e">PDF 1026—1035</text><rect x="60" y="939" width="1280" height="95" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="997" font-size="26" fill="#1b365d">建国的安全与自决经验，与巴勒斯坦人的失去家园，需要同时保留具体过程。</text><text x="60" y="1062" font-size="23" fill="#1b365d">阶段图不是对居民损失作等量比较，也不表示所有战斗共享同一个原因。</text><text x="60" y="1108" font-size="20" fill="#77766e">来源：第50—52章图中页段。袭击、屠杀和驱逐责任在正文中分别记录。</text></svg>