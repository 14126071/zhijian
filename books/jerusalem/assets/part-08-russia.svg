<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1150" role="img" aria-labelledby="title desc"><title id="title">俄国朝圣者与受迫害犹太人的两种流动</title><desc id="desc">共同的出发区域和部分航线，不表示共同的目的和政治计划；移民有多种目的地。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1150" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">第八部分 / 同一帝国，不同处境</text><text x="60" y="120" font-size="42" fill="#24241f">朝圣与避难，不是同一类行动</text><text x="60" y="168" font-size="24" fill="#77766e">两条阅读线索，非人口比例图；不代表每位成员都有相同经历或立场。</text><rect x="60" y="230" width="590" height="655" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="90" y="282" font-size="31" fill="#1b365d">东正教朝圣者</text><text x="90" y="350" font-size="25" fill="#1b365d">出发动力</text><text x="90" y="398" font-size="24" fill="#77766e">虔诚信仰、救赎与一生的朝圣目标</text><text x="90" y="437" font-size="24" fill="#77766e">皇室支持与宗教机构的组织</text><text x="90" y="508" font-size="25" fill="#1b365d">路径与接待</text><text x="90" y="556" font-size="24" fill="#77766e">村庄—敖德萨—雅法—耶路撒冷</text><text x="90" y="595" font-size="24" fill="#77766e">轮船、导游、俄国大院及教堂</text><text x="90" y="666" font-size="25" fill="#1b365d">在城中的活动</text><text x="90" y="714" font-size="24" fill="#77766e">参加礼仪、住宿与游访圣地</text><text x="90" y="753" font-size="24" fill="#77766e">也可能因艰难与失望而受到冲击</text><text x="90" y="852" font-size="20" fill="#77766e">PDF 790—794</text><rect x="750" y="230" width="590" height="655" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="780" y="282" font-size="31" fill="#1b365d">受迫害的犹太人</text><text x="780" y="350" font-size="25" fill="#1b365d">离开的压力</text><text x="780" y="398" font-size="24" fill="#77766e">反犹暴力、法律限制与驱逐</text><text x="780" y="437" font-size="24" fill="#77766e">寻求安全和新的生活可能</text><text x="780" y="508" font-size="25" fill="#1b365d">多种目的地</text><text x="780" y="556" font-size="24" fill="#77766e">许多人前往美国等其他地方</text><text x="780" y="595" font-size="24" fill="#77766e">一部分来到巴勒斯坦及耶路撒冷</text><text x="780" y="666" font-size="25" fill="#1b365d">在城中的处境</text><text x="780" y="714" font-size="24" fill="#77766e">定居与人口变化，并非短期朝圣</text><text x="780" y="753" font-size="24" fill="#77766e">面对奥斯曼限制及地方社会的反应</text><text x="780" y="852" font-size="20" fill="#77766e">PDF 792—796</text><rect x="60" y="950" width="1280" height="112" rx="5" fill="#e8e6dc"/><text x="85" y="993" font-size="25" fill="#1b365d">帝国资助东正教朝圣，又在国内迫害犹太人；两者以不同方式影响同一座城。</text><text x="85" y="1033" font-size="23" fill="#24241f">朝圣、难民迁徙与政治组织仍须区分，不能合并成一个统一计划。</text><text x="60" y="1110" font-size="20" fill="#77766e">来源：第41章 PDF第790—796页。移民目的地只示方向，不按人数绘制。</text></svg>