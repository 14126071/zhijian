<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1150" role="img" aria-labelledby="title desc"><title id="title">圣地建筑的用途如何改变</title><desc id="desc">岩石圆顶与阿克萨是不同建筑；拉丁命名、王宫和骑士团使用、萨拉丁恢复与1229年安排并非同一回事。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1150" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">第五部分 / 建筑、名字与制度</text><text x="60" y="120" font-size="42" fill="#24241f">建筑留下，名字与用途可以改变</text><text x="60" y="168" font-size="23" fill="#77766e">概念对照，非城市平面图。拉丁时代的“圣殿”名称，不证明建筑由所罗门建造。</text><text x="85" y="238" font-size="25" fill="#1b365d">阶段</text><text x="355" y="238" font-size="29" fill="#1b365d">岩石圆顶建筑</text><text x="875" y="238" font-size="29" fill="#1b365d">阿克萨礼拜建筑</text><rect x="60" y="275" width="1280" height="174" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="322" font-size="27" fill="#1b365d">拉丁王国时期</text><text x="85" y="391" font-size="18" fill="#77766e">PDF 473、477—478</text><path d="M325 295V429 M845 295V429" stroke="#ddddd0"/><text x="355" y="318" font-size="26" fill="#1b365d">称“上帝圣殿”</text><text x="355" y="366" font-size="22" fill="#24241f">加上十字架，举行基督教礼仪</text><text x="355" y="408" font-size="22" fill="#24241f">保护圣石的装饰继续增建</text><text x="875" y="318" font-size="26" fill="#1b365d">王宫，继为骑士团驻地</text><text x="875" y="366" font-size="22" fill="#24241f">起初由国王使用</text><text x="875" y="408" font-size="22" fill="#24241f">后改为套间、营房与配套设施</text><rect x="60" y="480" width="1280" height="174" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="527" font-size="27" fill="#1b365d">1187年之后</text><text x="85" y="596" font-size="18" fill="#77766e">PDF 549—551</text><path d="M325 500V634 M845 500V634" stroke="#ddddd0"/><text x="355" y="523" font-size="26" fill="#1b365d">恢复穆斯林圣地身份</text><text x="355" y="571" font-size="22" fill="#24241f">拆除十字架和相关象征</text><text x="355" y="613" font-size="22" fill="#24241f">沿用部分法兰克装饰与构件</text><text x="875" y="523" font-size="26" fill="#1b365d">恢复穆斯林礼拜</text><text x="875" y="571" font-size="22" fill="#24241f">拆除小卧室和套间</text><text x="875" y="613" font-size="22" fill="#24241f">安放努尔·丁准备的讲经坛</text><rect x="60" y="685" width="1280" height="174" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="732" font-size="27" fill="#1b365d">1229年协议</text><text x="85" y="801" font-size="18" fill="#77766e">PDF 578—581</text><path d="M325 705V839 M845 705V839" stroke="#ddddd0"/><text x="355" y="728" font-size="26" fill="#1b365d">穆斯林保留圣地管理</text><text x="355" y="776" font-size="22" fill="#24241f">城市安排改变</text><text x="355" y="818" font-size="22" fill="#24241f">圣殿山并未一并交出</text><text x="875" y="728" font-size="26" fill="#1b365d">穆斯林保留圣地管理</text><text x="875" y="776" font-size="22" fill="#24241f">基督徒可按约进入礼拜</text><text x="875" y="818" font-size="22" fill="#24241f">准入与实际统治要分开记</text><rect x="60" y="930" width="1280" height="110" rx="5" fill="#e8e6dc"/><text x="85" y="973" font-size="25" fill="#1b365d">圣墓大教堂是城内另一处建筑，不要与圣殿山上的两座建筑混为一谈。</text><text x="85" y="1015" font-size="23" fill="#24241f">1149年的十字军整合扩建，继续改变1048年重建后留下的教堂群。</text><text x="60" y="1095" font-size="20" fill="#77766e">来源：PDF第473、477—478、510、549—551、578—581页。后续仍有反复易手，见正文。</text></svg>