<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1280" role="img" aria-labelledby="title desc"><title id="title">第六部分：圣地营建与城市困境</title><desc id="desc">七个阅读节点，区分军事统治、宗教资助、朝圣与居民生活。非等比例年表。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1280" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">第六部分 / 第29—30章</text><text x="60" y="120" font-size="42" fill="#24241f">圣地营建与城市困境</text><text x="60" y="168" font-size="24" fill="#77766e">军事据点退场，建筑与朝圣延续；神圣声望不等于居民的安全与繁荣。</text><path d="M95 250V1100" stroke="#c4c5b8" stroke-width="3"/><circle cx="95" cy="260" r="22" fill="#1b365d"/><text x="83" y="268" font-size="23" fill="#faf9f5">1</text><rect x="145" y="212" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="248" font-size="24" fill="#1b365d">1260年及其后</text><text x="172" y="294" font-size="18" fill="#77766e">PDF 591—595</text><text x="500" y="248" font-size="28" fill="#24241f">军事奴隶崛起为统治者</text><text x="500" y="293" font-size="21" fill="#77766e">阿音扎鲁特取胜；拜巴尔斯掌权，修葺圣地并打击沿海据点。</text><circle cx="95" cy="393" r="22" fill="#1b365d"/><text x="83" y="401" font-size="23" fill="#faf9f5">2</text><rect x="145" y="345" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="381" font-size="24" fill="#1b365d">1267年</text><text x="172" y="427" font-size="18" fill="#77766e">PDF 596—598</text><text x="500" y="381" font-size="28" fill="#24241f">拉姆班：从哀悼走向重建</text><text x="500" y="426" font-size="21" fill="#77766e">流亡拉比寻找祈祷空间，主张返回、定居，而非只等待弥赛亚。</text><circle cx="95" cy="526" r="22" fill="#1b365d"/><text x="83" y="534" font-size="23" fill="#faf9f5">3</text><rect x="145" y="478" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="514" font-size="24" fill="#1b365d">1291年</text><text x="172" y="560" font-size="18" fill="#77766e">PDF 595—596、604</text><text x="500" y="514" font-size="28" fill="#24241f">阿克陷落，王国头衔仍流传</text><text x="500" y="559" font-size="21" fill="#77766e">沿海王国残余基地结束；欧洲王室的名号不等于实际控制圣城。</text><circle cx="95" cy="659" r="22" fill="#1b365d"/><text x="83" y="667" font-size="23" fill="#faf9f5">4</text><rect x="145" y="611" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="647" font-size="24" fill="#1b365d">14世纪前期</text><text x="172" y="693" font-size="18" fill="#77766e">PDF 599—605</text><text x="500" y="647" font-size="28" fill="#24241f">纳西尔与坦齐兹的营建</text><text x="500" y="692" font-size="21" fill="#77766e">学校、市场、修道院与陵墓，把宗教、声望及家族利益连起来。</text><circle cx="95" cy="792" r="22" fill="#1b365d"/><text x="83" y="800" font-size="23" fill="#faf9f5">5</text><rect x="145" y="744" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="780" font-size="24" fill="#1b365d">1401年</text><text x="172" y="826" font-size="18" fill="#77766e">PDF 606—608</text><text x="500" y="780" font-size="28" fill="#24241f">帖木尔的威胁与准备献城</text><text x="500" y="825" font-size="21" fill="#77766e">代表团带去钥匙，但帖木尔已北上；圣城仍属马木鲁克。</text><circle cx="95" cy="925" r="22" fill="#1b365d"/><text x="83" y="933" font-size="23" fill="#faf9f5">6</text><rect x="145" y="877" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="913" font-size="24" fill="#1b365d">15世纪</text><text x="172" y="959" font-size="18" fill="#77766e">PDF 609—615</text><text x="500" y="913" font-size="28" fill="#24241f">朝圣收入与社群竞争</text><text x="500" y="958" font-size="21" fill="#77766e">通行、税费、教派争夺和宗教限制，影响不同人群的处境。</text><circle cx="95" cy="1058" r="22" fill="#1b365d"/><text x="83" y="1066" font-size="23" fill="#faf9f5">7</text><rect x="145" y="1010" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="1046" font-size="24" fill="#1b365d">15世纪末至16世纪初</text><text x="172" y="1092" font-size="18" fill="#77766e">PDF 615—617</text><text x="500" y="1046" font-size="28" fill="#24241f">营建仍在，区域压力加重</text><text x="500" y="1091" font-size="21" fill="#77766e">地方不稳、奥斯曼兴起与海上贸易竞争，继续改变开罗的处境。</text><text x="60" y="1205" font-size="21" fill="#1b365d">按实际叙述取点，非等比例年表。第29章正文越过1339年；本部分未展开1517年的征服。</text><text x="60" y="1245" font-size="20" fill="#77766e">来源：第六部分 PDF第589—618页。未扩读第七部分。</text></svg>