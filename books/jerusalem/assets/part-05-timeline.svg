<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1420" role="img" aria-labelledby="title desc"><title id="title">第五部分：圣战、王国与谈判</title><desc id="desc">第21至28章阅读地图，时间间距不按比例，章题时间与正文回溯前望分开。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1420" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">第五部分 / 第21—28章</text><text x="60" y="120" font-size="42" fill="#24241f">圣战、王国与谈判</text><text x="60" y="167" font-size="24" fill="#77766e">夺下一座圣城之后，怎样守住、治理，并与他人安排进入圣地的权利？</text><path d="M95 250V1200" stroke="#c4c5b8" stroke-width="3"/><circle cx="95" cy="260" r="22" fill="#1b365d"/><text x="83" y="268" font-size="23" fill="#faf9f5">1</text><rect x="145" y="212" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="242" font-size="22" fill="#1b365d">第21章</text><text x="172" y="275" font-size="23" fill="#24241f">1099年</text><text x="172" y="306" font-size="18" fill="#77766e">PDF 453—470</text><text x="485" y="248" font-size="29" fill="#24241f">攻城与大屠杀</text><text x="485" y="293" font-size="22" fill="#77766e">征服之后，人口、驻军、教会与统帅权的问题才刚开始。</text><circle cx="95" cy="393" r="22" fill="#1b365d"/><text x="83" y="401" font-size="23" fill="#faf9f5">2</text><rect x="145" y="345" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="375" font-size="22" fill="#1b365d">第22章</text><text x="172" y="408" font-size="23" fill="#24241f">1100—1131年</text><text x="172" y="439" font-size="18" fill="#77766e">PDF 471—480</text><text x="485" y="381" font-size="29" fill="#24241f">从远征到王国</text><text x="485" y="426" font-size="22" fill="#77766e">港口、定居与军事骑士团，构成长期治理的条件。</text><circle cx="95" cy="526" r="22" fill="#1b365d"/><text x="83" y="534" font-size="23" fill="#faf9f5">3</text><rect x="145" y="478" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="508" font-size="22" fill="#1b365d">第23章</text><text x="172" y="541" font-size="23" fill="#24241f">1131—1142年</text><text x="172" y="572" font-size="18" fill="#77766e">PDF 481—504</text><text x="485" y="514" font-size="29" fill="#24241f">梅利桑德的城市</text><text x="485" y="559" font-size="22" fill="#77766e">王室权力、集市与仪式，跨社群交往与限制同时存在。</text><circle cx="95" cy="659" r="22" fill="#1b365d"/><text x="83" y="667" font-size="23" fill="#faf9f5">4</text><rect x="145" y="611" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="641" font-size="22" fill="#1b365d">第24章</text><text x="172" y="674" font-size="23" fill="#24241f">1142—1174年</text><text x="172" y="705" font-size="18" fill="#77766e">PDF 505—523</text><text x="485" y="647" font-size="29" fill="#24241f">僵局与埃及之争</text><text x="485" y="692" font-size="22" fill="#77766e">叙利亚整合、第二次东征失败，埃及资源成为争夺焦点。</text><circle cx="95" cy="792" r="22" fill="#1b365d"/><text x="83" y="800" font-size="23" fill="#faf9f5">5</text><rect x="145" y="744" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="774" font-size="22" fill="#1b365d">第25章</text><text x="172" y="807" font-size="23" fill="#24241f">1174—1187年</text><text x="172" y="838" font-size="18" fill="#77766e">PDF 524—534</text><text x="485" y="780" font-size="29" fill="#24241f">勇气与继承危机</text><text x="485" y="825" font-size="22" fill="#77766e">鲍德温四世坚持统治；内部协调和水源影响军事选择。</text><circle cx="95" cy="925" r="22" fill="#1b365d"/><text x="83" y="933" font-size="23" fill="#faf9f5">6</text><rect x="145" y="877" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="907" font-size="22" fill="#1b365d">第26章</text><text x="172" y="940" font-size="23" fill="#24241f">1187—1189年</text><text x="172" y="971" font-size="18" fill="#77766e">PDF 535—555</text><text x="485" y="913" font-size="29" fill="#24241f">萨拉丁与圣城易手</text><text x="485" y="958" font-size="22" fill="#77766e">哈丁之后的围城、谈判、赎金与圣地重新安排。</text><circle cx="95" cy="1058" r="22" fill="#1b365d"/><text x="83" y="1066" font-size="23" fill="#faf9f5">7</text><rect x="145" y="1010" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="1040" font-size="22" fill="#1b365d">第27章</text><text x="172" y="1073" font-size="23" fill="#24241f">1189—1193年</text><text x="172" y="1104" font-size="18" fill="#77766e">PDF 556—567</text><text x="485" y="1046" font-size="29" fill="#24241f">理查的战斗与僵局</text><text x="485" y="1091" font-size="22" fill="#77766e">沿海胜利、逼近与撤退；1192年朝圣安排在下章接续。</text><circle cx="95" cy="1191" r="22" fill="#1b365d"/><text x="83" y="1199" font-size="23" fill="#faf9f5">8</text><rect x="145" y="1143" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="1173" font-size="22" fill="#1b365d">第28章</text><text x="172" y="1206" font-size="23" fill="#24241f">1193—1250年</text><text x="172" y="1237" font-size="18" fill="#77766e">PDF 568—588</text><text x="485" y="1179" font-size="29" fill="#24241f">家族争夺与外交交易</text><text x="485" y="1224" font-size="22" fill="#77766e">拆墙、1229年协议、再次易手与1244年的毁坏。</text><text x="60" y="1320" font-size="22" fill="#1b365d">按章序排列，非等比例年表。第28章末尾已前望蒙古威胁；未扩读第六部分正文。</text><text x="60" y="1364" font-size="20" fill="#77766e">来源：第五部分 PDF第451—588页。</text></svg>