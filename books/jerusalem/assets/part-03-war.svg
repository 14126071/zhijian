<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1110" role="img" aria-labelledby="title desc"><title id="title">614至630年：帝国主权与地方管理要分开看</title><desc id="desc">波斯征服后先支持犹太地方力量，617年转向基督徒，拜占庭的恢复统治与630年的归城仪式是后续阶段。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1110" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">第三部分 / 第16章的关键辨认</text><text x="60" y="120" font-size="42" fill="#24241f">同一座城，两层不同的权力</text><text x="60" y="168" font-size="24" fill="#77766e">把“谁是帝国强权”与“谁在城内获得管理空间”分开看。</text><text x="85" y="237" font-size="25" fill="#1b365d">时间与阶段</text><text x="430" y="237" font-size="25" fill="#1b365d">帝国强权</text><text x="795" y="237" font-size="25" fill="#1b365d">城内安排及其后果</text><rect x="60" y="275" width="1280" height="174" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="318" font-size="28" fill="#1b365d">614—617年</text><text x="85" y="365" font-size="23" fill="#24241f">波斯征服之后</text><text x="85" y="412" font-size="20" fill="#77766e">PDF 360—364</text><path d="M400 297V427 M765 297V427" stroke="#ddddd0"/><text x="430" y="339" font-size="29" fill="#24241f">波斯</text><text x="795" y="318" font-size="28" fill="#1b365d">支持犹太地方力量</text><text x="795" y="365" font-size="23" fill="#24241f">尼希米获得短暂的控制空间</text><text x="795" y="407" font-size="23" fill="#24241f">圣殿山活动恢复；基督徒遭报复</text><rect x="60" y="481" width="1280" height="174" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="524" font-size="28" fill="#1b365d">617年以后</text><text x="85" y="571" font-size="23" fill="#24241f">波斯改变支持对象</text><text x="85" y="618" font-size="20" fill="#77766e">PDF 364</text><path d="M400 503V633 M765 503V633" stroke="#ddddd0"/><text x="430" y="545" font-size="29" fill="#24241f">波斯仍占优势</text><text x="795" y="524" font-size="28" fill="#1b365d">转而支持基督徒</text><text x="795" y="571" font-size="23" fill="#24241f">犹太人被逐，尼希米被杀</text><text x="795" y="613" font-size="23" fill="#24241f">基督徒尝试修复遭破坏的教堂</text><rect x="60" y="687" width="1280" height="174" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="730" font-size="28" fill="#1b365d">630年</text><text x="85" y="777" font-size="23" fill="#24241f">希拉克略归城</text><text x="85" y="824" font-size="20" fill="#77766e">PDF 367—369</text><path d="M400 709V839 M765 709V839" stroke="#ddddd0"/><text x="430" y="751" font-size="29" fill="#24241f">拜占庭恢复统治</text><text x="795" y="730" font-size="28" fill="#1b365d">皇帝带回真十字架</text><text x="795" y="777" font-size="23" fill="#24241f">胜利仪式呈现恢复秩序的形象</text><text x="795" y="819" font-size="23" fill="#24241f">对犹太人的保证却再次被推翻</text><rect x="60" y="930" width="1280" height="100" rx="5" fill="#e8e6dc"/><text x="85" y="970" font-size="28" fill="#1b365d">617年基督徒重新管理圣城，并不等于波斯已经撤出。</text><text x="85" y="1010" font-size="23" fill="#24241f">地方机会依赖帝国支持；战胜外敌，也不自动保障每个共同体的安全。</text><text x="60" y="1074" font-size="20" fill="#77766e">来源：第16章 PDF第360—369页。“主权／地方管理”为阅读归纳，伤亡数字与宗教传说另作辨认。</text></svg>