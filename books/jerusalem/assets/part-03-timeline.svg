<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1280" role="img" aria-labelledby="title desc"><title id="title">第三部分：圣城的重建与裂缝</title><desc id="desc">七阶段阅读地图，按叙述顺序排列，非等比例时间轴。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1280" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">第三部分 / 第15—16章 · 公元312—630年</text><text x="60" y="120" font-size="42" fill="#24241f">圣城的重建与裂缝</text><text x="60" y="167" font-size="24" fill="#77766e">帝国支持、圣地建设、朝圣生活，与冲突和战争交织。</text><path d="M95 250V1100" stroke="#c4c5b8" stroke-width="3"/><circle cx="95" cy="260" r="22" fill="#1b365d"/><text x="83" y="268" font-size="23" fill="#faf9f5">1</text><rect x="145" y="212" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="248" font-size="24" fill="#1b365d">312—325年</text><text x="172" y="292" font-size="19" fill="#77766e">PDF 323—327</text><text x="485" y="248" font-size="29" fill="#24241f">帝国开始支持基督教</text><text x="485" y="293" font-size="22" fill="#77766e">从军事胜利到尼西亚会议；耶路撒冷重新进入皇帝视野。</text><circle cx="95" cy="393" r="22" fill="#1b365d"/><text x="83" y="401" font-size="23" fill="#faf9f5">2</text><rect x="145" y="345" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="381" font-size="24" fill="#1b365d">4世纪的圣城再造</text><text x="172" y="425" font-size="19" fill="#77766e">PDF 328—332</text><text x="485" y="381" font-size="29" fill="#24241f">圣墓教堂与朝圣路线</text><text x="485" y="426" font-size="22" fill="#77766e">海伦娜、地点辨认与建筑资助，把信仰记忆带入城市空间。</text><circle cx="95" cy="526" r="22" fill="#1b365d"/><text x="83" y="534" font-size="23" fill="#faf9f5">3</text><rect x="145" y="478" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="514" font-size="24" fill="#1b365d">363年</text><text x="172" y="558" font-size="19" fill="#77766e">PDF 333—337</text><text x="485" y="514" font-size="29" fill="#24241f">尤利安的重建被打断</text><text x="485" y="559" font-size="22" fill="#77766e">圣殿重建依赖皇帝支持；工程受阻，皇帝战死后政策撤销。</text><circle cx="95" cy="659" r="22" fill="#1b365d"/><text x="83" y="667" font-size="23" fill="#faf9f5">4</text><rect x="145" y="611" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="647" font-size="24" fill="#1b365d">438—451年及其后</text><text x="172" y="691" font-size="19" fill="#77766e">PDF 341—348</text><text x="485" y="647" font-size="29" fill="#24241f">欧多西亚、修士与主教</text><text x="485" y="692" font-size="22" fill="#77766e">建城与教义纷争并行，帝国法令也会遭到街头暴力挑战。</text><circle cx="95" cy="792" r="22" fill="#1b365d"/><text x="83" y="800" font-size="23" fill="#faf9f5">5</text><rect x="145" y="744" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="780" font-size="24" fill="#1b365d">查士丁尼时代</text><text x="172" y="824" font-size="19" fill="#77766e">PDF 355—360</text><text x="485" y="780" font-size="29" fill="#24241f">建筑与朝圣生活的高峰</text><text x="485" y="825" font-size="22" fill="#77766e">宏伟工程、商铺与接待设施繁荣；强制与排斥同样存在。</text><circle cx="95" cy="925" r="22" fill="#1b365d"/><text x="83" y="933" font-size="23" fill="#faf9f5">6</text><rect x="145" y="877" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="913" font-size="24" fill="#1b365d">614—617年</text><text x="172" y="957" font-size="19" fill="#77766e">PDF 360—364</text><text x="485" y="913" font-size="29" fill="#24241f">波斯征服与地方安排改变</text><text x="485" y="958" font-size="22" fill="#77766e">犹太人的短暂控制结束，基督徒恢复管理；波斯仍是强权。</text><circle cx="95" cy="1058" r="22" fill="#1b365d"/><text x="83" y="1066" font-size="23" fill="#faf9f5">7</text><rect x="145" y="1010" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="1046" font-size="24" fill="#1b365d">630年</text><text x="172" y="1090" font-size="19" fill="#77766e">PDF 365—369</text><text x="485" y="1046" font-size="29" fill="#24241f">希拉克略带回十字架</text><text x="485" y="1091" font-size="22" fill="#77766e">拜占庭恢复统治；不同社群面对的“胜利”并不相同。</text><text x="60" y="1207" font-size="22" fill="#1b365d">顺序示意，非等比例年表。312年的帝国支持，不等于基督教立刻成为唯一国教。</text><text x="60" y="1243" font-size="20" fill="#77766e">来源：第三部分 PDF第321—372页。未扩读第四部分。</text></svg>