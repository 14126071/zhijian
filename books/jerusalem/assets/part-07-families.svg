<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1280" role="img" aria-labelledby="title desc"><title id="title">耶路撒冷地方家族的职能与权势来源</title><desc id="desc">本部分涉及的五组职能联系；并非所有时期的固定编制，亦非家谱。地方权势仍处在帝国与省区制度之内。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1280" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">第七部分 / 职能关系，非血缘谱系</text><text x="60" y="120" font-size="42" fill="#24241f">地方名门怎样成为中间人？</text><text x="60" y="168" font-size="23" fill="#77766e">权势依赖多个条件。家族名号会改变，不能仅凭同名就认作未经变化的血统线。</text><rect x="60" y="220" width="400" height="122" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="265" font-size="28" fill="#1b365d">帝国与官员认可</text><text x="85" y="311" font-size="22" fill="#24241f">职位和管辖关系</text><rect x="500" y="220" width="400" height="122" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="525" y="265" font-size="28" fill="#1b365d">学识与财富</text><text x="525" y="311" font-size="22" fill="#24241f">宗教权威和经济资源</text><rect x="940" y="220" width="400" height="122" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="965" y="265" font-size="28" fill="#1b365d">庇护与联盟</text><text x="965" y="311" font-size="22" fill="#24241f">待客、护送、通婚与调解</text><text x="60" y="396" font-size="26" fill="#1b365d">本部分提到的家族与活动</text><rect x="60" y="430" width="1280" height="88" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="90" y="484" font-size="29" fill="#1b365d">努赛贝</text><text x="470" y="484" font-size="27" fill="#24241f">圣墓大教堂的守护与相关事务</text><rect x="60" y="542" width="1280" height="88" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="90" y="596" font-size="29" fill="#1b365d">达贾尼</text><text x="470" y="596" font-size="27" fill="#24241f">大卫墓的管理与守护</text><rect x="60" y="654" width="1280" height="88" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="90" y="708" font-size="29" fill="#1b365d">哈立迪</text><text x="470" y="708" font-size="27" fill="#24241f">参与伊斯兰教法庭事务</text><rect x="60" y="766" width="1280" height="88" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="90" y="820" font-size="29" fill="#1b365d">侯赛尼</text><text x="470" y="820" font-size="27" fill="#24241f">穆夫提、圣裔领袖与先知穆萨节等职能</text><rect x="60" y="878" width="1280" height="88" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="90" y="932" font-size="29" fill="#1b365d">阿布·古沙</text><text x="470" y="932" font-size="27" fill="#24241f">周边山区与雅法通往圣城的朝圣路线</text><rect x="60" y="1040" width="1280" height="130" rx="5" fill="#e8e6dc"/><text x="85" y="1083" font-size="29" fill="#1b365d">地方家族有影响力，仍不等于独立掌握城市主权。</text><text x="85" y="1125" font-size="23" fill="#24241f">总督、地方官与法官的管辖持续存在；行政隶属、家族地位和具体职能都会变化。</text><text x="60" y="1225" font-size="20" fill="#77766e">来源：第32—33章 PDF第630、657—659、665—666页。未自行核验各家族完整谱系。</text></svg>