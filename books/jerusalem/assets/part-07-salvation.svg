<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1110" role="img" aria-labelledby="title desc"><title id="title">救赎想象与圣地实践的三条线</title><desc id="desc">并列比较部分新教徒、喀巴拉与弥赛亚期待、苏菲派的实践；不把它们视为统一教义或相互导致。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1110" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">第七部分 / 比较联系，也保留差别</text><text x="60" y="120" font-size="40" fill="#24241f">同一座圣城，三条不同的信仰线索</text><text x="60" y="168" font-size="24" fill="#77766e">并列比较，非相互导致的链条；每一列内部都有不同意见与实践。</text><rect x="60" y="225" width="400" height="650" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="275" font-size="27" fill="#1b365d">部分新教徒</text><text x="85" y="322" font-size="23" fill="#24241f">《圣经》与新锡安</text><text x="85" y="385" font-size="23" fill="#1b365d">怎样实践</text><text x="85" y="428" font-size="22" fill="#77766e">读经、旅行与祈祷</text><text x="85" y="464" font-size="22" fill="#77766e">在远方想象新的应许之地</text><text x="85" y="530" font-size="23" fill="#1b365d">圣城的意义</text><text x="85" y="573" font-size="22" fill="#77766e">实地朝圣仍可具有吸引力</text><text x="85" y="609" font-size="22" fill="#77766e">也能成为殖民使命的语言</text><text x="85" y="675" font-size="23" fill="#1b365d">要保留的分歧</text><text x="85" y="718" font-size="22" fill="#77766e">亲近犹太传统的动机不同</text><text x="85" y="754" font-size="22" fill="#77766e">支持返回也可能要求改宗</text><text x="85" y="842" font-size="17" fill="#77766e">PDF 631—632、637—642</text><rect x="500" y="225" width="400" height="650" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="525" y="275" font-size="27" fill="#1b365d">部分犹太信徒</text><text x="525" y="322" font-size="23" fill="#24241f">喀巴拉与弥赛亚期待</text><text x="525" y="385" font-size="23" fill="#1b365d">怎样实践</text><text x="525" y="428" font-size="22" fill="#77766e">研读神秘文本与符号</text><text x="525" y="464" font-size="22" fill="#77766e">在苦难中期待救赎</text><text x="525" y="530" font-size="23" fill="#1b365d">圣城的意义</text><text x="525" y="573" font-size="22" fill="#77766e">既是定居和生活的地方</text><text x="525" y="609" font-size="22" fill="#77766e">也是救赎期待中的中心</text><text x="525" y="675" font-size="23" fill="#1b365d">要保留的分歧</text><text x="525" y="718" font-size="22" fill="#77766e">拉比们并不都认可沙巴泰</text><text x="525" y="754" font-size="22" fill="#77766e">改宗后仍有少数追随者</text><text x="525" y="842" font-size="17" fill="#77766e">PDF 635、641—644、652</text><rect x="940" y="225" width="400" height="650" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="965" y="275" font-size="27" fill="#1b365d">苏菲派的圣地生活</text><text x="965" y="322" font-size="23" fill="#24241f">赞念、修会与亲近真主</text><text x="965" y="385" font-size="23" fill="#1b365d">怎样实践</text><text x="965" y="428" font-size="22" fill="#77766e">唱诵、仪式与修道院生活</text><text x="965" y="464" font-size="22" fill="#77766e">由苏丹等赞助者支持</text><text x="965" y="530" font-size="23" fill="#1b365d">圣城的意义</text><text x="965" y="573" font-size="22" fill="#77766e">是可以居住、游访的圣地</text><text x="965" y="609" font-size="22" fill="#77766e">礼拜与花园、交往相连</text><text x="965" y="675" font-size="23" fill="#1b365d">要保留的分歧</text><text x="965" y="718" font-size="22" fill="#77766e">爱维亚赞美某些仪式</text><text x="965" y="754" font-size="22" fill="#77766e">保守穆斯林却提出批评</text><text x="965" y="842" font-size="17" fill="#77766e">PDF 644—649</text><rect x="60" y="935" width="1280" height="90" rx="5" fill="#e8e6dc"/><text x="85" y="974" font-size="25" fill="#1b365d">流亡、战争与宗教争论可以构成共同背景，仍不能抹去各自的目标与差别。</text><text x="85" y="1008" font-size="22" fill="#24241f">宗教信念也可能与政治合作、排斥及暴力并存，需逐项阅读。</text><text x="60" y="1072" font-size="20" fill="#77766e">来源：图中所列页段。此图是理解路径，不是三种宗教的完整教义说明。</text></svg>