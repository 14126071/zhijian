<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1280" role="img" aria-labelledby="title desc"><title id="title">第一部分：王城、圣殿与流亡</title><desc id="desc">第1至13章的七阶段地图。图轴不按年数比例，70年具体围城场景不在本次阅读范围。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif;fill:#24241f}.blue{fill:#1b365d}.muted{fill:#77766e}</style><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#f5f4ed"/><text x="60" y="60" font-size="20" class="blue" text-anchor="start">第一部分 / 第1—13章</text><text x="60" y="118" font-size="39" class="" text-anchor="start">一座王城，怎样变成无法忘记的圣城？</text><text x="60" y="161" font-size="20" class="muted" text-anchor="start">沿着“城、殿、经”的变化读 · 顺序示意，非等比例年表</text><path d="M90 230V1110" stroke="#c8c7b9" stroke-width="2"/><circle cx="90" cy="258" r="24" fill="#1b365d"/><text x="90" y="265" font-size="20" text-anchor="middle" style="fill:#faf9f5">01</text><rect x="140" y="206" width="1200" height="111" rx="4" fill="#faf9f5" stroke="#e3e1d7"/><text x="165" y="243" font-size="23" class="blue" text-anchor="start">古代起源与建都</text><text x="165" y="284" font-size="19" class="muted" text-anchor="start">第1—3章</text><text x="485" y="243" font-size="28" class="" text-anchor="start">旧要塞 → 王城与圣殿</text><text x="485" y="285" font-size="21" class="muted" text-anchor="start">大卫汇聚部落与约柜，所罗门以圣殿固定共同中心。</text><circle cx="90" cy="392" r="24" fill="#1b365d"/><text x="90" y="399" font-size="20" text-anchor="middle" style="fill:#faf9f5">02</text><rect x="140" y="340" width="1200" height="111" rx="4" fill="#faf9f5" stroke="#e3e1d7"/><text x="165" y="377" font-size="23" class="blue" text-anchor="start">前930—前586年</text><text x="165" y="418" font-size="19" class="muted" text-anchor="start">第4—5章</text><text x="485" y="377" font-size="28" class="" text-anchor="start">分裂与毁灭 → 记忆与经典</text><text x="485" y="419" font-size="21" class="muted" text-anchor="start">南北分裂、大国进逼；流亡后，以律法和故城记忆维系身份。</text><circle cx="90" cy="526" r="24" fill="#1b365d"/><text x="90" y="533" font-size="20" text-anchor="middle" style="fill:#faf9f5">03</text><rect x="140" y="474" width="1200" height="111" rx="4" fill="#faf9f5" stroke="#e3e1d7"/><text x="165" y="511" font-size="23" class="blue" text-anchor="start">前539年之后</text><text x="165" y="552" font-size="19" class="muted" text-anchor="start">第6章</text><text x="485" y="511" font-size="28" class="" text-anchor="start">回归与重建 → 帝国内的共同体</text><text x="485" y="553" font-size="21" class="muted" text-anchor="start">第二圣殿于前515年落成；恢复圣所，不等于恢复独立王国。</text><circle cx="90" cy="660" r="24" fill="#1b365d"/><text x="90" y="667" font-size="20" text-anchor="middle" style="fill:#faf9f5">04</text><rect x="140" y="608" width="1200" height="111" rx="4" fill="#faf9f5" stroke="#e3e1d7"/><text x="165" y="645" font-size="23" class="blue" text-anchor="start">希腊化与马卡比时期</text><text x="165" y="686" font-size="19" class="muted" text-anchor="start">第7—8章</text><text x="485" y="645" font-size="28" class="" text-anchor="start">文化冲突 → 起义、自治与王朝</text><text x="485" y="687" font-size="21" class="muted" text-anchor="start">反抗者逐渐成为统治者，信仰、资源和王权之争彼此交织。</text><circle cx="90" cy="794" r="24" fill="#1b365d"/><text x="90" y="801" font-size="20" text-anchor="middle" style="fill:#faf9f5">05</text><rect x="140" y="742" width="1200" height="111" rx="4" fill="#faf9f5" stroke="#e3e1d7"/><text x="165" y="779" font-size="23" class="blue" text-anchor="start">罗马介入与希律时期</text><text x="165" y="820" font-size="19" class="muted" text-anchor="start">第9—10章</text><text x="485" y="779" font-size="28" class="" text-anchor="start">帝国支持 → 王权与建筑极盛</text><text x="485" y="821" font-size="21" class="muted" text-anchor="start">本地王位依赖罗马，圣殿却在希律手中扩建得空前壮丽。</text><circle cx="90" cy="928" r="24" fill="#1b365d"/><text x="90" y="935" font-size="20" text-anchor="middle" style="fill:#faf9f5">06</text><rect x="140" y="876" width="1200" height="111" rx="4" fill="#faf9f5" stroke="#e3e1d7"/><text x="165" y="913" font-size="23" class="blue" text-anchor="start">公元1世纪前中期</text><text x="165" y="954" font-size="19" class="muted" text-anchor="start">第11—12章</text><text x="485" y="913" font-size="28" class="" text-anchor="start">救赎期待 → 共同体边界的变化</text><text x="485" y="955" font-size="21" class="muted" text-anchor="start">耶稣、雅各、保罗：对圣殿、律法和非犹太信徒的不同理解。</text><circle cx="90" cy="1062" r="24" fill="#1b365d"/><text x="90" y="1069" font-size="20" text-anchor="middle" style="fill:#faf9f5">07</text><rect x="140" y="1010" width="1200" height="111" rx="4" fill="#faf9f5" stroke="#e3e1d7"/><text x="165" y="1047" font-size="23" class="blue" text-anchor="start">公元66—70年</text><text x="165" y="1088" font-size="19" class="muted" text-anchor="start">第13章</text><text x="485" y="1047" font-size="28" class="" text-anchor="start">起义与内战 → 城市逼近灾难</text><text x="485" y="1089" font-size="21" class="muted" text-anchor="start">罗马镇压与内部争斗叠加；章末停在提图斯率军进发。</text><text x="60" y="1194" font-size="20" class="blue" text-anchor="start">公元70年毁殿的详细场景在“序幕”；本轮未扩读。结局已见第5、10章回指。</text><text x="60" y="1232" font-size="18" class="muted" text-anchor="start">来源：第一部分 PDF第60—292页。阶段标题和箭头为阅读归纳，不表示历史必然如此演进。</text></svg>