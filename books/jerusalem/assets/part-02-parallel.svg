<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1040" role="img" aria-labelledby="title"><title id="title">同一座城，三种延续：统治、共同体记忆与圣地传统</title><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style></defs><rect width="1400" height="1040" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">第二部分 / 三条并行线索</text><text x="60" y="122" font-size="42" fill="#24241f">同一座城，三种延续</text><text x="60" y="170" font-size="24" fill="#77766e">空间的控制、共同体的生活与神圣记忆，并不总在同一处。</text><rect x="60" y="215" width="410" height="665" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="84" y="263" font-size="31" fill="#1b365d">罗马帝国</text><text x="84" y="305" font-size="23" fill="#77766e">谁来定义地上的城市？</text><path d="M84 344H446" stroke="#ddddd0"/><text x="84" y="378" font-size="25" fill="#1b365d">控制与命名</text><text x="84" y="422" font-size="24" fill="#24241f">驻军、税收、殖民城市</text><text x="84" y="459" font-size="24" fill="#24241f">埃利亚·卡皮托利纳</text><path d="M84 509H446" stroke="#ddddd0"/><text x="84" y="543" font-size="25" fill="#1b365d">重组空间</text><text x="84" y="587" font-size="24" fill="#24241f">街道、广场与神庙</text><text x="84" y="624" font-size="24" fill="#24241f">覆盖旧城的公共身份</text><path d="M84 674H446" stroke="#ddddd0"/><text x="84" y="708" font-size="25" fill="#1b365d">本章中的变化</text><text x="84" y="752" font-size="24" fill="#24241f">城市规模缩小</text><text x="84" y="789" font-size="24" fill="#24241f">军团撤离后更加闭塞</text><rect x="495" y="215" width="410" height="665" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="519" y="263" font-size="31" fill="#1b365d">犹太社群</text><text x="519" y="305" font-size="23" fill="#77766e">失去圣殿，怎样延续？</text><path d="M519 344H881" stroke="#ddddd0"/><text x="519" y="378" font-size="25" fill="#1b365d">维系共同生活</text><text x="519" y="422" font-size="24" fill="#24241f">律法、善行与教学</text><text x="519" y="459" font-size="24" fill="#24241f">圣殿之外的社群实践</text><path d="M519 509H881" stroke="#ddddd0"/><text x="519" y="543" font-size="25" fill="#1b365d">保存朝向圣城的记忆</text><text x="519" y="587" font-size="24" fill="#24241f">祈祷、节日与哀悼</text><text x="519" y="624" font-size="24" fill="#24241f">盼望圣殿重建</text><path d="M519 674H881" stroke="#ddddd0"/><text x="519" y="708" font-size="25" fill="#1b365d">本章中的变化</text><text x="519" y="752" font-size="24" fill="#24241f">在禁令与缓和之间</text><text x="519" y="789" font-size="24" fill="#24241f">争取有限的活动空间</text><rect x="930" y="215" width="410" height="665" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="954" y="263" font-size="31" fill="#1b365d">不同基督徒</text><text x="954" y="305" font-size="23" fill="#77766e">圣城在天上，还是地上？</text><path d="M954 344H1316" stroke="#ddddd0"/><text x="954" y="378" font-size="25" fill="#1b365d">解释毁殿的意义</text><text x="954" y="422" font-size="24" fill="#24241f">部分人强调天国之城</text><text x="954" y="459" font-size="24" fill="#24241f">与犹太传统逐渐分化</text><path d="M954 509H1316" stroke="#ddddd0"/><text x="954" y="543" font-size="25" fill="#1b365d">保留地方圣地传统</text><text x="954" y="587" font-size="24" fill="#24241f">受难与复活地点的记忆</text><text x="954" y="624" font-size="24" fill="#24241f">本地信徒持续祈祷</text><path d="M954 674H1316" stroke="#ddddd0"/><text x="954" y="708" font-size="25" fill="#1b365d">本章中的变化</text><text x="954" y="752" font-size="24" fill="#24241f">遭受罗马皇帝迫害</text><text x="954" y="789" font-size="24" fill="#24241f">帝国转向尚待下一部分</text><text x="60" y="934" font-size="22" fill="#1b365d">并行线索，不代表三个内部一致、彼此隔绝的阵营。迫害、分歧与互动始终存在。</text><text x="60" y="977" font-size="21" fill="#77766e">来源：PDF第300—301、310—315、319—320页。三列的组织方式为阅读归纳。</text></svg>