<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1190" role="img" aria-labelledby="title desc"><title id="title">共享圣城，需要回答四组问题</title><desc id="desc">依据作者讨论整理的阅读框架；四层相互影响，没有一层能够替代其余各层。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1190" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">后记 / “明天”的问题分层</text><text x="60" y="120" font-size="42" fill="#24241f">共享圣城，需要回答四组问题</text><text x="60" y="168" font-size="23" fill="#77766e">依据作者讨论整理的阅读框架；四层相互影响，没有一层能够替代其余各层。</text><rect x="60" y="225" width="1280" height="180" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="267" font-size="27" fill="#1b365d">01  居住与公共服务</text><text x="85" y="369" font-size="17" fill="#77766e">PDF 1082—1083、1104—1105</text><text x="540" y="267" font-size="29" fill="#24241f">人住在哪里，如何生活？</text><text x="540" y="320" font-size="23" fill="#77766e">住房、搬迁、土地、建房需求，以及公共服务的分配。</text><text x="540" y="360" font-size="23" fill="#77766e">修缮、扩建与定居项目，需要分别看具体居民及其后果。</text><rect x="60" y="435" width="1280" height="180" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="477" font-size="27" fill="#1b365d">02  政治与市政</text><text x="85" y="579" font-size="17" fill="#77766e">PDF 1088—1090</text><text x="540" y="477" font-size="29" fill="#24241f">谁作决定，怎样执行？</text><text x="540" y="530" font-size="23" fill="#77766e">政治主权、市政管理、安全、争端处理与监督机制。</text><text x="540" y="570" font-size="23" fill="#77766e">一条地图边界仍需要具体的机构、授权和日常执行。</text><rect x="60" y="645" width="1280" height="180" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="687" font-size="27" fill="#1b365d">03  宗教管理与通行</text><text x="85" y="789" font-size="17" fill="#77766e">PDF 1083—1084、1089—1090</text><text x="540" y="687" font-size="29" fill="#24241f">谁能进入，谁在何处礼拜？</text><text x="540" y="740" font-size="23" fill="#77766e">场所管理、许可、检查与实际到达圣地的能力。</text><text x="540" y="780" font-size="23" fill="#77766e">原则上的礼拜自由，与居民的可达性可能存在距离。</text><rect x="60" y="855" width="1280" height="180" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="897" font-size="27" fill="#1b365d">04  历史承认与信任</text><text x="85" y="999" font-size="17" fill="#77766e">PDF 1090—1092</text><text x="540" y="897" font-size="29" fill="#24241f">如何容纳不同的记忆？</text><text x="540" y="950" font-size="23" fill="#77766e">古老遗产、现代创伤，以及对安全和尊严的要求。</text><text x="540" y="990" font-size="23" fill="#77766e">相互承认需要制度承接，不能只停在感情上的谅解。</text><text x="60" y="1112" font-size="23" fill="#1b365d">历史联系、具体权利、宗教管理与实际通行，需要彼此连接、分别说明。</text><text x="60" y="1158" font-size="20" fill="#77766e">来源：图中页段。本图为助手的分层归纳，非原书制度方案或当代政策建议。</text></svg>