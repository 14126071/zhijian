<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1420" role="img" aria-labelledby="title desc"><title id="title">第四部分：圣地重塑与王朝更替</title><desc id="desc">八个节点解释征服、建筑、政治中心转移和围城前夜；时间间距不按比例。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1420" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">第四部分 / 第17—20章 · 630—1099年</text><text x="60" y="120" font-size="42" fill="#24241f">圣地重塑与王朝更替</text><text x="60" y="167" font-size="24" fill="#77766e">同一座圣城，经历不同政权、政治重心与社群安排。</text><path d="M95 250V1200" stroke="#c4c5b8" stroke-width="3"/><circle cx="95" cy="260" r="22" fill="#1b365d"/><text x="83" y="268" font-size="23" fill="#faf9f5">1</text><rect x="145" y="212" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="248" font-size="24" fill="#1b365d">636年及其后</text><text x="172" y="292" font-size="19" fill="#77766e">PDF 381—394</text><text x="485" y="248" font-size="29" fill="#24241f">阿拉伯征服与欧麦尔接收</text><text x="485" y="293" font-size="22" fill="#77766e">军事胜利之后，保护、纳税与礼拜空间进入新的统治安排。</text><circle cx="95" cy="393" r="22" fill="#1b365d"/><text x="83" y="401" font-size="23" fill="#faf9f5">2</text><rect x="145" y="345" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="381" font-size="24" fill="#1b365d">661年</text><text x="172" y="425" font-size="19" fill="#77766e">PDF 396—401</text><text x="485" y="381" font-size="29" fill="#24241f">穆阿维叶在圣城获效忠</text><text x="485" y="426" font-size="22" fill="#77766e">统治中心在大马士革；圣城也是展示合法性的重要舞台。</text><circle cx="95" cy="526" r="22" fill="#1b365d"/><text x="83" y="534" font-size="23" fill="#faf9f5">3</text><rect x="145" y="478" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="514" font-size="24" fill="#1b365d">691—692年</text><text x="172" y="558" font-size="19" fill="#77766e">PDF 401—410</text><text x="485" y="514" font-size="29" fill="#24241f">岩石圆顶建筑完工</text><text x="485" y="559" font-size="22" fill="#77766e">马利克以建筑和铭文表达信仰与王朝主张，阿克萨随后扩建。</text><circle cx="95" cy="659" r="22" fill="#1b365d"/><text x="83" y="667" font-size="23" fill="#faf9f5">4</text><rect x="145" y="611" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="647" font-size="24" fill="#1b365d">750年之后</text><text x="172" y="691" font-size="19" fill="#77766e">PDF 418—424</text><text x="485" y="647" font-size="29" fill="#24241f">阿拔斯重心转向东方</text><text x="485" y="692" font-size="22" fill="#77766e">首都巴格达；圣城仍有神圣声望，政治投入却逐渐减少。</text><circle cx="95" cy="792" r="22" fill="#1b365d"/><text x="83" y="800" font-size="23" fill="#faf9f5">5</text><rect x="145" y="744" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="780" font-size="24" fill="#1b365d">969年起</text><text x="172" y="824" font-size="19" fill="#77766e">PDF 427—435</text><text x="485" y="780" font-size="29" fill="#24241f">法蒂玛统治与开罗支援</text><text x="485" y="825" font-size="22" fill="#77766e">宫廷、商人和社群网络带来资助，贫困与纷争仍然存在。</text><circle cx="95" cy="925" r="22" fill="#1b365d"/><text x="83" y="933" font-size="23" fill="#faf9f5">6</text><rect x="145" y="877" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="913" font-size="24" fill="#1b365d">1009—1048年</text><text x="172" y="957" font-size="19" fill="#77766e">PDF 435—440</text><text x="485" y="913" font-size="29" fill="#24241f">毁坏、地震与重建</text><text x="485" y="958" font-size="22" fill="#77766e">哈基姆毁堂；其后有政策转向、地震与圣墓教堂重建。</text><circle cx="95" cy="1058" r="22" fill="#1b365d"/><text x="83" y="1066" font-size="23" fill="#faf9f5">7</text><rect x="145" y="1010" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="1046" font-size="24" fill="#1b365d">1073年及其后</text><text x="172" y="1090" font-size="19" fill="#77766e">PDF 443—445</text><text x="485" y="1046" font-size="29" fill="#24241f">土库曼军事力量掌城</text><text x="485" y="1091" font-size="22" fill="#77766e">阿齐兹围城，随后镇压反抗；军事首领与继承者相继统治。</text><circle cx="95" cy="1191" r="22" fill="#1b365d"/><text x="83" y="1199" font-size="23" fill="#faf9f5">8</text><rect x="145" y="1143" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="1179" font-size="24" fill="#1b365d">1098—1099年</text><text x="172" y="1223" font-size="19" fill="#77766e">PDF 445—446</text><text x="485" y="1179" font-size="29" fill="#24241f">法蒂玛夺回，法兰克人逼近</text><text x="485" y="1224" font-size="22" fill="#77766e">埃及重新掌城；第四部分止于1099年6月的围城前夜。</text><text x="60" y="1320" font-size="22" fill="#1b365d">顺序示意，非等比例年表。统治者与政策反复改变，不能将五个世纪视为一种不变的安排。</text><text x="60" y="1364" font-size="20" fill="#77766e">来源：第四部分 PDF第373—450页；未扩读第五部分的攻城与屠杀。</text></svg>