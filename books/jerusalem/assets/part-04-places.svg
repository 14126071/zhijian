<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1130" role="img" aria-labelledby="title desc"><title id="title">圣殿山、岩石圆顶与阿克萨不是三个相同的名称</title><desc id="desc">概念关系示意：两处不同的建筑位于同一平台空间，圣墓大教堂是城内另一处圣地；不是实测地图。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1130" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">第四部分 / 建筑与空间的辨认</text><text x="60" y="120" font-size="42" fill="#24241f">同一平台，不同建筑与功能</text><text x="60" y="170" font-size="24" fill="#77766e">概念关系示意，非实测平面图；位置、尺度与距离不按比例。</text><rect x="60" y="220" width="1280" height="600" rx="6" fill="#eeede4" stroke="#b8bba9" stroke-width="2"/><text x="90" y="270" font-size="32" fill="#1b365d">圣殿山 / 尊贵的禁地</text><text x="90" y="316" font-size="24" fill="#77766e">承载多处圣地、建筑与礼拜活动的平台空间</text><rect x="100" y="355" width="550" height="370" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="124" y="405" font-size="33" fill="#1b365d">岩石圆顶圣祠</text><text x="124" y="450" font-size="22" fill="#77766e">沿用原书译名：岩石圆顶清真寺</text><text x="124" y="510" font-size="25" fill="#24241f">环绕圣石的圆顶建筑</text><text x="124" y="558" font-size="25" fill="#24241f">691—692年完工</text><text x="124" y="606" font-size="25" fill="#24241f">神学铭文、礼仪与王朝形象</text><text x="124" y="654" font-size="25" fill="#24241f">不是南侧的集体礼拜建筑</text><rect x="750" y="355" width="550" height="370" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="774" y="405" font-size="33" fill="#1b365d">南侧阿克萨礼拜建筑</text><text x="774" y="450" font-size="22" fill="#77766e">此处“阿克萨”特指本章南侧建筑</text><text x="774" y="510" font-size="25" fill="#24241f">承担周五集体礼拜等功能</text><text x="774" y="558" font-size="25" fill="#24241f">马利克与瓦利德推动建设</text><text x="774" y="606" font-size="25" fill="#24241f">历经地震、破坏与重修</text><text x="774" y="654" font-size="25" fill="#24241f">不是岩石圆顶建筑的别名</text><text x="90" y="782" font-size="25" fill="#1b365d">既有圣殿记忆，与新的伊斯兰礼拜、建筑和继承主张在这里交汇。</text><rect x="60" y="862" width="1280" height="130" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="88" y="905" font-size="29" fill="#1b365d">城市中的另一处圣地：圣墓大教堂</text><text x="88" y="953" font-size="24" fill="#24241f">位于此平台之外。不能把它与圣殿山上的两座建筑，合并为同一地点的不同名字。</text><text x="60" y="1061" font-size="20" fill="#77766e">来源：PDF第388—393、403—410、439—440页。原书“圣殿恢复”的解释不等于犹太圣殿原样重建。</text></svg>