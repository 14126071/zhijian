<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" role="img" aria-labelledby="title desc"><title id="title">圣殿：信仰、权威、财富与身份交汇的地方</title><desc id="desc">四个维度说明圣殿为何在不同章节反复出现，下方区分第一圣殿、第二圣殿及希律改造。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif;fill:#24241f}.blue{fill:#1b365d}.muted{fill:#77766e}</style><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#f5f4ed"/><text x="60" y="60" font-size="20" class="blue" text-anchor="start">第一部分 / 理解枢纽</text><text x="60" y="118" font-size="39" class="" text-anchor="start">为什么几乎所有线索，都回到圣殿？</text><path d="M530 350H580" fill="none" stroke="#1b365d" stroke-width="1.7" marker-end="url(#a)"/><path d="M820 350H870" fill="none" stroke="#1b365d" stroke-width="1.7" marker-end="url(#a)"/><path d="M530 570H580" fill="none" stroke="#1b365d" stroke-width="1.7" marker-end="url(#a)"/><path d="M820 570H870" fill="none" stroke="#1b365d" stroke-width="1.7" marker-end="url(#a)"/><rect x="60" y="240" width="470" height="180" rx="5" fill="#faf9f5" stroke="#dddcd0"/><text x="84" y="279" font-size="27" class="blue" text-anchor="start">信仰与祭祀</text><text x="84" y="318" font-size="21" class="muted" text-anchor="start">献祭、节日、朝圣与神圣临在</text><text x="84" y="350" font-size="21" class="muted" text-anchor="start">决定人们如何接近上帝</text><rect x="870" y="240" width="470" height="180" rx="5" fill="#faf9f5" stroke="#dddcd0"/><text x="894" y="279" font-size="27" class="blue" text-anchor="start">统治与合法性</text><text x="894" y="318" font-size="21" class="muted" text-anchor="start">国王、大祭司、帝国的关系</text><text x="894" y="350" font-size="21" class="muted" text-anchor="start">任命与献祭也表达政治服从</text><rect x="60" y="480" width="470" height="180" rx="5" fill="#faf9f5" stroke="#dddcd0"/><text x="84" y="519" font-size="27" class="blue" text-anchor="start">财富与城市生活</text><text x="84" y="558" font-size="21" class="muted" text-anchor="start">贡赋、捐献、兑换与祭品交易</text><text x="84" y="590" font-size="21" class="muted" text-anchor="start">财富吸引朝圣者，也招致掠夺</text><rect x="870" y="480" width="470" height="180" rx="5" fill="#faf9f5" stroke="#dddcd0"/><text x="894" y="519" font-size="27" class="blue" text-anchor="start">身份与共同体边界</text><text x="894" y="558" font-size="21" class="muted" text-anchor="start">律法、洁净与不同庭院的准入</text><text x="894" y="590" font-size="21" class="muted" text-anchor="start">有关“谁属于我们”的实践</text><rect x="580" y="282" width="240" height="340" rx="110" fill="#e8e6dc" stroke="#b7b8a7"/><text x="700" y="422" font-size="48" class="blue" text-anchor="middle">圣殿</text><text x="700" y="470" font-size="23" class="muted" text-anchor="middle">不只是建筑</text><text x="700" y="514" font-size="21" class="muted" text-anchor="middle">也是关系的中心</text><text x="60" y="748" font-size="29" class="" text-anchor="start">两次断裂，不能把中间的重建混在一起</text><rect x="60" y="790" width="290" height="149" rx="5" fill="#faf9f5" stroke="#dddcd0"/><text x="84" y="829" font-size="27" class="blue" text-anchor="start">第一圣殿</text><text x="84" y="868" font-size="21" class="muted" text-anchor="start">所罗门建殿</text><text x="84" y="900" font-size="21" class="muted" text-anchor="start">前586年被毁</text><path d="M356 864H380" fill="none" stroke="#1b365d" stroke-width="1.7" marker-end="url(#a)"/><rect x="390" y="790" width="290" height="149" rx="5" fill="#faf9f5" stroke="#dddcd0"/><text x="414" y="829" font-size="27" class="blue" text-anchor="start">流亡与回归</text><text x="414" y="868" font-size="21" class="muted" text-anchor="start">经典、律法与记忆</text><text x="414" y="900" font-size="21" class="muted" text-anchor="start">政治上进入波斯帝国</text><path d="M686 864H710" fill="none" stroke="#1b365d" stroke-width="1.7" marker-end="url(#a)"/><rect x="720" y="790" width="290" height="149" rx="5" fill="#faf9f5" stroke="#dddcd0"/><text x="744" y="829" font-size="27" class="blue" text-anchor="start">第二圣殿</text><text x="744" y="868" font-size="21" class="muted" text-anchor="start">前515年落成</text><text x="744" y="900" font-size="21" class="muted" text-anchor="start">后来由希律大规模改造</text><path d="M1016 864H1040" fill="none" stroke="#1b365d" stroke-width="1.7" marker-end="url(#a)"/><rect x="1050" y="790" width="290" height="149" rx="5" fill="#faf9f5" stroke="#dddcd0"/><text x="1074" y="829" font-size="27" class="blue" text-anchor="start">公元70年</text><text x="1074" y="868" font-size="21" class="muted" text-anchor="start">第二圣殿被毁</text><text x="1074" y="900" font-size="21" class="muted" text-anchor="start">共同体并未因此终结</text><text x="60" y="1010" font-size="19" class="blue" text-anchor="start">图为关系示意，不是圣殿平面图；希律的工程属于第二圣殿历史，不另列为“第三圣殿”。</text><text x="60" y="1050" font-size="18" class="muted" text-anchor="start">来源：PDF第96、117—138、150—158、180—182、205—209、238—246、281—286页。</text></svg>