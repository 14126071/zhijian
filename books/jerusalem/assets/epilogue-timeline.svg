<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1290" role="img" aria-labelledby="title desc"><title id="title">1967年以后，城市仍在改变</title><desc id="desc">按后记叙述选取节点；止于作者约2010—2011年的写作语境。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1290" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">后记 / 从那时到现在</text><text x="60" y="120" font-size="42" fill="#24241f">1967年以后，城市仍在改变</text><text x="60" y="168" font-size="23" fill="#77766e">按后记叙述选取节点；止于作者约2010—2011年的写作语境。</text><path d="M95 270V1140" stroke="#c4c5b8" stroke-width="3"/><circle cx="95" cy="270" r="21" fill="#1b365d"/><text x="83" y="278" font-size="23" fill="#faf9f5">1</text><rect x="145" y="225" width="1195" height="115" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="261" font-size="24" fill="#1b365d">1967年以后</text><text x="172" y="313" font-size="20" fill="#77766e">PDF 1064—1069</text><text x="485" y="261" font-size="28" fill="#24241f">控制、建设与宗教热情</text><text x="485" y="311" font-size="22" fill="#77766e">扩大市界、修复犹太区与西墙空间；马格里布区居民迁离。</text><circle cx="95" cy="405" r="21" fill="#1b365d"/><text x="83" y="413" font-size="23" fill="#faf9f5">2</text><rect x="145" y="360" width="1195" height="115" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="396" font-size="24" fill="#1b365d">1973—1979年</text><text x="172" y="448" font-size="20" fill="#77766e">PDF 1070—1072</text><text x="485" y="396" font-size="28" fill="#24241f">战争之后，埃以和平打开另一条路</text><text x="485" y="446" font-size="22" fill="#77766e">萨达特访问耶路撒冷，西奈问题与圣城问题采取不同安排。</text><circle cx="95" cy="540" r="21" fill="#1b365d"/><text x="83" y="548" font-size="23" fill="#faf9f5">3</text><rect x="145" y="495" width="1195" height="115" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="531" font-size="24" fill="#1b365d">1987年起</text><text x="172" y="583" font-size="20" fill="#77766e">PDF 1073—1074</text><text x="485" y="531" font-size="28" fill="#24241f">第一次起义与政治力量变化</text><text x="485" y="581" font-size="22" fill="#77766e">哈马斯兴起；跨社群工作与街区往来受到冲击。</text><circle cx="95" cy="675" r="21" fill="#1b365d"/><text x="83" y="683" font-size="23" fill="#faf9f5">4</text><rect x="145" y="630" width="1195" height="115" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="666" font-size="24" fill="#1b365d">1993—1995年</text><text x="172" y="718" font-size="20" fill="#77766e">PDF 1074—1076</text><text x="485" y="666" font-size="28" fill="#24241f">奥斯陆进程与拉宾遇刺</text><text x="485" y="716" font-size="22" fill="#77766e">临时安排启动；耶路撒冷留待后续谈判，暴力破坏信任。</text><circle cx="95" cy="810" r="21" fill="#1b365d"/><text x="83" y="818" font-size="23" fill="#faf9f5">5</text><rect x="145" y="765" width="1195" height="115" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="801" font-size="24" fill="#1b365d">2000年及随后</text><text x="172" y="853" font-size="20" fill="#77766e">PDF 1078—1080</text><text x="485" y="801" font-size="28" fill="#24241f">谈判未达成最终协议，第二次起义爆发</text><text x="485" y="851" font-size="22" fill="#77766e">圣地、住宅区、主权与回归问题交叠；袭击与镇压升级。</text><circle cx="95" cy="945" r="21" fill="#1b365d"/><text x="83" y="953" font-size="23" fill="#faf9f5">6</text><rect x="145" y="900" width="1195" height="115" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="936" font-size="24" fill="#1b365d">写作时的反思</text><text x="172" y="988" font-size="20" fill="#77766e">PDF 1081—1092</text><text x="485" y="936" font-size="28" fill="#24241f">共享城市，需要具体制度与相互承认</text><text x="485" y="986" font-size="22" fill="#77766e">作者讨论住房、通行、历史记忆及共享的可能条件。</text><circle cx="95" cy="1080" r="21" fill="#1b365d"/><text x="83" y="1088" font-size="23" fill="#faf9f5">7</text><rect x="145" y="1035" width="1195" height="115" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="1071" font-size="24" fill="#1b365d">今晨</text><text x="172" y="1123" font-size="20" fill="#77766e">PDF 1093—1102</text><text x="485" y="1071" font-size="28" fill="#24241f">三处圣地，日常的职责继续</text><text x="485" y="1121" font-size="22" fill="#77766e">祈祷、保管钥匙、开门与宣礼，使城市每天重新开始。</text><text x="60" y="1212" font-size="23" fill="#1b365d">这是一段历史阅读，不把作者的“今天”和政治愿景当作当代状态。</text><text x="60" y="1258" font-size="20" fill="#77766e">来源：后记PDF第1062—1107页及注释。节点间距不按年份比例。</text></svg>