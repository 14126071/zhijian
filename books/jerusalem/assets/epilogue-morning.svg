<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1240" role="img" aria-labelledby="title desc"><title id="title">谁让三处圣地的一天开始？</title><desc id="desc">作者的并行清晨叙事；不是精确时刻表，也不表示所有政治与宗教争端已经解决。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1240" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">后记 / 今晨</text><text x="60" y="120" font-size="42" fill="#24241f">谁让三处圣地的一天开始？</text><text x="60" y="168" font-size="23" fill="#77766e">作者的并行清晨叙事；不是精确时刻表，也不表示所有政治与宗教争端已经解决。</text><rect x="60" y="230" width="590" height="345" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="88" y="277" font-size="31" fill="#1b365d">西墙</text><text x="88" y="326" font-size="28" fill="#24241f">拉比与祈祷群体</text><text x="88" y="387" font-size="23" fill="#77766e">按惯常仪式开始祈祷</text><text x="88" y="430" font-size="23" fill="#77766e">维护场所、清理祈愿纸条</text><text x="88" y="473" font-size="23" fill="#77766e">虔敬也可成为限制激进行动的理由</text><text x="88" y="541" font-size="20" fill="#77766e">PDF 1093—1094</text><rect x="750" y="230" width="590" height="345" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="778" y="277" font-size="31" fill="#1b365d">圣墓大教堂</text><text x="778" y="326" font-size="28" fill="#24241f">两组穆斯林家族的职责</text><text x="778" y="387" font-size="23" fill="#77766e">朱达家族保管钥匙 → 努赛贝家族开门</text><text x="778" y="430" font-size="23" fill="#77766e">教堂内部各基督教派依次举行礼仪</text><text x="778" y="473" font-size="23" fill="#77766e">职责合作与荣誉竞争同时存在</text><text x="778" y="541" font-size="20" fill="#77766e">PDF 1095—1099</text><rect x="60" y="620" width="590" height="345" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="88" y="667" font-size="31" fill="#1b365d">谢里夫圣地／圣殿山</text><text x="88" y="716" font-size="28" fill="#24241f">安萨里与开门团队</text><text x="88" y="777" font-size="23" fill="#77766e">打开岩石圆顶清真寺和阿克萨的门</text><text x="88" y="820" font-size="23" fill="#77766e">工作由个人与团队持续承担</text><text x="88" y="863" font-size="23" fill="#77766e">神圣责任，也是一份需要谋生的职业</text><text x="88" y="931" font-size="20" fill="#77766e">PDF 1099—1101</text><rect x="750" y="620" width="590" height="345" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="778" y="667" font-size="31" fill="#1b365d">阿克萨清真寺</text><text x="778" y="716" font-size="28" fill="#24241f">卡扎兹家族宣礼吏</text><text x="778" y="777" font-size="23" fill="#77766e">准备声音、核对时间与麦克风</text><text x="778" y="820" font-size="23" fill="#77766e">宣礼声传向老城</text><text x="778" y="863" font-size="23" fill="#77766e">家族职责延续，设备与方法发生变化</text><text x="778" y="931" font-size="20" fill="#77766e">PDF 1101—1102</text><rect x="60" y="1050" width="1280" height="80" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="87" y="1101" font-size="26" fill="#1b365d">城市的延续，也依靠钥匙、时间表、清洁、训练，以及每日重复的职责。</text><text x="60" y="1162" font-size="23" fill="#1b365d">三处圣地、四组工作；下方两格发生在同一圣地范围，不能误读成第四处圣地。</text><text x="60" y="1208" font-size="20" fill="#77766e">来源：后记“今晨”PDF第1093—1102页；家族的早期任职起源包含其自身传统。</text></svg>