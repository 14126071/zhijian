<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1230" role="img" aria-labelledby="title desc"><title id="title">“得到圣城”，究竟得到了什么？</title><desc id="desc">把控制、管理、实际生活与历史主张拆开，才能看清每次变化的内容与限度。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1230" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">全书概览 / 跨时代的辨认工具</text><text x="60" y="120" font-size="42" fill="#24241f">“得到圣城”，究竟得到了什么？</text><text x="60" y="168" font-size="23" fill="#77766e">把控制、管理、实际生活与历史主张拆开，才能看清每次变化的内容与限度。</text><rect x="60" y="230" width="1280" height="180" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="86" y="273" font-size="28" fill="#1b365d">01  城市控制</text><text x="86" y="375" font-size="18" fill="#77766e">PDF 360—364</text><text x="500" y="273" font-size="29" fill="#24241f">谁有军队与行政权？</text><text x="500" y="330" font-size="24" fill="#77766e">614年波斯征服，后来更换地方支持对象；</text><text x="500" y="370" font-size="24" fill="#77766e">地方管理改变，不等于帝国已经退出。</text><rect x="60" y="445" width="1280" height="180" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="86" y="488" font-size="28" fill="#1b365d">02  圣地管理</text><text x="86" y="590" font-size="18" fill="#77766e">PDF 577—582、1060</text><text x="500" y="488" font-size="29" fill="#24241f">谁维护、组织和分配使用？</text><text x="500" y="545" font-size="24" fill="#77766e">1229年城市与圣殿山分别安排；</text><text x="500" y="585" font-size="24" fill="#77766e">1967年控制权变化后，宗教管理仍另议。</text><rect x="60" y="660" width="1280" height="180" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="86" y="703" font-size="28" fill="#1b365d">03  进入与居住</text><text x="86" y="805" font-size="18" fill="#77766e">PDF 568—569、1083—1084</text><text x="500" y="703" font-size="29" fill="#24241f">谁实际能够来、能住、能礼拜？</text><text x="500" y="760" font-size="24" fill="#77766e">1192年基督徒取得朝圣通行；</text><text x="500" y="800" font-size="24" fill="#77766e">后记写到许可与隔离影响居民前往圣地。</text><rect x="60" y="875" width="1280" height="180" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="86" y="918" font-size="28" fill="#1b365d">04  记忆与主张</text><text x="86" y="1020" font-size="18" fill="#77766e">PDF 303—306、759—770、1090—1092</text><text x="500" y="918" font-size="29" fill="#24241f">人们怎样解释这里，提出什么要求？</text><text x="500" y="975" font-size="24" fill="#77766e">改名、经典与考古发现都能影响身份；</text><text x="500" y="1015" font-size="24" fill="#77766e">从遗迹到政治要求，仍需要分别论证。</text><text x="60" y="1152" font-size="23" fill="#1b365d">一次胜利或一份承诺，需要逐项问：改变了哪层关系，谁来执行，谁承担代价？</text><text x="60" y="1198" font-size="20" fill="#77766e">来源：图中各时期页段。分层为阅读归纳，并非跨时代通用的法律规则。</text></svg>