<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1340" role="img" aria-labelledby="title desc"><title id="title">1967：从危机升级，到老城易手</title><desc id="desc">按事件与选择组织阅读，不画成一条从古代注定发生的战争道路。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1340" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">第九部分 / 第53章</text><text x="60" y="120" font-size="42" fill="#24241f">1967：从危机升级，到老城易手</text><text x="60" y="168" font-size="23" fill="#77766e">按事件与选择组织阅读，不画成一条从古代注定发生的战争道路。</text><rect x="60" y="223" width="1280" height="163" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="268" font-size="26" fill="#1b365d">危机升级</text><text x="85" y="350" font-size="19" fill="#77766e">PDF 1047—1050</text><text x="400" y="267" font-size="29" fill="#24241f">情报、部署与封锁</text><text x="400" y="314" font-size="23" fill="#77766e">错误的进攻预警；埃及军队进入西奈；联合国部队撤离。</text><text x="400" y="351" font-size="23" fill="#77766e">蒂朗海峡封锁与敌对言辞，使以色列的安全恐惧进一步加深。</text><path d="M700 393V411" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="421" width="1280" height="163" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="466" font-size="26" fill="#1b365d">仍有分歧</text><text x="85" y="548" font-size="19" fill="#77766e">PDF 1048—1052</text><text x="400" y="465" font-size="29" fill="#24241f">外交等待、军事压力与结盟</text><text x="400" y="512" font-size="23" fill="#77766e">以色列政府内部讨论何时行动；约旦侯赛因与埃及结盟。</text><text x="400" y="549" font-size="23" fill="#77766e">各方信息、政治压力与安全计算不一致，结局尚未确定。</text><path d="M700 591V609" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="619" width="1280" height="163" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="664" font-size="26" fill="#1b365d">6月5日</text><text x="85" y="746" font-size="19" fill="#77766e">PDF 1051—1055</text><text x="400" y="663" font-size="29" fill="#24241f">以色列空袭埃及；约旦战线扩大</text><text x="400" y="710" font-size="23" fill="#77766e">约旦接收不实战报，在耶路撒冷参战；以色列还击。</text><text x="400" y="747" font-size="23" fill="#77766e">原先避免扩大约旦战线的考虑，随后转向进攻。</text><path d="M700 789V807" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="817" width="1280" height="163" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="862" font-size="26" fill="#1b365d">6月6—7日</text><text x="85" y="944" font-size="19" fill="#77766e">PDF 1055—1059</text><text x="400" y="861" font-size="29" fill="#24241f">激战、停火压力与老城突入</text><text x="400" y="908" font-size="23" fill="#77766e">以色列领导层仍在争论；随后部队从狮子门等处进入老城。</text><text x="400" y="945" font-size="23" fill="#77766e">到达圣殿山与西墙，成为强烈的历史与宗教情感时刻。</text><path d="M700 987V1005" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="1015" width="1280" height="163" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="1060" font-size="26" fill="#1b365d">取得控制后</text><text x="85" y="1142" font-size="19" fill="#77766e">PDF 1058—1060</text><text x="400" y="1059" font-size="29" fill="#24241f">圣地的管理与礼拜安排另议</text><text x="400" y="1106" font-size="23" fill="#77766e">达扬要求降下清真寺上的国旗，让伊斯兰基金会继续管理。</text><text x="400" y="1143" font-size="23" fill="#77766e">按本章记述：犹太人可以访问，但不得在圣殿山祈祷。</text><text x="60" y="1262" font-size="23" fill="#1b365d">军事控制、宗教管理与政治归属没有自动合并；箭头仅连接叙述阶段。</text><text x="60" y="1308" font-size="20" fill="#77766e">来源：第53章图中页段。图止于本章安排；原书的“至今”不作当代状态说明。</text></svg>