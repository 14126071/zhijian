<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1280" role="img" aria-labelledby="title desc"><title id="title">第七部分：城墙、弥赛亚与家族</title><desc id="desc">七节点阅读地图，按实际叙述取点，非等比例年表；未展开第八部分。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1280" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">第七部分 / 第31—33章</text><text x="60" y="120" font-size="42" fill="#24241f">城墙、弥赛亚与家族</text><text x="60" y="168" font-size="24" fill="#77766e">帝国改变城市，远方赋予意义，地方家族连接职位、资源与圣地。</text><path d="M95 250V1100" stroke="#c4c5b8" stroke-width="3"/><circle cx="95" cy="260" r="22" fill="#1b365d"/><text x="83" y="268" font-size="23" fill="#faf9f5">1</text><rect x="145" y="212" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="248" font-size="24" fill="#1b365d">1516—1517年</text><text x="172" y="294" font-size="17" fill="#77766e">PDF 621—623</text><text x="500" y="248" font-size="28" fill="#24241f">奥斯曼取代马木鲁克</text><text x="500" y="293" font-size="21" fill="#77766e">耶路撒冷进入新的帝国秩序；圣地声望与皇权再次相联。</text><circle cx="95" cy="393" r="22" fill="#1b365d"/><text x="83" y="401" font-size="23" fill="#faf9f5">2</text><rect x="145" y="345" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="381" font-size="24" fill="#1b365d">16世纪前期及中期</text><text x="172" y="427" font-size="17" fill="#77766e">PDF 623—627</text><text x="500" y="381" font-size="28" fill="#24241f">苏莱曼与许蕾姆的工程</text><text x="500" y="426" font-size="21" fill="#77766e">城墙、供水、圣地装饰与慈善设施，需要资金、工匠和官员。</text><circle cx="95" cy="526" r="22" fill="#1b365d"/><text x="83" y="534" font-size="23" fill="#faf9f5">3</text><rect x="145" y="478" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="514" font-size="24" fill="#1b365d">16—17世纪</text><text x="172" y="560" font-size="17" fill="#77766e">PDF 627—637</text><text x="500" y="514" font-size="28" fill="#24241f">移民、外交与教派争夺</text><text x="500" y="559" font-size="21" fill="#77766e">塞法尔迪网络、法国盟友与圣地守护权，改变城内群体处境。</text><circle cx="95" cy="659" r="22" fill="#1b365d"/><text x="83" y="667" font-size="23" fill="#faf9f5">4</text><rect x="145" y="611" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="647" font-size="24" fill="#1b365d">17世纪</text><text x="172" y="693" font-size="17" fill="#77766e">PDF 637—649</text><text x="500" y="647" font-size="28" fill="#24241f">远方的新锡安与救赎期待</text><text x="500" y="692" font-size="21" fill="#77766e">新教、喀巴拉与苏菲派各有实践；沙巴泰并未获得一致认可。</text><circle cx="95" cy="792" r="22" fill="#1b365d"/><text x="83" y="800" font-size="23" fill="#faf9f5">5</text><rect x="145" y="744" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="780" font-size="24" fill="#1b365d">1702—1705年</text><text x="172" y="826" font-size="17" fill="#77766e">PDF 650、655—657</text><text x="500" y="780" font-size="28" fill="#24241f">税收冲突与地方反抗</text><text x="500" y="825" font-size="21" fill="#77766e">法官、驻军与地方领袖结盟又分裂；反抗未带来普遍安全。</text><circle cx="95" cy="925" r="22" fill="#1b365d"/><text x="83" y="933" font-size="23" fill="#faf9f5">6</text><rect x="145" y="877" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="913" font-size="24" fill="#1b365d">18世纪</text><text x="172" y="959" font-size="17" fill="#77766e">PDF 657—662、665—666</text><text x="500" y="913" font-size="28" fill="#24241f">名门家族与外部保护者</text><text x="500" y="958" font-size="21" fill="#77766e">财富、学识、职位和庇护维持地方权势，教派竞争跨越国界。</text><circle cx="95" cy="1058" r="22" fill="#1b365d"/><text x="83" y="1066" font-size="23" fill="#faf9f5">7</text><rect x="145" y="1010" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="1046" font-size="24" fill="#1b365d">1798—1799年</text><text x="172" y="1092" font-size="17" fill="#77766e">PDF 663—664</text><text x="500" y="1046" font-size="28" fill="#24241f">拿破仑的远征与逼近</text><text x="500" y="1091" font-size="21" fill="#77766e">法国征服埃及后北上；对圣城的雄心不等于已经占领。</text><text x="60" y="1205" font-size="22" fill="#1b365d">非等比例年表；章题之外仍有回溯与前望。图中年代用于定位，不代表严格的章界。</text><text x="60" y="1245" font-size="20" fill="#77766e">来源：第七部分 PDF第619—667页。未扩读第八部分。</text></svg>