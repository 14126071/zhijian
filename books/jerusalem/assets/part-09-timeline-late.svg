<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1180" role="img" aria-labelledby="title desc"><title id="title">家园、国家与分隔之城</title><desc id="desc">后六章：国家与安全诉求进入战争，同一场胜利包含不同居民的失去。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1180" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">第九部分 / 第48—53章</text><text x="60" y="120" font-size="42" fill="#24241f">家园、国家与分隔之城</text><text x="60" y="168" font-size="23" fill="#77766e">后六章：国家与安全诉求进入战争，同一场胜利包含不同居民的失去。</text><path d="M95 260V1030" stroke="#c4c5b8" stroke-width="3"/><circle cx="95" cy="269" r="22" fill="#1b365d"/><text x="82" y="277" font-size="22" fill="#faf9f5">48</text><rect x="145" y="220" width="1195" height="121" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="174" y="256" font-size="25" fill="#1b365d">1920—1936年</text><text x="174" y="308" font-size="20" fill="#77766e">PDF 931—957</text><text x="468" y="258" font-size="29" fill="#24241f">英国托管与圣地争端</text><text x="468" y="309" font-size="22" fill="#77766e">地方职位、移民、街头暴力；现代生活仍在继续。</text><circle cx="95" cy="409" r="22" fill="#1b365d"/><text x="82" y="417" font-size="22" fill="#faf9f5">49</text><rect x="145" y="360" width="1195" height="121" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="174" y="396" font-size="25" fill="#1b365d">1936—1945年</text><text x="174" y="448" font-size="20" fill="#77766e">PDF 958—982</text><text x="468" y="398" font-size="29" fill="#24241f">起义、镇压与世界大战</text><text x="468" y="449" font-size="22" fill="#77766e">组织力量受损；移民限制与纳粹大屠杀使危机加深。</text><circle cx="95" cy="549" r="22" fill="#1b365d"/><text x="82" y="557" font-size="22" fill="#faf9f5">50</text><rect x="145" y="500" width="1195" height="121" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="174" y="536" font-size="25" fill="#1b365d">1945—1947年</text><text x="174" y="588" font-size="20" fill="#77766e">PDF 983—1012</text><text x="468" y="538" font-size="29" fill="#24241f">战后反英行动与秩序崩解</text><text x="468" y="589" font-size="22" fill="#77766e">组织合作又分裂；正文已写到1948年春的居民离散。</text><circle cx="95" cy="689" r="22" fill="#1b365d"/><text x="82" y="697" font-size="22" fill="#faf9f5">51</text><rect x="145" y="640" width="1195" height="121" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="174" y="676" font-size="25" fill="#1b365d">1948—1951年</text><text x="174" y="728" font-size="20" fill="#77766e">PDF 1013—1028</text><text x="468" y="678" font-size="29" fill="#24241f">建国、战争与失去家园</text><text x="468" y="729" font-size="22" fill="#77766e">周边国家参战；老城犹太区撤离，停战带来分隔。</text><circle cx="95" cy="829" r="22" fill="#1b365d"/><text x="82" y="837" font-size="22" fill="#faf9f5">52</text><rect x="145" y="780" width="1195" height="121" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="174" y="816" font-size="25" fill="#1b365d">1951—1967年</text><text x="174" y="868" font-size="20" fill="#77766e">PDF 1029—1042</text><text x="468" y="818" font-size="29" fill="#24241f">同一座城，两侧日常</text><text x="468" y="869" font-size="22" fill="#77766e">铁丝网、检查点、圣地限制；王位与地区政治变化。</text><circle cx="95" cy="969" r="22" fill="#1b365d"/><text x="82" y="977" font-size="22" fill="#faf9f5">53</text><rect x="145" y="920" width="1195" height="121" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="174" y="956" font-size="25" fill="#1b365d">1967年</text><text x="174" y="1008" font-size="20" fill="#77766e">PDF 1043—1061</text><text x="468" y="958" font-size="29" fill="#24241f">六日战争与老城易手</text><text x="468" y="1009" font-size="22" fill="#77766e">军事控制改变，圣地管理与礼拜规则另行安排。</text><text x="60" y="1102" font-size="23" fill="#1b365d">按章序整理，非等比例年表；章题年代之外另有回溯与前望。</text><text x="60" y="1148" font-size="20" fill="#77766e">来源：第48—53章题辞、正文及注释；图中页段为PDF物理页码。</text></svg>