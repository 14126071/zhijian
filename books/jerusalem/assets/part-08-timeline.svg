<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1420" role="img" aria-labelledby="title desc"><title id="title">第八部分：保护、考古与城墙之外</title><desc id="desc">八章阅读地图，章题年代仅作定位，实际正文另有回溯与前望，时间间距不按比例。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1420" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">第八部分 / 第34—41章</text><text x="60" y="120" font-size="42" fill="#24241f">保护、考古与城墙之外</text><text x="60" y="168" font-size="23" fill="#77766e">影响圣城的手段增加：军队之外，还有领事、救济、买地、建筑与历史解释。</text><path d="M95 250V1240" stroke="#c4c5b8" stroke-width="3"/><circle cx="95" cy="260" r="22" fill="#1b365d"/><text x="83" y="268" font-size="23" fill="#faf9f5">1</text><rect x="145" y="212" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="243" font-size="22" fill="#1b365d">第34章</text><text x="172" y="276" font-size="23" fill="#24241f">1799—1806年</text><text x="172" y="307" font-size="18" fill="#77766e">PDF 670—679</text><text x="500" y="248" font-size="28" fill="#24241f">阿克受阻，圣城未被法军占领</text><text x="500" y="293" font-size="21" fill="#77766e">贾扎尔与英国海军合作；宣言的落款不等于实际驻地。</text><circle cx="95" cy="393" r="22" fill="#1b365d"/><text x="83" y="401" font-size="23" fill="#faf9f5">2</text><rect x="145" y="345" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="376" font-size="22" fill="#1b365d">第35章</text><text x="172" y="409" font-size="23" fill="#24241f">1806—1830年</text><text x="172" y="440" font-size="18" fill="#77766e">PDF 680—696</text><text x="500" y="381" font-size="28" fill="#24241f">浪漫旅行与长期援助</text><text x="500" y="426" font-size="21" fill="#77766e">夏多布里昂的东方想象，蒙蒂菲奥里与迪斯累利的不同道路。</text><circle cx="95" cy="526" r="22" fill="#1b365d"/><text x="83" y="534" font-size="23" fill="#faf9f5">3</text><rect x="145" y="478" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="509" font-size="22" fill="#1b365d">第36章</text><text x="172" y="542" font-size="23" fill="#24241f">1830—1840年</text><text x="172" y="573" font-size="18" fill="#77766e">PDF 697—707</text><text x="500" y="514" font-size="28" fill="#24241f">埃及统治：改革与强制并存</text><text x="500" y="559" font-size="21" fill="#77766e">待遇改善、征兵、农民反抗与镇压，欧洲领事开始进入。</text><circle cx="95" cy="659" r="22" fill="#1b365d"/><text x="83" y="667" font-size="23" fill="#faf9f5">4</text><rect x="145" y="611" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="642" font-size="22" fill="#1b365d">第37章</text><text x="172" y="675" font-size="23" fill="#24241f">1840—1855年</text><text x="172" y="706" font-size="18" fill="#77766e">PDF 708—747</text><text x="500" y="647" font-size="28" fill="#24241f">保护、传教与列强竞争</text><text x="500" y="692" font-size="21" fill="#77766e">圣地争端进入战争；正文又延伸到1856年战后变化。</text><circle cx="95" cy="792" r="22" fill="#1b365d"/><text x="83" y="800" font-size="23" fill="#faf9f5">5</text><rect x="145" y="744" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="775" font-size="22" fill="#1b365d">第38章</text><text x="172" y="808" font-size="23" fill="#24241f">1855—1860年</text><text x="172" y="839" font-size="18" fill="#77766e">PDF 748—757</text><text x="500" y="780" font-size="28" fill="#24241f">救助开始改变城外空间</text><text x="500" y="825" font-size="21" fill="#77766e">买地、磨坊和住房；筹划、建成与持续经营须分别考察。</text><circle cx="95" cy="925" r="22" fill="#1b365d"/><text x="83" y="933" font-size="23" fill="#faf9f5">6</text><rect x="145" y="877" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="908" font-size="22" fill="#1b365d">第39章</text><text x="172" y="941" font-size="23" fill="#24241f">1860—1870年</text><text x="172" y="972" font-size="18" fill="#77766e">PDF 758—771</text><text x="500" y="913" font-size="28" fill="#24241f">考古成为新的权威来源</text><text x="500" y="958" font-size="21" fill="#77766e">测绘与发掘带来发现，也与宗教验证、国家声望相联。</text><circle cx="95" cy="1058" r="22" fill="#1b365d"/><text x="83" y="1066" font-size="23" fill="#faf9f5">7</text><rect x="145" y="1010" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="1041" font-size="22" fill="#1b365d">第40章</text><text x="172" y="1074" font-size="23" fill="#24241f">1870—1880年</text><text x="172" y="1105" font-size="18" fill="#77766e">PDF 772—789</text><text x="500" y="1046" font-size="28" fill="#24241f">居民城市与多方建设</text><text x="500" y="1091" font-size="21" fill="#77766e">语言、节日、市政、旅游和新街区；叙述并不限于章题。</text><circle cx="95" cy="1191" r="22" fill="#1b365d"/><text x="83" y="1199" font-size="23" fill="#faf9f5">8</text><rect x="145" y="1143" width="1195" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="1174" font-size="22" fill="#1b365d">第41章</text><text x="172" y="1207" font-size="23" fill="#24241f">1880—1898年</text><text x="172" y="1238" font-size="18" fill="#77766e">PDF 790—797</text><text x="500" y="1179" font-size="28" fill="#24241f">俄国朝圣者与犹太移民</text><text x="500" y="1224" font-size="21" fill="#77766e">帝国的宗教资助与反犹迫害，推动两类不同的人群流动。</text><text x="60" y="1320" font-size="23" fill="#1b365d">左列为章题年代，非严格叙述边界；本图按章序，不按年份比例。</text><text x="60" y="1364" font-size="20" fill="#77766e">来源：第八部分 PDF第668—797页。未扩读第九部分。</text></svg>