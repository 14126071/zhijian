<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1180" role="img" aria-labelledby="title desc"><title id="title">马木鲁克时代圣城的三层权力</title><desc id="desc">城市统治、具体圣地的管理使用，以及居民和朝圣者的进入条件并不相同。所有例子都有时间和社群边界。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1180" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">第六部分 / 先分清三层问题</text><text x="60" y="120" font-size="42" fill="#24241f">谁统治？谁使用？谁能进入？</text><text x="60" y="168" font-size="23" fill="#77766e">同属一种宗教，不等于拥有相同权利；同一苏丹也可能区别对待不同社群。</text><rect x="60" y="220" width="1280" height="205" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="263" font-size="27" fill="#1b365d">01 城市统治</text><text x="85" y="308" font-size="24" fill="#24241f">苏丹与总督</text><text x="85" y="385" font-size="17" fill="#77766e">PDF 602、608—609、613—615</text><text x="480" y="263" font-size="28" fill="#1b365d">军事、税费、准许或禁止的权力</text><text x="480" y="320" font-size="23" fill="#24241f">可以支持修缮，也能关闭圣地、改变用途和限制进入。</text><text x="480" y="367" font-size="23" fill="#24241f">1405年居民因苛征驱逐总督，显示统治也会受到抵抗。</text><path d="M700 432V457" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="465" width="1280" height="205" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="508" font-size="27" fill="#1b365d">02 圣地管理与使用</text><text x="85" y="553" font-size="24" fill="#24241f">具体教派和机构</text><text x="85" y="630" font-size="17" fill="#77766e">PDF 602、610、612—613</text><text x="480" y="508" font-size="28" fill="#1b365d">祭坛、教堂、修道院等具体空间</text><text x="480" y="565" font-size="23" fill="#24241f">格鲁吉亚人与亚美尼亚人争夺各各他，拉丁人争取支持。</text><text x="480" y="612" font-size="23" fill="#24241f">教派取得某处使用地位，不等于获得全城主权。</text><path d="M700 677V702" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="710" width="1280" height="205" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="753" font-size="27" fill="#1b365d">03 进入与生活</text><text x="85" y="798" font-size="24" fill="#24241f">居民及朝圣者</text><text x="85" y="875" font-size="17" fill="#77766e">PDF 609—615、617</text><text x="480" y="753" font-size="28" fill="#1b365d">通行、礼拜、居住与修复的条件</text><text x="480" y="810" font-size="23" fill="#24241f">缴费或获准到访，不等于免于勒索、歧视和暴力。</text><text x="480" y="857" font-size="23" fill="#24241f">同一政策可能改善一群人的处境，却限制另一群人。</text><rect x="60" y="995" width="1280" height="95" rx="5" fill="#e8e6dc"/><text x="85" y="1034" font-size="27" fill="#1b365d">每次具体追问：哪位统治者、哪个时期、哪一社群、哪一地点？</text><text x="85" y="1071" font-size="22" fill="#24241f">箭头表示统治安排会影响后两层，不表示管理与进入权永远固定。</text><text x="60" y="1135" font-size="20" fill="#77766e">来源：图中所列页段。三层区分为阅读归纳，非完整法律制度表。</text></svg>