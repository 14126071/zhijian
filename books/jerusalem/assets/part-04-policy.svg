<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1150" role="img" aria-labelledby="title desc"><title id="title">社群处境随统治安排改变</title><desc id="desc">用六个例子比较保护、限制、迫害和修复，不把整个时期视为永久宽容或永久迫害。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1150" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">第四部分 / 把居民处境放回政治变化中</text><text x="60" y="120" font-size="42" fill="#24241f">社群处境，随统治安排而变化</text><text x="60" y="167" font-size="23" fill="#77766e">选取本书中的六个政策节点，不是给各王朝打分，也不代表所有人的经验都相同。</text><rect x="60" y="212" width="1280" height="112" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="249" font-size="26" fill="#1b365d">欧麦尔接收城市</text><text x="85" y="294" font-size="19" fill="#77766e">PDF 385—394</text><text x="475" y="249" font-size="29" fill="#24241f">保护与从属并存</text><text x="475" y="294" font-size="22" fill="#77766e">基督徒获信仰保障并缴人头税，犹太人获得回城的空间。</text><rect x="60" y="344" width="1280" height="112" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="381" font-size="26" fill="#1b365d">穆阿维叶时期</text><text x="85" y="426" font-size="19" fill="#77766e">PDF 397—398</text><text x="475" y="381" font-size="29" fill="#24241f">合作、官吏与政治联盟</text><text x="475" y="426" font-size="22" fill="#77766e">作者描写跨社群合作；圣地与效忠仪式服务于帝国统治。</text><rect x="60" y="476" width="1280" height="112" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="513" font-size="26" fill="#1b365d">约720年</text><text x="85" y="558" font-size="19" fill="#77766e">PDF 411—412</text><text x="475" y="513" font-size="29" fill="#24241f">圣殿山祈祷限制</text><text x="475" y="558" font-size="22" fill="#77766e">欧麦尔二世改变安排；犹太人转向墙外与洞穴会堂礼拜。</text><rect x="60" y="608" width="1280" height="112" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="645" font-size="26" fill="#1b365d">法蒂玛早期</text><text x="85" y="690" font-size="19" fill="#77766e">PDF 429—432</text><text x="475" y="645" font-size="29" fill="#24241f">资助增加，贫穷仍在</text><text x="475" y="690" font-size="22" fill="#77766e">开罗廷臣争取津贴与礼拜机会，远方捐助支撑圣城社群。</text><rect x="60" y="740" width="1280" height="112" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="777" font-size="26" fill="#1b365d">哈基姆，1009年</text><text x="85" y="822" font-size="19" fill="#77766e">PDF 435—439</text><text x="475" y="777" font-size="29" fill="#24241f">迫害与毁堂</text><text x="475" y="822" font-size="22" fill="#77766e">圣墓教堂被拆毁，会堂受到破坏；其政策后来又有反复。</text><rect x="60" y="872" width="1280" height="112" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="909" font-size="26" fill="#1b365d">其后的修复与重建</text><text x="85" y="954" font-size="19" fill="#77766e">PDF 439—440</text><text x="475" y="909" font-size="29" fill="#24241f">政策转向与跨境资助</text><text x="475" y="954" font-size="22" fill="#77766e">查希尔修复圣地；拜占庭资助圣墓教堂于1048年重建。</text><text x="60" y="1067" font-size="23" fill="#1b365d">宫廷任用一个社群成员，不等于所有人平等安全；中央许可也不自动阻止地方暴力。</text><text x="60" y="1110" font-size="20" fill="#77766e">来源：PDF第385—440页所列段落。此图是阅读归纳，保护、限制与生活延续可能同时存在。</text></svg>