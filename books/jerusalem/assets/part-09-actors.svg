<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1350" role="img" aria-labelledby="title desc"><title id="title">名字相近，政治目标却可能相冲突</title><desc id="desc">上方分清两组家族；下方分清犹太政治路线与武装组织。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1350" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">第九部分 / 人物与组织辨认</text><text x="60" y="120" font-size="42" fill="#24241f">名字相近，政治目标却可能相冲突</text><text x="60" y="168" font-size="23" fill="#77766e">上方分清两组家族；下方分清犹太政治路线与武装组织。</text><rect x="60" y="225" width="590" height="490" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="87" y="271" font-size="27" fill="#1b365d">哈希姆家族：从麦加到王国</text><rect x="750" y="225" width="590" height="490" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="777" y="271" font-size="27" fill="#1b365d">侯赛尼家族：耶路撒冷地方政治</text><text x="90" y="333" font-size="30" fill="#24241f">麦加的谢里夫侯赛因</text><text x="90" y="377" font-size="24" fill="#77766e">阿拉伯起义、独立与王国目标</text><path d="M150 398V445H560M150 445V466M560 445V466" fill="none" stroke="#a4a99e" stroke-width="2"/><text x="100" y="508" font-size="28" fill="#1b365d">费萨尔</text><text x="450" y="508" font-size="28" fill="#1b365d">阿卜杜拉</text><text x="100" y="550" font-size="22" fill="#77766e">叙利亚 → 伊拉克</text><text x="450" y="550" font-size="22" fill="#77766e">外约旦</text><text x="90" y="617" font-size="27" fill="#24241f">后来的约旦国王侯赛因</text><text x="90" y="661" font-size="23" fill="#77766e">阿卜杜拉的孙辈；不同于麦加侯赛因</text><text x="780" y="333" font-size="30" fill="#24241f">阿明·侯赛尼</text><text x="780" y="377" font-size="24" fill="#77766e">穆夫提：宗教职位与政治动员</text><text x="780" y="453" font-size="27" fill="#24241f">阿卜杜勒·卡迪尔·侯赛尼</text><text x="780" y="497" font-size="23" fill="#77766e">1948年军事领袖，战死于卡斯特尔</text><text x="780" y="583" font-size="25" fill="#1b365d">本地家族内部，也不只有一种行动</text><text x="780" y="636" font-size="23" fill="#77766e">纳沙希比是另一组地方家族力量</text><text x="60" y="766" font-size="25" fill="#1b365d">这些人不属于同一条指挥链，也不能共同代表所有阿拉伯人的目标。</text><rect x="60" y="815" width="400" height="215" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="864" font-size="26" fill="#1b365d">魏茨曼</text><text x="85" y="923" font-size="24" fill="#77766e">争取外交支持</text><text x="85" y="963" font-size="24" fill="#77766e">重视大国谈判</text><rect x="500" y="815" width="400" height="215" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="525" y="864" font-size="26" fill="#1b365d">本·古里安／哈加纳</text><text x="525" y="923" font-size="24" fill="#77766e">建设组织与武装</text><text x="525" y="963" font-size="24" fill="#77766e">走向国家权力整合</text><rect x="940" y="815" width="400" height="215" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="965" y="864" font-size="26" fill="#1b365d">雅博廷斯基／贝京</text><text x="965" y="923" font-size="24" fill="#77766e">修正主义路线</text><text x="965" y="963" font-size="24" fill="#77766e">伊尔贡；莱希另有分裂史</text><rect x="60" y="1070" width="1280" height="116" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="87" y="1112" font-size="26" fill="#1b365d">组织关系随时间改变：曾互相追捕 → 战后出现合作 → 再度冲突与国家整合</text><text x="87" y="1156" font-size="23" fill="#24241f">路线概括不等于个人永远不变；不能把某组织的暴行归于整个民族。</text><text x="60" y="1272" font-size="23" fill="#1b365d">上方连线仅示父子关系；孙辈另标。下方是路线概括，不是组织隶属树。</text><text x="60" y="1318" font-size="20" fill="#77766e">来源：PDF 862—867、922、928—939、983—992、998—1005、1031—1034。</text></svg>