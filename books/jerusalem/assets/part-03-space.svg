<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1110" role="img" aria-labelledby="title desc"><title id="title">基督教圣城如何被重新塑造</title><desc id="desc">地点传统、皇帝和贵族的支持、建筑与仪式、朝圣生活相互连接；下方保留排斥与冲突这条线索。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1110" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">第三部分 / 圣城再造的机制</text><text x="60" y="120" font-size="42" fill="#24241f">一段地点记忆，怎样改变一座城？</text><text x="60" y="168" font-size="23" fill="#77766e">这是根据本书整理的理解路径，不是精确地图或必然发生的历史公式。</text><rect x="60" y="215" width="1280" height="130" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="254" font-size="26" fill="#1b365d">01  地点传统</text><text x="85" y="309" font-size="19" fill="#77766e">PDF 326—330</text><text x="430" y="255" font-size="29" fill="#24241f">受难、埋葬与复活的地点记忆</text><text x="430" y="309" font-size="22" fill="#77766e">本地信徒保存传统，皇帝与主教选择、辨认并赋予权威。</text><path d="M700 345V371" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="380" width="1280" height="130" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="419" font-size="26" fill="#1b365d">02  资源与建筑</text><text x="85" y="474" font-size="19" fill="#77766e">PDF 329—331、338—339</text><text x="430" y="420" font-size="29" fill="#24241f">皇室和贵族提供资金、组织与建筑</text><text x="430" y="474" font-size="22" fill="#77766e">圣墓教堂、其他教堂、修道院与收容设施，让记忆可以进入和行走。</text><path d="M700 510V536" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="545" width="1280" height="130" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="584" font-size="26" fill="#1b365d">03  仪式与路线</text><text x="85" y="639" font-size="19" fill="#77766e">PDF 339—340、351—352</text><text x="430" y="585" font-size="29" fill="#24241f">圣物、节日和礼拜组织朝圣体验</text><text x="430" y="639" font-size="22" fill="#77766e">圣城成为可反复到访的空间，新的神圣中心与城市路线逐渐形成。</text><path d="M700 675V701" stroke="#1b365d" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="710" width="1280" height="130" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="749" font-size="26" fill="#1b365d">04  城市生活</text><text x="85" y="804" font-size="19" fill="#77766e">PDF 357—359</text><text x="430" y="750" font-size="29" fill="#24241f">朝圣者、商铺、住宿与地方声望</text><text x="430" y="804" font-size="22" fill="#77766e">人群与资源汇聚；查士丁尼时代呈现更丰富的城市景观。</text><rect x="60" y="905" width="1280" height="115" rx="5" fill="#e8e6dc"/><text x="85" y="945" font-size="28" fill="#1b365d">同时追问：谁被排斥在新的圣城生活之外？</text><text x="85" y="988" font-size="23" fill="#24241f">圣殿山的荒芜、犹太人的进入限制、教派冲突与武装僧侣，是同一时期的另一面。</text><text x="60" y="1073" font-size="20" fill="#77766e">来源：PDF第330—332、339—345、351—352、357—359页。圣物传统不等于已证实的考古事实。</text></svg>