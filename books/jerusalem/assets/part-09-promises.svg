<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1190" role="img" aria-labelledby="title desc"><title id="title">三组战时安排，三种不同对象</title><desc id="desc">逐项看对象、内容与留下的问题；不把承诺直接画成已经实施的国界。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1190" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">第九部分 / 第45章</text><text x="60" y="120" font-size="42" fill="#24241f">三组战时安排，三种不同对象</text><text x="60" y="168" font-size="23" fill="#77766e">逐项看对象、内容与留下的问题；不把承诺直接画成已经实施的国界。</text><rect x="60" y="230" width="1280" height="216" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="270" font-size="24" fill="#1b365d">1915—1916年</text><text x="85" y="317" font-size="27" fill="#24241f">侯赛因—麦克马洪通信</text><text x="85" y="366" font-size="22" fill="#24241f">英国 ↔ 麦加侯赛因</text><text x="85" y="414" font-size="16" fill="#77766e">PDF 866—869</text><text x="530" y="269" font-size="24" fill="#1b365d">讨论或承诺</text><text x="530" y="323" font-size="24" fill="#77766e">以反奥斯曼合作为背景</text><text x="530" y="363" font-size="24" fill="#77766e">讨论阿拉伯独立及地域范围</text><text x="963" y="269" font-size="24" fill="#1b365d">仍未解决</text><text x="963" y="323" font-size="22" fill="#77766e">排除地域的措辞存在歧义</text><text x="963" y="363" font-size="22" fill="#77766e">巴勒斯坦的归属留下争论</text><path d="M500 255V418M935 255V418" stroke="#ddddd0"/><rect x="60" y="480" width="1280" height="216" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="520" font-size="24" fill="#1b365d">1916年</text><text x="85" y="567" font-size="27" fill="#24241f">赛克斯—皮科协定</text><text x="85" y="616" font-size="22" fill="#24241f">英国 ↔ 法国</text><text x="85" y="664" font-size="16" fill="#77766e">PDF 869</text><text x="530" y="519" font-size="24" fill="#1b365d">讨论或承诺</text><text x="530" y="573" font-size="24" fill="#77766e">划分战后势力范围</text><text x="530" y="613" font-size="24" fill="#77766e">设想圣城一带国际化</text><text x="963" y="519" font-size="24" fill="#1b365d">仍未解决</text><text x="963" y="573" font-size="22" fill="#77766e">列强的战时安排</text><text x="963" y="613" font-size="22" fill="#77766e">尚非当地已经实施的制度</text><path d="M500 505V668M935 505V668" stroke="#ddddd0"/><rect x="60" y="730" width="1280" height="216" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="770" font-size="24" fill="#1b365d">1917年11月2日</text><text x="85" y="817" font-size="27" fill="#24241f">贝尔福宣言</text><text x="85" y="866" font-size="22" fill="#24241f">英国 → 罗斯柴尔德</text><text x="85" y="914" font-size="16" fill="#77766e">PDF 882—888；外部措辞核对</text><text x="530" y="769" font-size="24" fill="#1b365d">讨论或承诺</text><text x="530" y="823" font-size="24" fill="#77766e">支持在巴勒斯坦建立</text><text x="530" y="863" font-size="24" fill="#77766e">犹太民族家园</text><text x="963" y="769" font-size="24" fill="#1b365d">仍未解决</text><text x="963" y="823" font-size="22" fill="#77766e">同时载有权利保障条件</text><text x="963" y="863" font-size="22" fill="#77766e">没有明确分配耶路撒冷</text><path d="M500 755V918M935 755V918" stroke="#ddddd0"/><text x="85" y="1028" font-size="27" fill="#1b365d">民族家园  ≠  已经建立的国家；国际化设想  ≠  已经实行的城市管理。</text><text x="60" y="1090" font-size="20" fill="#77766e">正文来源：第45章。宣言原文措辞及日期另与英国议会记录核对，链接见笔记。</text><text x="60" y="1140" font-size="21" fill="#77766e">三项不是同一种文件；本图是概念辨认，不是国际法效力的逐项鉴定。</text></svg>