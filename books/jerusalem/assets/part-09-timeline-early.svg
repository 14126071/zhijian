<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1180" role="img" aria-labelledby="title desc"><title id="title">家园、国家与分隔之城</title><desc id="desc">前六章：宗教归返与政治运动的不同，最终进入帝国的战后谈判。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1180" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">第九部分 / 第42—47章</text><text x="60" y="120" font-size="42" fill="#24241f">家园、国家与分隔之城</text><text x="60" y="168" font-size="23" fill="#77766e">前六章：宗教归返与政治运动的不同，最终进入帝国的战后谈判。</text><path d="M95 260V1030" stroke="#c4c5b8" stroke-width="3"/><circle cx="95" cy="269" r="22" fill="#1b365d"/><text x="82" y="277" font-size="22" fill="#faf9f5">42</text><rect x="145" y="220" width="1195" height="121" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="174" y="256" font-size="25" fill="#1b365d">1898—1905年</text><text x="174" y="308" font-size="20" fill="#77766e">PDF 800—819</text><text x="468" y="258" font-size="29" fill="#24241f">赫茨尔与帝国支持</text><text x="468" y="309" font-size="22" fill="#77766e">政治组织、外交奔走；当地居民对家园计划提出异议。</text><circle cx="95" cy="409" r="22" fill="#1b365d"/><text x="82" y="417" font-size="22" fill="#faf9f5">43</text><rect x="145" y="360" width="1195" height="121" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="174" y="396" font-size="25" fill="#1b365d">1905—1914年</text><text x="174" y="448" font-size="20" fill="#77766e">PDF 820—845</text><text x="468" y="398" font-size="29" fill="#24241f">青年行动与居民日记</text><text x="468" y="449" font-size="22" fill="#77766e">劳动、音乐与跨社群交往；秘密挖掘激发圣地恐慌。</text><circle cx="95" cy="549" r="22" fill="#1b365d"/><text x="82" y="557" font-size="22" fill="#faf9f5">44</text><rect x="145" y="500" width="1195" height="121" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="174" y="536" font-size="25" fill="#1b365d">1914—1916年</text><text x="174" y="588" font-size="20" fill="#77766e">PDF 846—861</text><text x="468" y="538" font-size="29" fill="#24241f">世界大战下的生存危机</text><text x="468" y="589" font-size="22" fill="#77766e">军管、镇压、驱逐、征发、饥荒和疾病改变城市。</text><circle cx="95" cy="689" r="22" fill="#1b365d"/><text x="82" y="697" font-size="22" fill="#faf9f5">45</text><rect x="145" y="640" width="1195" height="121" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="174" y="676" font-size="25" fill="#1b365d">1916—1917年</text><text x="174" y="728" font-size="20" fill="#77766e">PDF 862—891</text><text x="468" y="678" font-size="29" fill="#24241f">起义与多组战时安排</text><text x="468" y="729" font-size="22" fill="#77766e">阿拉伯独立、英法势力范围、犹太民族家园彼此交叠。</text><circle cx="95" cy="829" r="22" fill="#1b365d"/><text x="82" y="837" font-size="22" fill="#faf9f5">46</text><rect x="145" y="780" width="1195" height="121" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="174" y="816" font-size="25" fill="#1b365d">1917—1919年</text><text x="174" y="868" font-size="20" fill="#77766e">PDF 892—914</text><text x="468" y="818" font-size="29" fill="#24241f">英军接管，期待分歧延续</text><text x="468" y="869" font-size="22" fill="#77766e">12月奥斯曼撤离；治理、救济和政治合作仍待落实。</text><circle cx="95" cy="969" r="22" fill="#1b365d"/><text x="82" y="977" font-size="22" fill="#faf9f5">47</text><rect x="145" y="920" width="1195" height="121" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="174" y="956" font-size="25" fill="#1b365d">1919—1920年</text><text x="174" y="1008" font-size="20" fill="#77766e">PDF 915—930</text><text x="468" y="958" font-size="29" fill="#24241f">战后谈判进入地方政治</text><text x="468" y="1009" font-size="22" fill="#77766e">会议、暴力与行政任命；正文又延伸至1921年安排。</text><text x="60" y="1102" font-size="23" fill="#1b365d">按章序整理，非等比例年表；章题年代之外另有回溯与前望。</text><text x="60" y="1148" font-size="20" fill="#77766e">来源：第42—47章题辞、正文及注释；图中页段为PDF物理页码。</text></svg>