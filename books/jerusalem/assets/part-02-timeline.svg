<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1160" role="img" aria-labelledby="title"><title id="title">第二部分：城市被改造，记忆仍在延续</title><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style></defs><rect width="1400" height="1160" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">第二部分 / 第14章 · 埃利亚·卡皮托利纳</text><text x="60" y="120" font-size="42" fill="#24241f">城市被改造，记忆仍在延续</text><text x="60" y="167" font-size="23" fill="#77766e">公元70—312年为章题范围；本章结尾预告下一个转折。</text><path d="M95 245V990" stroke="#c4c5b8" stroke-width="3"/><circle cx="95" cy="260" r="22" fill="#1b365d"/><text x="83" y="268" font-size="23" fill="#faf9f5">1</text><rect x="145" y="212" width="1195" height="119" rx="5" fill="#faf9f5" stroke="#ddddd0"/><text x="172" y="249" font-size="24" fill="#1b365d">70年之后</text><text x="172" y="294" font-size="19" fill="#77766e">PDF 295—296</text><text x="482" y="250" font-size="29" fill="#24241f">胜利被带到罗马</text><text x="482" y="296" font-size="22" fill="#77766e">凯旋、战利品与犹太税，把征服写入帝国秩序。</text><circle cx="95" cy="399" r="22" fill="#1b365d"/><text x="83" y="407" font-size="23" fill="#faf9f5">2</text><rect x="145" y="351" width="1195" height="119" rx="5" fill="#faf9f5" stroke="#ddddd0"/><text x="172" y="388" font-size="24" fill="#1b365d">73年</text><text x="172" y="433" font-size="19" fill="#77766e">PDF 296—298</text><text x="482" y="389" font-size="29" fill="#24241f">马萨达抵抗结束</text><text x="482" y="435" font-size="22" fill="#77766e">灾难没有消灭所有社群；许多人继续在本地和远方生活。</text><circle cx="95" cy="538" r="22" fill="#1b365d"/><text x="83" y="546" font-size="23" fill="#faf9f5">3</text><rect x="145" y="490" width="1195" height="119" rx="5" fill="#faf9f5" stroke="#ddddd0"/><text x="172" y="527" font-size="24" fill="#1b365d">130年起</text><text x="172" y="572" font-size="19" fill="#77766e">PDF 303—306</text><text x="482" y="528" font-size="29" fill="#24241f">哈德良的城市方案</text><text x="482" y="574" font-size="22" fill="#77766e">改名埃利亚、规划广场与神庙，压制共同体实践。</text><circle cx="95" cy="677" r="22" fill="#1b365d"/><text x="83" y="685" font-size="23" fill="#faf9f5">4</text><rect x="145" y="629" width="1195" height="119" rx="5" fill="#faf9f5" stroke="#ddddd0"/><text x="172" y="666" font-size="24" fill="#1b365d">科赫巴起义及失败</text><text x="172" y="711" font-size="19" fill="#77766e">PDF 306—311</text><text x="482" y="667" font-size="29" fill="#24241f">救赎期待与残酷镇压</text><text x="482" y="713" font-size="22" fill="#77766e">起义者能否控制耶路撒冷？本书保留未知；禁入政策加重。</text><circle cx="95" cy="816" r="22" fill="#1b365d"/><text x="83" y="824" font-size="23" fill="#faf9f5">5</text><rect x="145" y="768" width="1195" height="119" rx="5" fill="#faf9f5" stroke="#ddddd0"/><text x="172" y="805" font-size="24" fill="#1b365d">此后至3世纪</text><text x="172" y="850" font-size="19" fill="#77766e">PDF 312—315</text><text x="482" y="806" font-size="29" fill="#24241f">记忆与生活继续</text><text x="482" y="852" font-size="22" fill="#77766e">律法、祈祷与圣地传统延续；罗马城市规模缩小。</text><circle cx="95" cy="955" r="22" fill="#1b365d"/><text x="83" y="963" font-size="23" fill="#faf9f5">6</text><rect x="145" y="907" width="1195" height="119" rx="5" fill="#faf9f5" stroke="#ddddd0"/><text x="172" y="944" font-size="24" fill="#1b365d">306年及转折预告</text><text x="172" y="989" font-size="19" fill="#77766e">PDF 315—316</text><text x="482" y="945" font-size="29" fill="#24241f">君士坦丁被拥立</text><text x="482" y="991" font-size="22" fill="#77766e">此前的迫害尚未成为终局；后续改变留待第三部分。</text><text x="60" y="1094" font-size="22" fill="#1b365d">顺序示意，非等比例年表。公元70年毁城与哈德良时期的镇压是两轮不同的断裂。</text><text x="60" y="1130" font-size="20" fill="#77766e">来源：第14章 PDF第295—320页。未将起义钱币上的宣言当作已控制圣城的证据。</text></svg>