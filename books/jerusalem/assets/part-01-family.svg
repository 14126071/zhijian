<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1150" role="img" aria-labelledby="title desc"><title id="title">希律家族：阅读所需的主要人物</title><desc id="desc">实线为父子或父女关系。大希律的三个所示儿子并非同母；阿里斯托布鲁斯是米利暗的儿子，亚基帕一世的父亲。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif;fill:#24241f}.blue{fill:#1b365d}.muted{fill:#77766e}</style><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#f5f4ed"/><text x="60" y="60" font-size="20" class="blue" text-anchor="start">第一部分 / 人物辨认</text><text x="60" y="118" font-size="39" class="" text-anchor="start">同样叫“希律”，并不是同一个人</text><path d="M700 280V320H260V365" fill="none" stroke="#8e9785" stroke-width="2"/><path d="M700 320V365" fill="none" stroke="#8e9785" stroke-width="2"/><path d="M700 320H1140V365" fill="none" stroke="#8e9785" stroke-width="2"/><path d="M1140 505V570" fill="none" stroke="#8e9785" stroke-width="2"/><path d="M1140 710V760H880V825" fill="none" stroke="#8e9785" stroke-width="2"/><path d="M1140 760H1210V825" fill="none" stroke="#8e9785" stroke-width="2"/><rect x="500" y="180" width="400" height="100" rx="5" fill="#faf9f5" stroke="#dddcd0"/><text x="524" y="219" font-size="27" class="blue" text-anchor="start">大希律</text><text x="524" y="258" font-size="21" class="muted" text-anchor="start">借助罗马统治，扩建圣殿</text><rect x="80" y="365" width="360" height="140" rx="5" fill="#faf9f5" stroke="#dddcd0"/><text x="104" y="404" font-size="27" class="blue" text-anchor="start">阿基劳斯</text><text x="104" y="443" font-size="21" class="muted" text-anchor="start">继承犹地亚与耶路撒冷</text><text x="104" y="475" font-size="21" class="muted" text-anchor="start">被废后转为罗马直接统治</text><rect x="520" y="365" width="360" height="140" rx="5" fill="#faf9f5" stroke="#dddcd0"/><text x="544" y="404" font-size="27" class="blue" text-anchor="start">希律·安提帕斯</text><text x="544" y="443" font-size="21" class="muted" text-anchor="start">统治加利利等地</text><text x="544" y="475" font-size="21" class="muted" text-anchor="start">与施洗者约翰、耶稣相关</text><rect x="960" y="365" width="360" height="140" rx="5" fill="#faf9f5" stroke="#dddcd0"/><text x="984" y="404" font-size="27" class="blue" text-anchor="start">阿里斯托布鲁斯</text><text x="984" y="443" font-size="21" class="muted" text-anchor="start">大希律与米利暗之子</text><text x="984" y="475" font-size="21" class="muted" text-anchor="start">被父亲处死</text><rect x="960" y="570" width="360" height="140" rx="5" fill="#faf9f5" stroke="#dddcd0"/><text x="984" y="609" font-size="27" class="blue" text-anchor="start">亚基帕一世</text><text x="984" y="648" font-size="21" class="muted" text-anchor="start">依靠罗马宫廷关系复起</text><text x="984" y="680" font-size="21" class="muted" text-anchor="start">曾短暂恢复较完整的王国</text><rect x="710" y="825" width="310" height="140" rx="5" fill="#faf9f5" stroke="#dddcd0"/><text x="734" y="864" font-size="27" class="blue" text-anchor="start">亚基帕二世</text><text x="734" y="903" font-size="21" class="muted" text-anchor="start">拥有北方领地</text><text x="734" y="935" font-size="21" class="muted" text-anchor="start">公元66年劝阻起义</text><rect x="1060" y="825" width="300" height="140" rx="5" fill="#faf9f5" stroke="#dddcd0"/><text x="1084" y="864" font-size="27" class="blue" text-anchor="start">贝勒妮斯</text><text x="1084" y="903" font-size="21" class="muted" text-anchor="start">一世之女、二世之姐</text><text x="1084" y="935" font-size="21" class="muted" text-anchor="start">请求总督停止暴行</text><rect x="80" y="570" width="550" height="338" rx="5" fill="#e8e6dc"/><text x="110" y="620" font-size="26" class="" text-anchor="start">读到这些名字，先想起他们的角色</text><text x="110" y="674" font-size="21" class="muted" text-anchor="start">大希律：建殿的父亲。</text><text x="110" y="717" font-size="21" class="muted" text-anchor="start">安提帕斯：耶稣时代的加利利统治者。</text><text x="110" y="760" font-size="21" class="muted" text-anchor="start">亚基帕一世：短暂的复辟国王。</text><text x="110" y="803" font-size="21" class="muted" text-anchor="start">亚基帕二世：起义前的调停者。</text><text x="110" y="846" font-size="21" class="muted" text-anchor="start">约瑟夫斯：另一条线上的史家，非本图王族。</text><text x="60" y="1042" font-size="20" class="blue" text-anchor="start">实线仅表示父子或父女；各支并非同母，图中省略其他配偶、子女与同名者。</text><text x="60" y="1086" font-size="20" class="muted" text-anchor="start">米利暗出身马卡比家族，因此亚基帕一世兼有马卡比与希律两支血统。</text><text x="60" y="1122" font-size="18" class="muted" text-anchor="start">来源：PDF第178、209—227、261—271、284—292页。</text></svg>