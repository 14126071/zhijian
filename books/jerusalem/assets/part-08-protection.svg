<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1180" role="img" aria-labelledby="title desc"><title id="title">列强保护与影响的三组渠道</title><desc id="desc">英国、法国和俄国在本部分最突出的介入方式；奥斯曼统治、各国政策和社群反应都并非固定不变。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1180" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">第八部分 / 保护身份背后的不同关切</text><text x="60" y="120" font-size="42" fill="#24241f">外交利益、教友与制度渠道</text><text x="60" y="168" font-size="23" fill="#77766e">选取本部分三组主要关系，不代表各国、宗教群体或每个领事始终立场一致。</text><rect x="60" y="220" width="1280" height="120" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="90" y="266" font-size="30" fill="#1b365d">城市仍在奥斯曼统治之下</text><text x="90" y="312" font-size="25" fill="#24241f">苏丹与地方官回应外交压力，也继续裁判、许可、改革和执法。</text><rect x="60" y="385" width="400" height="590" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="434" font-size="28" fill="#1b365d">英国的主要渠道</text><text x="85" y="493" font-size="23" fill="#1b365d">外交关切</text><text x="85" y="533" font-size="22" fill="#77766e">制衡法国与俄国的影响</text><text x="85" y="568" font-size="22" fill="#77766e">以保护犹太人扩大存在</text><text x="85" y="626" font-size="23" fill="#1b365d">参与手段</text><text x="85" y="666" font-size="22" fill="#77766e">领事干预、医疗与农场</text><text x="85" y="701" font-size="22" fill="#77766e">部分福音派推动回归及改宗</text><text x="85" y="759" font-size="23" fill="#1b365d">不能混同</text><text x="85" y="799" font-size="22" fill="#77766e">给予保护和救济</text><text x="85" y="834" font-size="22" fill="#77766e">不等于尊重宗教自主</text><text x="85" y="944" font-size="16" fill="#77766e">PDF 708—718</text><rect x="500" y="385" width="400" height="590" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="525" y="434" font-size="28" fill="#1b365d">法国的主要渠道</text><text x="525" y="493" font-size="23" fill="#1b365d">外交关切</text><text x="525" y="533" font-size="22" fill="#77766e">维护天主教教友地位</text><text x="525" y="568" font-size="22" fill="#77766e">寻求国家和统治者声望</text><text x="525" y="626" font-size="23" fill="#1b365d">参与手段</text><text x="525" y="666" font-size="22" fill="#77766e">领事、教会和修缮权争取</text><text x="525" y="701" font-size="22" fill="#77766e">教堂、学校与其他建设</text><text x="525" y="759" font-size="23" fill="#1b365d">不能混同</text><text x="525" y="799" font-size="22" fill="#77766e">支持方济各会等机构</text><text x="525" y="834" font-size="22" fill="#77766e">不等于取得城市主权</text><text x="525" y="944" font-size="16" fill="#77766e">PDF 731—733、743、763</text><rect x="940" y="385" width="400" height="590" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="965" y="434" font-size="28" fill="#1b365d">俄国的主要渠道</text><text x="965" y="493" font-size="23" fill="#1b365d">外交关切</text><text x="965" y="533" font-size="22" fill="#77766e">东正教保护与皇室使命</text><text x="965" y="568" font-size="22" fill="#77766e">在圣地保持长期影响</text><text x="965" y="626" font-size="23" fill="#1b365d">参与手段</text><text x="965" y="666" font-size="22" fill="#77766e">外交要求、朝圣组织</text><text x="965" y="701" font-size="22" fill="#77766e">土地、大院、教堂与住宿</text><text x="965" y="759" font-size="23" fill="#1b365d">不能混同</text><text x="965" y="799" font-size="22" fill="#77766e">资助东正教的朝圣</text><text x="965" y="834" font-size="22" fill="#77766e">不等于保护俄国犹太人</text><text x="965" y="944" font-size="16" fill="#77766e">PDF 725—733、758、790—796</text><text x="60" y="1042" font-size="26" fill="#1b365d">共同出现的设施：领事馆、医院、学校、宗教建筑、朝圣接待和土地经营。</text><text x="60" y="1090" font-size="23" fill="#24241f">实际帮助、附加条件与政治利益需要分别判断；居民也会利用、抵抗或另寻援助。</text><text x="60" y="1140" font-size="20" fill="#77766e">来源：图中所列页段。三列为阅读归纳，非完整外交制度表。</text></svg>