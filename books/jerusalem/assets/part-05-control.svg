<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1290" role="img" aria-labelledby="title desc"><title id="title">夺城、守城、圣地与朝圣权</title><desc id="desc">七个关键节点，区分军事征服、交城条件、朝圣通行、拆墙与圣地管理安排；不是完整政权年表。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1290" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">第五部分 / 别把几种“得到圣城”混为一谈</text><text x="60" y="120" font-size="42" fill="#24241f">夺城、守城、圣地与朝圣权</text><text x="60" y="168" font-size="24" fill="#77766e">谁控制城市？谁管理圣地？谁能进入？每一次变化都需要具体辨认。</text><rect x="60" y="215" width="1280" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="252" font-size="27" fill="#1b365d">1099年</text><text x="85" y="298" font-size="17" fill="#77766e">PDF 460—470</text><text x="480" y="252" font-size="29" fill="#24241f">军事夺城</text><text x="480" y="298" font-size="22" fill="#77766e">拉丁统治建立；屠杀、奴役与人口流失改变了居民生活。</text><rect x="60" y="348" width="1280" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="385" font-size="27" fill="#1b365d">1187年</text><text x="85" y="431" font-size="17" fill="#77766e">PDF 540—542、548—551</text><text x="480" y="385" font-size="29" fill="#24241f">谈判交城</text><text x="480" y="431" font-size="22" fill="#77766e">萨拉丁掌握圣城；赎金、释放与奴役，带来不同的个人命运。</text><rect x="60" y="481" width="1280" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="518" font-size="27" fill="#1b365d">1192年</text><text x="85" y="564" font-size="17" fill="#77766e">PDF 568—569</text><text x="480" y="518" font-size="29" fill="#24241f">朝圣通行开放</text><text x="480" y="564" font-size="22" fill="#77766e">耶路撒冷仍由萨拉丁掌握，基督教王国以沿海阿克为中心。</text><rect x="60" y="614" width="1280" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="651" font-size="27" fill="#1b365d">1219年</text><text x="85" y="697" font-size="17" fill="#77766e">PDF 572—573</text><text x="480" y="651" font-size="29" fill="#24241f">主动拆除城防</text><text x="480" y="697" font-size="22" fill="#77766e">统治者防备远征者占城；居民失去防御，大量逃离。</text><rect x="60" y="747" width="1280" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="784" font-size="27" fill="#1b365d">1229年</text><text x="85" y="830" font-size="17" fill="#77766e">PDF 578—581</text><text x="480" y="784" font-size="29" fill="#24241f">协议拆分管理</text><text x="480" y="830" font-size="22" fill="#77766e">城市与通海走廊交基督教一方；穆斯林保留圣殿山。</text><rect x="60" y="880" width="1280" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="917" font-size="27" fill="#1b365d">1239年及其后</text><text x="85" y="963" font-size="17" fill="#77766e">PDF 582</text><text x="480" y="917" font-size="29" fill="#24241f">再度易手</text><text x="480" y="963" font-size="22" fill="#77766e">城防被毁、领主继续争夺；圣殿山的用途再次变化。</text><rect x="60" y="1013" width="1280" height="114" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="85" y="1050" font-size="27" fill="#1b365d">1244年</text><text x="85" y="1096" font-size="17" fill="#77766e">PDF 583、586—587</text><text x="480" y="1050" font-size="29" fill="#24241f">花剌子模军入城</text><text x="480" y="1096" font-size="22" fill="#77766e">教堂与墓葬遭破坏，居民被杀；不同于后来的蒙古征服军。</text><text x="60" y="1202" font-size="23" fill="#1b365d">只列关键节点，非完整政权年表。条约签订不等于所有居民的权利已获保障。</text><text x="60" y="1245" font-size="20" fill="#77766e">来源：图中所列页段。“城市控制／圣地管理／朝圣通行”的区分为阅读归纳。</text></svg>