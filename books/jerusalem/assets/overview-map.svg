<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1660" role="img" aria-labelledby="title desc"><title id="title">九部分与后记，追踪同一座城市</title><desc id="desc">依据已整理正文与后记；分部突出叙事重心，居民与信仰始终交叠。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1660" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">全书概览 / 综合回读 · v2</text><text x="60" y="120" font-size="42" fill="#24241f">九部分与后记，追踪同一座城市</text><text x="60" y="168" font-size="23" fill="#77766e">依据已整理正文与后记；分部突出叙事重心，居民与信仰始终交叠。</text><path d="M95 270V1510" stroke="#c4c5b8" stroke-width="3"/><circle cx="95" cy="268" r="22" fill="#1b365d"/><text x="81" y="276" font-size="22" fill="#faf9f5">01</text><rect x="145" y="225" width="1195" height="112" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="260" font-size="25" fill="#1b365d">犹太教 · 第1—13章</text><text x="172" y="308" font-size="19" fill="#77766e">PDF 60—292</text><text x="690" y="259" font-size="24" fill="#24241f">古代起源—公元70年</text><text x="690" y="304" font-size="20" fill="#77766e">王城与圣殿；流亡后经典、律法与记忆维系身份。</text><circle cx="95" cy="400" r="22" fill="#1b365d"/><text x="81" y="408" font-size="22" fill="#faf9f5">02</text><rect x="145" y="357" width="1195" height="112" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="392" font-size="25" fill="#1b365d">异教 · 第14章</text><text x="172" y="440" font-size="19" fill="#77766e">PDF 293—320</text><text x="690" y="391" font-size="24" fill="#24241f">70—312年</text><text x="690" y="436" font-size="20" fill="#77766e">罗马改造城市；犹太记忆与基督徒圣地传统继续延伸。</text><circle cx="95" cy="532" r="22" fill="#1b365d"/><text x="81" y="540" font-size="22" fill="#faf9f5">03</text><rect x="145" y="489" width="1195" height="112" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="524" font-size="25" fill="#1b365d">基督教 · 第15—16章</text><text x="172" y="572" font-size="19" fill="#77766e">PDF 321—372</text><text x="690" y="523" font-size="24" fill="#24241f">312—630年</text><text x="690" y="568" font-size="20" fill="#77766e">帝国支持建城与朝圣，也带来正统竞争、排斥与战争。</text><circle cx="95" cy="664" r="22" fill="#1b365d"/><text x="81" y="672" font-size="22" fill="#faf9f5">04</text><rect x="145" y="621" width="1195" height="112" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="656" font-size="25" fill="#1b365d">伊斯兰教 · 第17—20章</text><text x="172" y="704" font-size="19" fill="#77766e">PDF 373—450</text><text x="690" y="655" font-size="24" fill="#24241f">630—1099年</text><text x="690" y="700" font-size="20" fill="#77766e">重新营建与解释旧圣地；王朝和政策不断变化。</text><circle cx="95" cy="796" r="22" fill="#1b365d"/><text x="81" y="804" font-size="22" fill="#faf9f5">05</text><rect x="145" y="753" width="1195" height="112" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="788" font-size="25" fill="#1b365d">十字军东征 · 第21—28章</text><text x="172" y="836" font-size="19" fill="#77766e">PDF 451—588</text><text x="690" y="787" font-size="24" fill="#24241f">1099—1250年</text><text x="690" y="832" font-size="20" fill="#77766e">夺城之后要守城；通行、管理与统治开始分别安排。</text><circle cx="95" cy="928" r="22" fill="#1b365d"/><text x="81" y="936" font-size="22" fill="#faf9f5">06</text><rect x="145" y="885" width="1195" height="112" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="920" font-size="25" fill="#1b365d">马木鲁克 · 第29—30章</text><text x="172" y="968" font-size="19" fill="#77766e">PDF 589—618</text><text x="690" y="919" font-size="24" fill="#24241f">1250—1517年</text><text x="690" y="964" font-size="20" fill="#77766e">宗教资助连接公共用途与家族；建筑繁丽而生活不稳。</text><circle cx="95" cy="1060" r="22" fill="#1b365d"/><text x="81" y="1068" font-size="22" fill="#faf9f5">07</text><rect x="145" y="1017" width="1195" height="112" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="1052" font-size="25" fill="#1b365d">奥斯曼 · 第31—33章</text><text x="172" y="1100" font-size="19" fill="#77766e">PDF 619—667</text><text x="690" y="1051" font-size="24" fill="#24241f">1517—1799年</text><text x="690" y="1096" font-size="20" fill="#77766e">帝国工程、远方信仰与地方家族，共同塑造城市。</text><circle cx="95" cy="1192" r="22" fill="#1b365d"/><text x="81" y="1200" font-size="22" fill="#faf9f5">08</text><rect x="145" y="1149" width="1195" height="112" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="1184" font-size="25" fill="#1b365d">帝国 · 第34—41章</text><text x="172" y="1232" font-size="19" fill="#77766e">PDF 668—797</text><text x="690" y="1183" font-size="24" fill="#24241f">1799—1898年</text><text x="690" y="1228" font-size="20" fill="#77766e">保护、传教、慈善与考古进入；多个社群走出城墙。</text><circle cx="95" cy="1324" r="22" fill="#1b365d"/><text x="81" y="1332" font-size="22" fill="#faf9f5">09</text><rect x="145" y="1281" width="1195" height="112" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="1316" font-size="25" fill="#1b365d">犹太复国主义 · 第42—53章</text><text x="172" y="1364" font-size="19" fill="#77766e">PDF 798—1061</text><text x="690" y="1315" font-size="24" fill="#24241f">1898—1967年</text><text x="690" y="1360" font-size="20" fill="#77766e">家园与国家诉求进入组织和战争；建国、离散与分隔。</text><circle cx="95" cy="1456" r="22" fill="#1b365d"/><text x="81" y="1464" font-size="22" fill="#faf9f5">终</text><rect x="145" y="1413" width="1195" height="112" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="172" y="1448" font-size="25" fill="#1b365d">后记 · 从那时到今晨</text><text x="172" y="1496" font-size="19" fill="#77766e">PDF 1062—1107</text><text x="690" y="1447" font-size="24" fill="#24241f">1967年后—作者写作时</text><text x="690" y="1492" font-size="20" fill="#77766e">共享的条件仍待回答；清晨由具体的人和职责打开。</text><text x="60" y="1582" font-size="23" fill="#1b365d">顺序示意，非等比例年表；序幕未单独精读，后记不是当代局势更新。</text><text x="60" y="1628" font-size="20" fill="#77766e">来源：目录、前言及各分段笔记，对应PDF第6—18、21—39、60—1107页。</text></svg>