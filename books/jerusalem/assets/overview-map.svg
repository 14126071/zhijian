<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1260" role="img" aria-labelledby="title desc"><title id="title">全书九部分阅读地图</title><desc id="desc">按目录顺序排列九部分，时间轴不按实际年数比例绘制；各部分名称不表示其他宗教消失。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif;fill:#141413} .muted{fill:#6b6a64} .blue{fill:#1b365d} .small{font-size:19px} .body{font-size:23px}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#f5f4ed"/><text x="60" y="62" font-size="20" class="blue" text-anchor="start">01 / 全书阅读地图</text><text x="60" y="118" font-size="38" class="" text-anchor="start">九个部分，追踪同一座城市的身份变化</text><text x="60" y="158" font-size="19" class="muted" text-anchor="start">依据目录归纳 · 时间为各部分叙事范围 · 非等比例时间轴</text><line x1="91" y1="215" x2="91" y2="1134" stroke="#d4d3cd" stroke-width="2"/><rect x="130" y="200" width="1210" height="88" rx="4" fill="#faf9f5" stroke="#e8e6dc"/><circle cx="91" cy="242" r="21" fill="#1b365d"/><text x="91" y="249" text-anchor="middle" font-size="19" style="fill:#faf9f5">01</text><text x="155" y="233" font-size="26" class="" text-anchor="start">犹太教</text><text x="155" y="264" font-size="19" class="muted" text-anchor="start">第1—13章</text><text x="390" y="233" font-size="21" class="blue" text-anchor="start">古代起源—公元70年</text><text x="390" y="264" font-size="22" class="" text-anchor="start">王城、圣殿与流亡</text><text x="760" y="249" font-size="19" class="muted" text-anchor="start">大卫、所罗门、巴比伦、希律、耶稣、犹太战争</text><rect x="130" y="305" width="1210" height="88" rx="4" fill="#faf9f5" stroke="#e8e6dc"/><circle cx="91" cy="347" r="21" fill="#1b365d"/><text x="91" y="354" text-anchor="middle" font-size="19" style="fill:#faf9f5">02</text><text x="155" y="338" font-size="26" class="" text-anchor="start">异教</text><text x="155" y="369" font-size="19" class="muted" text-anchor="start">第14章</text><text x="390" y="338" font-size="21" class="blue" text-anchor="start">70—312年</text><text x="390" y="369" font-size="22" class="" text-anchor="start">罗马重新定义城市</text><text x="760" y="354" font-size="19" class="muted" text-anchor="start">罗马统治、哈德良、巴尔·科赫巴</text><rect x="130" y="410" width="1210" height="88" rx="4" fill="#faf9f5" stroke="#e8e6dc"/><circle cx="91" cy="452" r="21" fill="#1b365d"/><text x="91" y="459" text-anchor="middle" font-size="19" style="fill:#faf9f5">03</text><text x="155" y="443" font-size="26" class="" text-anchor="start">基督教</text><text x="155" y="474" font-size="19" class="muted" text-anchor="start">第15—16章</text><text x="390" y="443" font-size="21" class="blue" text-anchor="start">312—630年</text><text x="390" y="474" font-size="22" class="" text-anchor="start">基督教圣城的塑造</text><text x="760" y="459" font-size="19" class="muted" text-anchor="start">君士坦丁、海伦娜、拜占庭、波斯入侵</text><rect x="130" y="515" width="1210" height="88" rx="4" fill="#faf9f5" stroke="#e8e6dc"/><circle cx="91" cy="557" r="21" fill="#1b365d"/><text x="91" y="564" text-anchor="middle" font-size="19" style="fill:#faf9f5">04</text><text x="155" y="548" font-size="26" class="" text-anchor="start">伊斯兰教</text><text x="155" y="579" font-size="19" class="muted" text-anchor="start">第17—20章</text><text x="390" y="548" font-size="21" class="blue" text-anchor="start">630—1099年</text><text x="390" y="579" font-size="22" class="" text-anchor="start">新的信仰进入旧圣地</text><text x="760" y="564" font-size="19" class="muted" text-anchor="start">阿拉伯征服、倭玛亚、阿拔斯、法蒂玛</text><rect x="130" y="620" width="1210" height="88" rx="4" fill="#faf9f5" stroke="#e8e6dc"/><circle cx="91" cy="662" r="21" fill="#1b365d"/><text x="91" y="669" text-anchor="middle" font-size="19" style="fill:#faf9f5">05</text><text x="155" y="653" font-size="26" class="" text-anchor="start">十字军东征</text><text x="155" y="684" font-size="19" class="muted" text-anchor="start">第21—28章</text><text x="390" y="653" font-size="21" class="blue" text-anchor="start">1099—1250年</text><text x="390" y="684" font-size="22" class="" text-anchor="start">圣战、王国与重新争夺</text><text x="760" y="669" font-size="19" class="muted" text-anchor="start">十字军王国、梅利桑德、萨拉丁、理查</text><rect x="130" y="725" width="1210" height="88" rx="4" fill="#faf9f5" stroke="#e8e6dc"/><circle cx="91" cy="767" r="21" fill="#1b365d"/><text x="91" y="774" text-anchor="middle" font-size="19" style="fill:#faf9f5">06</text><text x="155" y="758" font-size="26" class="" text-anchor="start">马木鲁克</text><text x="155" y="789" font-size="19" class="muted" text-anchor="start">第29—30章</text><text x="390" y="758" font-size="21" class="blue" text-anchor="start">1250—1517年</text><text x="390" y="789" font-size="22" class="" text-anchor="start">苏丹统治下的朝圣之城</text><text x="760" y="774" font-size="19" class="muted" text-anchor="start">拜巴尔斯、纳西尔·穆罕默德、朝圣活动</text><rect x="130" y="830" width="1210" height="88" rx="4" fill="#faf9f5" stroke="#e8e6dc"/><circle cx="91" cy="872" r="21" fill="#1b365d"/><text x="91" y="879" text-anchor="middle" font-size="19" style="fill:#faf9f5">07</text><text x="155" y="863" font-size="26" class="" text-anchor="start">奥斯曼</text><text x="155" y="894" font-size="19" class="muted" text-anchor="start">第31—33章</text><text x="390" y="863" font-size="21" class="blue" text-anchor="start">1517—1799年</text><text x="390" y="894" font-size="22" class="" text-anchor="start">帝国、城墙与地方家族</text><text x="760" y="879" font-size="19" class="muted" text-anchor="start">苏莱曼、神秘主义者、弥赛亚、地方家族</text><rect x="130" y="935" width="1210" height="88" rx="4" fill="#faf9f5" stroke="#e8e6dc"/><circle cx="91" cy="977" r="21" fill="#1b365d"/><text x="91" y="984" text-anchor="middle" font-size="19" style="fill:#faf9f5">08</text><text x="155" y="968" font-size="26" class="" text-anchor="start">帝国</text><text x="155" y="999" font-size="19" class="muted" text-anchor="start">第34—41章</text><text x="390" y="968" font-size="21" class="blue" text-anchor="start">1799—1898年</text><text x="390" y="999" font-size="22" class="" text-anchor="start">世界重新把目光投向圣城</text><text x="760" y="984" font-size="19" class="muted" text-anchor="start">拿破仑、欧洲列强、传教士、旅行者、考古学家</text><rect x="130" y="1040" width="1210" height="88" rx="4" fill="#faf9f5" stroke="#e8e6dc"/><circle cx="91" cy="1082" r="21" fill="#1b365d"/><text x="91" y="1089" text-anchor="middle" font-size="19" style="fill:#faf9f5">09</text><text x="155" y="1073" font-size="26" class="" text-anchor="start">犹太复国主义</text><text x="155" y="1104" font-size="19" class="muted" text-anchor="start">第42—53章</text><text x="390" y="1073" font-size="21" class="blue" text-anchor="start">1898—1967年</text><text x="390" y="1104" font-size="22" class="" text-anchor="start">民族诉求、托管与战争</text><text x="760" y="1089" font-size="19" class="muted" text-anchor="start">赫茨尔、阿拉伯起义、英国托管、1948年、六日战争</text><text x="60" y="1190" font-size="21" class="blue" text-anchor="start">阅读提示：分部标题突出叙事重心，不表示信仰或人口被整齐替换。</text><text x="60" y="1225" font-size="18" class="muted" text-anchor="start">来源：PDF目录第6—18页；主体止于1967年的说明见前言第37—38页。</text></svg>