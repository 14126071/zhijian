<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1110" role="img" aria-labelledby="title desc"><title id="title">苏莱曼时代的四类城市工程</title><desc id="desc">防御、供水、圣地外观与慈善设施相互补充；既利用既有城市，也改变人们使用城市的方式。</desc><defs><style>text{font-family:"Songti SC","STSong","PingFang SC",serif}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#1b365d" stroke-width="1.5"/></marker></defs><rect width="1400" height="1110" fill="#f5f4ed"/><text x="60" y="60" font-size="22" fill="#1b365d">第七部分 / 从四类工程读城市</text><text x="60" y="120" font-size="42" fill="#24241f">皇室声望，也进入日常生活</text><text x="60" y="168" font-size="23" fill="#77766e">不是城市平面图。四类工程相互补充；岩石圆顶等建筑早于苏莱曼。</text><rect x="60" y="225" width="590" height="270" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="90" y="273" font-size="29" fill="#1b365d">01  城墙与城门</text><text x="90" y="325" font-size="26" fill="#24241f">防御、边界与皇权形象</text><text x="90" y="376" font-size="23" fill="#77766e">城墙连接更早的遗存</text><text x="90" y="415" font-size="23" fill="#77766e">新石料与旧建筑材料并用</text><text x="90" y="454" font-size="23" fill="#77766e">不是把整座古城从零重建</text><rect x="750" y="225" width="590" height="270" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="780" y="273" font-size="29" fill="#1b365d">02  引水渠与喷泉</text><text x="780" y="325" font-size="26" fill="#24241f">把取水需要纳入帝国工程</text><text x="780" y="376" font-size="23" fill="#77766e">引水渠、饮水点与圣地喷泉</text><text x="780" y="415" font-size="23" fill="#77766e">水既服务日常，也服务礼拜</text><text x="780" y="454" font-size="23" fill="#77766e">需要持续的资金和施工组织</text><rect x="60" y="545" width="590" height="270" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="90" y="593" font-size="29" fill="#1b365d">03  圣地外观</text><text x="90" y="645" font-size="26" fill="#24241f">旧建筑获得新的时代印记</text><text x="90" y="696" font-size="23" fill="#77766e">岩石圆顶的装饰得到更换</text><text x="90" y="735" font-size="23" fill="#77766e">琉璃瓦改变人们看到的外观</text><text x="90" y="774" font-size="23" fill="#77766e">整修不等于建筑始建于16世纪</text><rect x="750" y="545" width="590" height="270" rx="5" fill="#faf9f5" stroke="#d7d7ca"/><text x="780" y="593" font-size="29" fill="#1b365d">04  慈善设施</text><text x="780" y="645" font-size="26" fill="#24241f">许蕾姆的资助连接食宿与救济</text><text x="780" y="696" font-size="23" fill="#77766e">利用一座原有马木鲁克宫殿</text><text x="780" y="735" font-size="23" fill="#77766e">设置面包房、旅店与施粥房</text><text x="780" y="774" font-size="23" fill="#77766e">将皇室赞助变成可使用的设施</text><rect x="60" y="880" width="1280" height="112" rx="5" fill="#e8e6dc"/><text x="85" y="923" font-size="27" fill="#1b365d">苏丹未能亲自视察，工程仍由税收、总督、承包人和工匠推进。</text><text x="85" y="965" font-size="23" fill="#24241f">看一座古城，要同时辨认原有建筑、后来的增建与装饰，以及再用的材料。</text><text x="60" y="1055" font-size="20" fill="#77766e">来源：第31—32章 PDF第623—627页。四类划分为阅读归纳，非完整工程清单。</text></svg>